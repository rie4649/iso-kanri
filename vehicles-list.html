<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車両の愛称一覧 | ISO管理</title>
<link rel="stylesheet" href="biz.css">
<style>
  /* 画面：設定と見本。印刷：A4縦に同じ表を上下2枚(真ん中で切ると A4の半分＝A5 が2枚できる) */
  .opts { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
  .opts label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .opts input[type=checkbox] { width:18px; height:18px; }
  .sheet { width:210mm; background:#fff; margin:0 auto; box-shadow:0 1px 6px rgba(0,0,0,.15); }
  .half { height:148mm; box-sizing:border-box; padding:8mm 9mm 6mm; display:flex; flex-direction:column; }
  .cut { height:0; border-top:1px dashed #9ca3af; position:relative; margin-top:-1px; }
  .cut span { position:absolute; left:50%; top:-8px; transform:translateX(-50%); background:#fff; padding:0 6px; font-size:9px; color:#9ca3af; }
  .hd { display:flex; align-items:flex-end; justify-content:space-between; border-bottom:2px solid #1e3a5f; padding-bottom:3mm; margin-bottom:3mm; }
  .hd h2 { margin:0; font-size:17pt; color:#1e3a5f; letter-spacing:.05em; }
  .hd .meta { font-size:8.5pt; color:#475569; text-align:right; line-height:1.5; }
  .lead { font-size:9pt; color:#334155; margin-bottom:2.5mm; }
  .cols { display:flex; gap:3mm; flex:1; min-height:0; margin-top:1.5mm; }
  .cols table { flex:1; border-collapse:collapse; align-self:flex-start; width:100%; }
  .cols th, .cols td { border:1px solid #94a3b8; padding:0 1.5mm; text-align:left; white-space:nowrap; overflow:hidden; }
  .cols th { background:#e2e8f0; color:#1e3a5f; font-size:8.5pt; height:6mm; }
  .cols td { font-size:var(--fs,10.5pt); height:var(--rh,6.4mm); }
  .cols td.nick { font-weight:900; font-size:var(--fn,12pt); color:#0f172a; }
  .cols td.no { text-align:center; color:#64748b; font-size:8pt; width:6mm; padding:0; }
  .cols td.sub { color:#475569; font-size:calc(var(--fs,10.5pt) - 1.5pt); }
  .ft { font-size:8pt; color:#64748b; margin-top:2mm; }
  .empty { padding:30px; text-align:center; color:#64748b; }
  @media print {
    @page { size:A4 portrait; margin:0; }
    html, body { background:#fff !important; margin:0 !important; padding:0 !important; }
    header, .noPrint { display:none !important; }
    .wrap { padding:0 !important; max-width:none !important; }
    .sheet { box-shadow:none; margin:0; height:296mm; overflow:hidden; }
  }
  @media screen and (max-width:820px) { .sheet { zoom:.45; } }
</style>
</head>
<body>
<header class="bz noPrint">
  <button class="back" onclick="try{sessionStorage.setItem('isoRestore','1')}catch(e){};location.href='index.html'">← ISO管理に戻る</button>
  <div><h1>🚛 車両の愛称と車番の一覧（新入社員用）</h1>
  <div class="sub">マスタ管理の車両から自動で作ります。車両が増えたり変わったりしたら、マスタ管理を直すだけでこの表も変わります</div></div>
</header>
<div class="wrap">
  <div class="opts noPrint">
    <label><input type="checkbox" id="oModel" onchange="render()"> 車種（メーカー・車名）も出す</label>
    <label><input type="checkbox" id="oLoad" onchange="render()"> 最大積載量も出す</label>
    <label><input type="checkbox" id="oTwo" checked onchange="render()"> 1枚に2つ（真ん中で切って2人分）</label>
    <button class="btn pri" onclick="window.print()">🖨️ 印刷する（A4）</button>
  </div>
  <div class="note noPrint" style="margin-bottom:10px;">A4に印刷して点線で切ると、A4の半分の大きさの表が2枚できます。印刷の設定は「倍率：100％（実際のサイズ）」「余白：なし」にしてください。</div>
  <div id="out"><div class="empty">読み込み中…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let vehicles = [], company = "株式会社関根商店";
const esc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// マスタ管理・業務管理と同じ：太い字＝愛称(なければ車番)、その下に車番
const vkey = s => String(s || "").normalize("NFKC").replace(/[\s\u3000]/g, "").toLowerCase();
const nick = v => String(v.nickname || "").trim() || String(v.number || "").trim();
const plate = v => { const n = String(v.number || "").trim(); return n && vkey(n) !== vkey(nick(v)) ? n : ""; };
// 並び順：呼び名が数字のもの(265・340など)を先に番号順、そのあと名前順(写真の記録と同じ)
function vSort(a, b){
  const na = nick(a) || plate(a), nb = nick(b) || plate(b), ia = /^\d/.test(na), ib = /^\d/.test(nb);
  if (ia !== ib) return ia ? -1 : 1;
  return na.localeCompare(nb, "ja", { numeric:true });
}
function ymdJ(d){ return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"; }

function half(list){
  const model = document.getElementById("oModel").checked, load = document.getElementById("oLoad").checked;
  // 台数に合わせて列の数(2〜3列)・行の高さ・文字の大きさを決める(A4の半分に収まるように)
  const ncol = (model || load || list.length <= 16) ? 2 : 3;
  const per = Math.ceil(list.length / ncol) || 1;
  const rh = Math.max(4.6, Math.min(9, 108 / (per + 1)));
  const fs = Math.max(8, Math.min(16, rh * 1.55));
  const head = '<tr><th style="width:5mm;"></th><th>愛称</th><th>車両番号</th>'+(model ? '<th>車種</th>' : '')+(load ? '<th>積載</th>' : '')+'</tr>';
  const row = (v, i) => '<tr><td class="no">'+(i+1)+'</td><td class="nick">'+esc(nick(v) || "—")+'</td><td>'+esc(plate(v) || "—")+'</td>'+
    (model ? '<td class="sub">'+esc([v.maker, v.model].filter(Boolean).join(" "))+'</td>' : '')+
    (load ? '<td class="sub">'+(v.maxLoad ? esc(Number(v.maxLoad) ? Number(v.maxLoad).toLocaleString()+"kg" : v.maxLoad) : "")+'</td>' : '')+'</tr>';
  let cols = "";
  for (let c = 0; c < ncol; c++){ const part = list.slice(c * per, (c + 1) * per);
    cols += part.length ? '<table>'+head+part.map((v, i) => row(v, i + c * per)).join("")+'</table>' : '<div style="flex:1"></div>'; }
  return '<div class="half" style="--rh:'+rh.toFixed(2)+'mm;--fs:'+(fs * 0.78).toFixed(1)+'pt;--fn:'+fs.toFixed(1)+'pt;">'+
    '<div class="hd"><h2>車両の愛称と車両番号</h2><div class="meta">'+esc(company)+'<br>'+ymdJ(new Date())+' 現在・'+list.length+'台</div></div>'+
    '<div class="cols">'+cols+'</div>'+
    '<div class="ft">わからないときは事務所に聞いてください。</div></div>';
}
function render(){
  const out = document.getElementById("out");
  if (!vehicles.length){ out.innerHTML = '<div class="empty">車両がまだ登録されていません（マスタ管理の「車両」に入れると、ここに並びます）</div>'; return; }
  // 並び順は業務管理の車両台帳(▲▼で並べた順)に合わせる。台帳にない車両は後ろに名前順
  const pos = v => { const k1 = vkey(v.number), k2 = vkey(v.nickname); const i = ledger.findIndex(l => (k1 && vkey(l.plateNumber) === k1) || (k2 && vkey(l.nickname) === k2)); return i < 0 ? 9999 : i; };
  const list = vehicles.slice().sort((a, b) => pos(a) - pos(b) || vSort(a, b)), h = half(list);
  out.innerHTML = '<div class="sheet">'+h+(document.getElementById("oTwo").checked ? '<div class="cut"><span>✂ ここで切る</span></div>'+h : '')+'</div>';
}
let ledger = [];
db.collection("vehicleLedger").get().then(s => { const ord = x => x.order ?? x.sortOrder ?? x.sort ?? 9999;
  ledger = s.docs.map(d => d.data()).sort((a, b) => ord(a) - ord(b)); render(); }).catch(() => {});
db.collection("master_vehicles").onSnapshot(s => { vehicles = s.docs.map(d => ({ id:d.id, ...d.data() })); render(); }, e => { document.getElementById("out").innerHTML = '<div class="empty">読み込みエラー: '+esc(e.message)+'</div>'; });
db.collection("companyInfo").doc("profile").get().then(d => { if (d.exists && d.data().company){ company = d.data().company; render(); } }).catch(() => {});
</script>
</body>
</html>
