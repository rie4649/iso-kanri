<script>
/* ===== Firebase読み取り節約(通信の自動休止・再開) 2026-10 =====
   ・画面が見えていない(別タブ・最小化・スマホのスリープ)状態が5分続いたら、リアルタイム監視を止めます
     → 画面に戻ると自動で再開します
   ・夜間(19時〜翌6時)は、30分さわらなければ休止します(モニター出しっぱなし対策)
     → 画面をタップすると再開、朝6時には自動で再開します
   ※このブロックは全アプリ共通です。時間を変えるときは下の数字だけ変えてください */
(function(){
  if(!window.firebase || !firebase.firestore) return;
  var NIGHT_FROM = 19;              // 夜間休止の開始(時)
  var NIGHT_TO   = 6;               // 夜間休止の終了(時)
  var HIDDEN_WAIT = 5*60*1000;      // 見えなくなってから休止するまで(5分)
  var NIGHT_IDLE  = 30*60*1000;     // 夜間、さわらずに休止するまで(30分)

  var subs = [], paused = false, reason = '', hiddenTimer = null, lastInput = Date.now(), overlay = null;
  function isNight(){ var h = new Date().getHours(); return h >= NIGHT_FROM || h < NIGHT_TO; }
  function isVisible(){ return document.visibilityState !== 'hidden'; }

  // onSnapshot(リアルタイム監視)を、止めたり再開したりできる形に包む
  function wrap(proto){
    if(!proto) return;
    var orig = proto.onSnapshot;
    if(!orig || orig.__fsSaver) return;
    var w = function(){
      var s = { ref:this, args:Array.prototype.slice.call(arguments), unsub:null, dead:false };
      s.start = function(){ if(!s.dead && !s.unsub) s.unsub = orig.apply(s.ref, s.args); };
      s.stop  = function(){ if(s.unsub){ try{ s.unsub(); }catch(e){} s.unsub = null; } };
      subs.push(s);
      if(!paused) s.start();
      return function(){ s.dead = true; s.stop(); var i = subs.indexOf(s); if(i >= 0) subs.splice(i, 1); };
    };
    w.__fsSaver = true;
    proto.onSnapshot = w;
  }
  wrap(firebase.firestore.Query && firebase.firestore.Query.prototype);
  wrap(firebase.firestore.CollectionReference && firebase.firestore.CollectionReference.prototype);
  wrap(firebase.firestore.DocumentReference && firebase.firestore.DocumentReference.prototype);

  function showOverlay(){
    if(!document.body) return;
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'fsSaverOverlay';
      overlay.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;');
      overlay.innerHTML = '<div style="background:#fff;color:#1f2937;border-radius:16px;padding:24px 22px;max-width:420px;width:100%;text-align:center;font-family:sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);">'
        + '<div style="font-size:42px;line-height:1;">💤</div>'
        + '<div style="font-size:20px;font-weight:bold;margin:10px 0 8px;">通信を休止しています</div>'
        + '<div style="font-size:14px;line-height:1.7;color:#4b5563;">夜間(' + NIGHT_FROM + '時〜翌' + NIGHT_TO + '時)は、Firebaseの無料枠を節約するため自動で休止します。<br>朝' + NIGHT_TO + '時に自動で再開します。</div>'
        + '<div style="margin-top:16px;background:#16a34a;color:#fff;border-radius:999px;padding:12px;font-size:16px;font-weight:bold;">👆 タップして再開</div>'
        + '</div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ if(overlay) overlay.style.display = 'none'; }

  function pause(why){
    if(paused) return;
    paused = true; reason = why;
    subs.forEach(function(s){ s.stop(); });
    if(why === 'night') showOverlay();
  }
  function resume(byTap){
    lastInput = Date.now();
    if(!paused) return;
    paused = false; reason = '';
    // タップで再開したときは、そのタップが下のボタンに届かないよう少し待ってから幕を外す
    if(byTap) setTimeout(hideOverlay, 500); else hideOverlay();
    subs.forEach(function(s){ s.start(); });
  }

  // 画面の表示・非表示
  document.addEventListener('visibilitychange', function(){
    if(isVisible()){
      if(hiddenTimer){ clearTimeout(hiddenTimer); hiddenTimer = null; }
      resume(false);
    }else if(!hiddenTimer){
      hiddenTimer = setTimeout(function(){ hiddenTimer = null; if(!isVisible()) pause('hidden'); }, HIDDEN_WAIT);
    }
  });

  // さわったら「使っている」とみなす(休止中なら再開)
  ['pointerdown','touchstart','keydown','wheel'].forEach(function(ev){
    window.addEventListener(ev, function(e){
      if(paused && reason === 'night'){ resume(true); return; }
      lastInput = Date.now();
    }, { capture:true, passive:true });
  });

  // 1分ごとに夜間・朝の判定
  setInterval(function(){
    if(!isVisible()) return;
    if(!paused && isNight() && Date.now() - lastInput > NIGHT_IDLE) pause('night');
    else if(paused && reason === 'night' && !isNight()) resume(false);
  }, 60*1000);

  // 確認用(ブラウザのコンソールで fsSaver.status() と打つと状態が見られます)
  window.fsSaver = {
    status: function(){ return { paused:paused, reason:reason, listeners:subs.length }; },
    pause: function(){ pause('night'); },
    resume: function(){ resume(false); }
  };
})();
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DOC_COL = "isoKyokaDocs";     // 許可証の情報
const CHUNK_COL = "isoKyokaChunks"; // 中身(分割base64)

const CHUNK_SIZE = 700 * 1024;        // Firestoreの1MB制限より小さく分割
const MAX_MB = 15;

let docs = [];
let groupOrder = [];
db.collection("isoKyokaSettings").doc("groupOrder").onSnapshot(d=>{
  groupOrder = (d.exists && Array.isArray(d.data().labels)) ? d.data().labels : [];
  renderDocs();
}, err=>console.error(err));
let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2800); }
function esc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtSize(b){ if(!b) return ""; if(b<1024*1024) return Math.round(b/1024)+"KB"; return (b/1024/1024).toFixed(1)+"MB"; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }


db.collection(DOC_COL).onSnapshot(snap=>{
  docs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  docs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  renderDocs();
}, err=>{ console.error(err); toast("⚠️ 読み込みエラー: "+err.message); });

function renderDocs(){
  const box = document.getElementById("docList");
  if(!docs.length){ box.innerHTML = '<div class="empty">まだ許可証がありません。<br>スキャンしたPDFや写真を上からアップしてください</div>'; return; }
  const byLabel = {};
  docs.forEach(d=>{
    const k = d.type || "その他";
    (byLabel[k] = byLabel[k] || []).push(d);
  });
  let labels = Object.keys(byLabel).sort((a,b)=>a.localeCompare(b,"ja"));
  labels.sort((a,b)=>{
    const ia = groupOrder.indexOf(a), ib = groupOrder.indexOf(b);
    if(ia<0 && ib<0) return 0;
    if(ia<0) return 1;
    if(ib<0) return -1;
    return ia-ib;
  });
  window._kyokaLabels = labels;
  box.innerHTML = labels.map((y,li)=>`
    <div class="yearHead" style="display:flex;align-items:center;gap:8px;">
      <span style="flex:1;">📜 ${esc(y)}</span>
      <button onclick="moveGroup(${li},-1)" ${li===0?"disabled":""} style="border:none;border-radius:8px;background:#e4e4e7;color:#3f3f46;padding:6px 12px;font-size:14px;font-weight:bold;">▲</button>
      <button onclick="moveGroup(${li},1)" ${li===labels.length-1?"disabled":""} style="border:none;border-radius:8px;background:#e4e4e7;color:#3f3f46;padding:6px 12px;font-size:14px;font-weight:bold;">▼</button>
    </div>
    ${byLabel[y].map(d=>`
      <div class="card">
        <div class="info">
          <div class="ttl">📄 ${esc(d.dateKind||"許可期限")} ${esc(d.date||"")}</div>
          <div class="sub">${esc(d.fileName||"")} ・ ${fmtSize(d.size)}</div>
        </div>
        <button class="openBtn" onclick="openDoc('${d.id}')">開く</button>
      </div>`).join("")}
  `).join("");
}

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(",")[1]);
    r.onerror = ()=>reject(new Error("ファイルを読み込めませんでした"));
    r.readAsDataURL(blob);
  });
}



window.moveGroup = async function(i, dir){
  const labels = (window._kyokaLabels||[]).slice();
  const j = i + dir;
  if(j < 0 || j >= labels.length) return;
  const t = labels[i]; labels[i] = labels[j]; labels[j] = t;
  try{
    await db.collection("isoKyokaSettings").doc("groupOrder").set({ labels });
  }catch(e){ toast("❌ 並べ替えを保存できませんでした: "+e.message); }
};
window.openDoc = async function(id){
  const d = docs.find(x=>x.id===id);
  if(!d) return;
  const w = window.open("", "_blank"); // 先に開く(スマホのポップアップ制限対策)
  try{
    const snap = await db.collection(CHUNK_COL).where("fileId","==",id).get();
    const parts = snap.docs.map(x=>x.data()).sort((a,b)=>a.idx-b.idx);
    if(!parts.length) throw new Error("中身が見つかりません");
    const b64 = parts.map(p=>p.data).join("");
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: d.fileType||"application/pdf"}));
    if(w) w.location.href = url; else window.open(url,"_blank");
  }catch(e){ if(w) w.close(); toast("❌ 開けませんでした: "+e.message); }
};


</script>
