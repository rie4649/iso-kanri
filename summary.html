<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年間サマリー(マネジメントレビュー)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
  body { background:#f4f4f5; padding-bottom:60px; }
  header { background:#0f766e; color:#fff; padding:14px 16px; }
  header h1 { font-size:19px; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  .wrap { padding:12px; max-width:760px; margin:0 auto; }
  .backBtn { width:100%; padding:12px; border:none; border-radius:12px; background:#555; color:#fff; font-size:15px; font-weight:bold; margin-bottom:10px; }
  .yearRow { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .yBtn { border:none; border-radius:999px; padding:9px 18px; font-size:14px; font-weight:bold; background:#e4e4e7; color:#52525b; }
  .yBtn.act { background:#0f766e; color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:#fff; border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat .k { font-size:12px; color:#71717a; }
  .stat .v { font-size:20px; font-weight:bold; margin-top:2px; }
  .stat .d { font-size:11px; color:#a1a1aa; margin-top:2px; }
  .warn { color:#b91c1c; }
  .ok { color:#15803d; }
  .secHead { font-size:16px; font-weight:bold; color:#0f766e; margin:16px 0 8px; border-bottom:2px solid #0f766e; padding-bottom:4px; }
  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }

  .card .sub { font-size:13px; color:#52525b; margin-top:4px; line-height:1.7; white-space:pre-wrap; }

  .grayBtn { width:100%; padding:12px; border:none; border-radius:12px; background:#e4e4e7; color:#3f3f46; font-size:14px; font-weight:bold; margin-bottom:10px; }

  .modalBg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; overflow:auto; padding:16px; }
  .modalBg.show { display:block; }
  .modal { background:#fff; border-radius:14px; padding:16px; max-width:560px; margin:20px auto; }
  .modal h2 { font-size:17px; margin-bottom:6px; }
  label { display:block; font-size:13px; font-weight:bold; color:#52525b; margin:10px 0 4px; }
  input, textarea { width:100%; padding:10px; font-size:15px; border:1px solid #d4d4d8; border-radius:10px; background:#fff; }
  textarea { min-height:80px; }
  .mBtns { display:flex; gap:8px; margin-top:14px; }
  .mBtns button { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:bold; }
  .mSave { background:#0f766e; color:#fff; }
  .mCancel { background:#e4e4e7; color:#3f3f46; }
  .mDel { width:100%; margin-top:10px; padding:12px; border:none; border-radius:10px; background:#fee2e2; color:#b91c1c; font-size:14px; font-weight:bold; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; }
  @media print {
    .backBtn, .bigBtn, .grayBtn, .miniBtn, .yearRow { display:none !important; }
    body { background:#fff; }
    .stat, .card { box-shadow:none; border:1px solid #ccc; }
  }
  .evPh { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:8px; }
  .evPh figure { margin:0; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; background:#fafafa; cursor:pointer; }
  .evPh img { width:100%; height:120px; object-fit:cover; display:block; background:#e5e7eb; }
  .evPh figcaption { font-size:12px; padding:4px 6px; color:#374151; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .evPh .pdf { height:120px; display:flex; align-items:center; justify-content:center; font-size:40px; background:#fef2f2; }
  .evInfo { font-size:15px; line-height:1.8; } .evInfo .lb { color:#6b7280; font-size:13px; display:inline-block; min-width:60px; }
  .evRow { display:block; padding:9px 26px 9px 8px; border-bottom:1px solid #e5e7eb; color:#111827; text-decoration:none; position:relative; line-height:1.6; }
  .evRow:hover { background:#f0fdfa; } .evRow:last-child { border-bottom:none; }
  .evGo { position:absolute; right:8px; top:50%; transform:translateY(-50%); color:#0f766e; font-size:20px; font-weight:800; }
  .evClip { margin-left:6px; background:#e0f2fe; color:#075985; border-radius:999px; padding:1px 7px; font-size:12px; font-weight:700; }

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ===== Firebase読み取り節約(通信の自動休止・再開) 2026-10 =====
   ・画面が見えていない(別タブ・最小化・スマホのスリープ)状態が5分続いたら、リアルタイム監視を止めます
     → 画面に戻ると自動で再開します
   ・夜間(19時〜翌6時)は、30分さわらなければ休止します(モニター出しっぱなし対策)
     → 画面をタップすると再開、朝6時には自動で再開します
   ※このブロックは全アプリ共通です。時間を変えるときは下の数字だけ変えてください */
(function(){
  if(!window.firebase || !firebase.firestore) return;
  var NIGHT_FROM = 19;              // 夜間休止の開始(時)
  var NIGHT_TO   = 6;               // 夜間休止の終了(時)
  var HIDDEN_WAIT = 5*60*1000;      // 見えなくなってから休止するまで(5分)
  var NIGHT_IDLE  = 30*60*1000;     // 夜間、さわらずに休止するまで(30分)

  var subs = [], paused = false, reason = '', hiddenTimer = null, lastInput = Date.now(), overlay = null;
  function isNight(){ var h = new Date().getHours(); return h >= NIGHT_FROM || h < NIGHT_TO; }
  function isVisible(){ return document.visibilityState !== 'hidden'; }

  // onSnapshot(リアルタイム監視)を、止めたり再開したりできる形に包む
  function wrap(proto){
    if(!proto) return;
    var orig = proto.onSnapshot;
    if(!orig || orig.__fsSaver) return;
    var w = function(){
      var s = { ref:this, args:Array.prototype.slice.call(arguments), unsub:null, dead:false };
      s.start = function(){ if(!s.dead && !s.unsub) s.unsub = orig.apply(s.ref, s.args); };
      s.stop  = function(){ if(s.unsub){ try{ s.unsub(); }catch(e){} s.unsub = null; } };
      subs.push(s);
      if(!paused) s.start();
      return function(){ s.dead = true; s.stop(); var i = subs.indexOf(s); if(i >= 0) subs.splice(i, 1); };
    };
    w.__fsSaver = true;
    proto.onSnapshot = w;
  }
  wrap(firebase.firestore.Query && firebase.firestore.Query.prototype);
  wrap(firebase.firestore.CollectionReference && firebase.firestore.CollectionReference.prototype);
  wrap(firebase.firestore.DocumentReference && firebase.firestore.DocumentReference.prototype);

  function showOverlay(){
    if(!document.body) return;
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'fsSaverOverlay';
      overlay.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;');
      overlay.innerHTML = '<div style="background:#fff;color:#1f2937;border-radius:16px;padding:24px 22px;max-width:420px;width:100%;text-align:center;font-family:sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);">'
        + '<div style="font-size:42px;line-height:1;">💤</div>'
        + '<div style="font-size:20px;font-weight:bold;margin:10px 0 8px;">通信を休止しています</div>'
        + '<div style="font-size:14px;line-height:1.7;color:#4b5563;">夜間(' + NIGHT_FROM + '時〜翌' + NIGHT_TO + '時)は、Firebaseの無料枠を節約するため自動で休止します。<br>朝' + NIGHT_TO + '時に自動で再開します。</div>'
        + '<div style="margin-top:16px;background:#16a34a;color:#fff;border-radius:999px;padding:12px;font-size:16px;font-weight:bold;">👆 タップして再開</div>'
        + '</div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ if(overlay) overlay.style.display = 'none'; }

  function pause(why){
    if(paused) return;
    paused = true; reason = why;
    subs.forEach(function(s){ s.stop(); });
    if(why === 'night') showOverlay();
  }
  function resume(byTap){
    lastInput = Date.now();
    if(!paused) return;
    paused = false; reason = '';
    // タップで再開したときは、そのタップが下のボタンに届かないよう少し待ってから幕を外す
    if(byTap) setTimeout(hideOverlay, 500); else hideOverlay();
    subs.forEach(function(s){ s.start(); });
  }

  // 画面の表示・非表示
  document.addEventListener('visibilitychange', function(){
    if(isVisible()){
      if(hiddenTimer){ clearTimeout(hiddenTimer); hiddenTimer = null; }
      resume(false);
    }else if(!hiddenTimer){
      hiddenTimer = setTimeout(function(){ hiddenTimer = null; if(!isVisible()) pause('hidden'); }, HIDDEN_WAIT);
    }
  });

  // さわったら「使っている」とみなす(休止中なら再開)
  ['pointerdown','touchstart','keydown','wheel'].forEach(function(ev){
    window.addEventListener(ev, function(e){
      if(paused && reason === 'night'){ resume(true); return; }
      lastInput = Date.now();
    }, { capture:true, passive:true });
  });

  // 1分ごとに夜間・朝の判定
  setInterval(function(){
    if(!isVisible()) return;
    if(!paused && isNight() && Date.now() - lastInput > NIGHT_IDLE) pause('night');
    else if(paused && reason === 'night' && !isNight()) resume(false);
  }, 60*1000);

  // 確認用(ブラウザのコンソールで fsSaver.status() と打つと状態が見られます)
  window.fsSaver = {
    status: function(){ return { paused:paused, reason:reason, listeners:subs.length }; },
    pause: function(){ pause('night'); },
    resume: function(){ resume(false); }
  };
})();
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// 記録者(管理者)と記録日を残す(recby.js)
if (window.RecBy) RecBy.install(db, [ { modal:"#mrBg", before:"#mrBg .mBtns", cols:["isoMgmtReviews"], idInput:"#mrId" } ]);

let year = new Date().getFullYear();
let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2500); }
function esc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

// 年ボタン(今年から過去3年)
function renderYears(){
  const now = new Date().getFullYear();
  const row = document.getElementById("yearRow");
  row.innerHTML = "";
  for(let y=now; y>=now-3; y--){
    row.innerHTML += `<button class="yBtn ${y===year?"act":""}" onclick="setYear(${y})">${y}年</button>`;
  }
}
window.setYear = function(y){ year = y; renderYears(); buildSummary(); renderEventYear(); };

// 集計の定義: コレクション/日付フィールドで年内の件数と直近日
const METRICS = [
  { col:"isoHoreiEval",   name:"✅ 順守評価", extra: list => {
      const ng = list.reduce((n,x)=>n+Object.values(x.results||{}).filter(v=>v==="×").length,0);
      return ng ? `<span class="warn">×が${ng}件</span>` : (list.length?`<span class="ok">全て○</span>`:"");
    } },
  { col:"isoAudits",      name:"🔍 内部監査", extra: list => {
      const open = list.filter(x=>x.status==="open").length;
      return open ? `<span class="warn">対応中 ${open}件</span>` : "";
    } },
  { col:"isoCorrectives", name:"🛠 是正処置", extra: list => {
      const open = list.filter(x=>x.status==="open").length;
      return open ? `<span class="warn">対応中 ${open}件</span>` : (list.length?`<span class="ok">全て完了</span>`:"");
    } },
  { col:"trainingRecords", name:"🎓 教育訓練" },
  { col:"waterTests",     name:"🧪 水質検査" },
  { col:"noiseChecks",    name:"🔊 騒音チェック" },
  { col:"freonRecords",   name:"❄️ フロン点検" },
  { col:"cleanlinessChecks", name:"🧹 清潔チェック" },
  { col:"dieselRecords",  name:"⛽ 軽油の記録" },
  { col:"isoShokakiDocs", name:"🧯 消防書類" },
  { col:"isoKyokaDocs",   name:"📜 許可証(保管総数)", all:true, extra: list => {
      const kigen = list.filter(x=>(x.dateKind||"許可期限")==="許可期限"&&x.date).map(x=>x.date).sort();
      return kigen.length ? `直近期限 ${kigen[0]}` : "";
    } },
  { col:"sdgsProgress",   name:"🌏 SDGs進捗の記録" }
];

let summaryLists = {};
let openDetailIdx = null;

async function buildSummary(){
  const grid = document.getElementById("statGrid");
  grid.innerHTML = '<div class="empty">集計中...</div>';
  document.getElementById("statDetail").innerHTML = "";
  openDetailIdx = null;
  summaryLists = {};
  const cards = await Promise.all(METRICS.map(async (m,mi)=>{
    try{
      const snap = await db.collection(m.col).get();
      let list = snap.docs.map(d=>d.data());
      if(!m.all) list = list.filter(x=>String(x.date||"").startsWith(String(year)));
      list.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      summaryLists[mi] = list;
      const dates = list.map(x=>x.date).filter(Boolean).sort();
      const latest = dates.length ? dates[dates.length-1] : "";
      const extra = m.extra ? m.extra(list) : "";
      return `<div class="stat" style="cursor:pointer;" onclick="showDetail(${mi})">
        <div class="k">${m.name}${m.all?"":`(${year}年)`}</div>
        <div class="v">${list.length}<span style="font-size:13px;font-weight:normal;">件</span></div>
        <div class="d">${latest?`直近: ${esc(latest)}　`:""}${extra}</div>
        <div class="d" style="color:#0f766e;font-weight:bold;">👆 タップで内容を見る</div>
      </div>`;
    }catch(e){
      summaryLists[mi] = [];
      return `<div class="stat"><div class="k">${m.name}</div><div class="d">読み込めませんでした</div></div>`;
    }
  }));
  grid.innerHTML = cards.join("");
}

// 1件を読める1行にする
function describeRec(col, r){
  const d = r.date ? `<b>${esc(r.date)}</b>` : "";
  if(col==="isoHoreiEval"){
    const ng = Object.keys(r.results||{}).filter(k=>r.results[k]==="×");
    return `${d}　評価者:${esc(r.evaluator||"")}　${ng.length?`<span style="color:#b91c1c;">×: ${esc(ng.join("、"))}</span>`:'<span style="color:#15803d;">全て○</span>'}`;
  }
  if(col==="isoAudits") return `${d}　監査員:${esc(r.auditor||"")}　指摘:${esc(r.findings||"なし")}${r.status==="open"?' <span style="color:#b45309;">対応中</span>':''}`;
  if(col==="isoCorrectives") return `${d}　${esc(r.event||"")}${r.status==="open"?' <span style="color:#b45309;">対応中</span>':' <span style="color:#15803d;">完了</span>'}`;
  if(col==="isoKyokaDocs"||col==="isoShokakiDocs") return `${d}　${esc(r.type||r.fileName||"")}`;
  // 汎用: 主要そうな項目を2つまで拾う
  const keys = ["title","theme","location","place","name","kind","goal","target","amount","value","result","memo","notes","note"];
  const bits = [];
  for(const k of keys){
    if(r[k]!==undefined && r[k]!=="" && typeof r[k]!=="object"){ bits.push(esc(String(r[k]).slice(0,40))); if(bits.length>=2) break; }
  }
  return `${d}${bits.length?"　"+bits.join("　"):""}`;
}

window.showDetail = function(mi){
  const box = document.getElementById("statDetail");
  if(openDetailIdx===mi){ box.innerHTML=""; openDetailIdx=null; return; }
  openDetailIdx = mi;
  const m = METRICS[mi];
  const list = summaryLists[mi]||[];
  box.innerHTML = `<div class="card" style="border-left:5px solid #0f766e;">
    <div class="ttl">${m.name}${m.all?"":`(${year}年)`} の内容　<span style="font-size:12px;color:#71717a;">もう一度タップで閉じる</span></div>
    <div class="sub">${list.length ? list.map(r=>describeRec(m.col,r)).join("<br>") : "記録がありません"}</div>
  </div>`;
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
};

/* ---- 年間の活動記録(カレンダー・マークと完全連動) ---- */
let allEvents = [];
let allMarks = [];
let markFilter = "";
db.collection("isoEvents").onSnapshot(snap=>{
  allEvents = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderEventYear();
}, err=>console.error(err));
// マークはマスタ(eventMarks)から自動取得: 新しいマークを作れば自動でここにも出る
db.collection("eventMarks").orderBy("name").onSnapshot(snap=>{
  allMarks = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderEventYear();
}, err=>console.error(err));
function markOf(name){ return allMarks.find(m=>m.name===name); }
function dot(color){ return `<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${esc(color||"#a1a1aa")};margin-right:5px;vertical-align:baseline;"></span>`; }

function renderEventYear(){
  setTimeout(renderEvFiles, 0);
  const box = document.getElementById("eventYearList");
  const list = allEvents.filter(e=>String(e.date||"").startsWith(String(year)));
  list.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!list.length){ box.innerHTML = `<div class="empty">${year}年の活動記録はまだありません(カレンダーに予定を入れるとここに並びます)</div>`; return; }

  // その年に登場するマークごとの件数(マーク一覧はマスタと連動)
  const counts = {};
  list.forEach(e=>{ const k = e.mark || "未分類"; counts[k] = (counts[k]||0)+1; });
  const markNames = allMarks.map(m=>m.name).filter(n=>counts[n]);
  if(counts["未分類"]) markNames.push("未分類");
  if(markFilter && !counts[markFilter]) markFilter = "";

  const chips = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
    <button onclick="setMarkFilter('')" style="border:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:bold;${markFilter===""?"background:#0f766e;color:#fff;":"background:#e4e4e7;color:#52525b;"}">すべて(${list.length})</button>
    ${markNames.map(n=>{
      const m = markOf(n);
      return `<button onclick="setMarkFilter('${esc(n)}')" style="border:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:bold;${markFilter===n?"background:#0f766e;color:#fff;":"background:#e4e4e7;color:#52525b;"}">${dot(m&&m.color)}${esc(n)}(${counts[n]})</button>`;
    }).join("")}
  </div>`;

  const shown = markFilter ? list.filter(e=>(e.mark||"未分類")===markFilter) : list;
  box.innerHTML = chips + `<div class="card"><div class="sub" style="font-size:14px;">押すと、その記録（写真・資料もいっしょに）が開きます</div>${shown.map(e=>{
    const m = markOf(e.mark);
    const n = evItems(e).length;
    return `<a class="evRow" href="#" onclick="openEv('${e.id}');return false;">${dot(m&&m.color)}<b>${esc(e.date)}</b>　${esc(e.title||"")}${e.mark?`<span style="font-size:11px;color:#71717a;">〔${esc(e.mark)}〕</span>`:""}${n?`<span class="evClip">📎${n}</span>`:""}${e.notes?`<span style="color:#71717a;"> — ${esc(e.notes)}</span>`:""}<span class="evGo">›</span></a>`;
  }).join("")}</div>`;
}
window.setMarkFilter = function(n){ markFilter = n; renderEventYear(); renderEvFiles(); };

/* ===== 出来事を見る（内容・写真・資料）=====
   写真・PDFの中身は「isoEventFiles」(アプリのデータベース)に入っている。ここでは見るだけ。足す・消すは「編集する」から */
const EV_FILE_COL = "isoEventFiles";
const isImg = a => String(a.type||"").startsWith("image/");
const fcol = a => a && a.store==="photo" ? "isoPhotoFiles" : EV_FILE_COL;   // 写真は「写真の記録」と同じ保存先
const durl = f => String(f.data||"").startsWith("data:") ? f.data : "data:"+(f.type||"image/jpeg")+";base64,"+f.data;
/* 出来事の写真は「写真の記録」(isoPhotos) の eventId でつながっている。書類(PDF)は出来事の attachments(中身は isoEventFiles) */
let allPh = [];
db.collection("isoPhotos").onSnapshot(sn=>{ allPh = sn.docs.map(d=>({id:d.id, ...d.data()})); renderEventYear(); }, err=>console.error(err));
function evItems(e){
  const pics = allPh.filter(p=>p.eventId===e.id).sort((a,b)=>(a.createdMs||0)-(b.createdMs||0))
    .map(p=>({ name:p.memo||p.targetName||"写真", img:true, thumb:p.thumb||"", fileId:p.id, col:"isoPhotoFiles", url:"" }));
  const at = (e.attachments||[]).filter(a=>a.store!=="photo")   // 写真の記録に入った写真は上で数える
    .map(a=>({ name:a.name, img:isImg(a), thumb:a.thumb||"", fileId:a.fileId, col:EV_FILE_COL, url:"" }));
  return pics.concat(at);
}
function itemFig(x, key, i){
  return `<figure onclick="openItem('${key}',${i})">${x.img?`<img src="${x.thumb||""}" ${x.thumb?"":`data-fid="${x.fileId}" data-col="${x.col}"`} alt="">`:`<div class="pdf">📄</div>`}<figcaption>${x.cap||esc(x.name)}</figcaption></figure>`;
}
const ITEMS = {};
window.openItem = function(key, i){ const x = (ITEMS[key]||[])[i]; if(!x) return; if(x.url){ window.open(x.url, "_blank"); return; } openEvFile(x.fileId, x.img, x.col); };
function renderEvFiles(){
  const box = document.getElementById("evFileList"); if(!box) return;
  const list = allEvents.filter(e=>String(e.date||"").startsWith(String(year)) && (!markFilter || (e.mark||"未分類")===markFilter))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const all = []; list.forEach(e=>evItems(e).forEach(x=>all.push({ ...x, evId:e.id, cap:`<b>${esc(e.date)}</b> ${esc(e.title||"")}<br>${esc(x.name)}` })));
  if(!all.length){ box.innerHTML = `<div class="empty">まだありません。出来事を開いて「編集する・写真を足す」から入れられます</div>`; return; }
  ITEMS.year = all;
  box.innerHTML = `<div class="card"><div class="evPh">${all.map((x,i)=>itemFig(x,"year",i)).join("")}</div><div style="font-size:12px;color:#6b7280;margin-top:6px;">写真は全部「写真の記録」に入っています（「出来事（カレンダー）」のタブ）</div></div>`;
  loadNoThumb(box);
}
// 小さい写真がないものは、中身を読んで出す
function loadNoThumb(box){ box.querySelectorAll("img[data-fid]").forEach(async im=>{ try{ const d = await db.collection(im.dataset.col||EV_FILE_COL).doc(im.dataset.fid).get(); if(d.exists) im.src = durl(d.data()); }catch(err){} }); }
const SRC_COLS = [["metalRecords","金属拾い上げの記録"],["compressorInspections","圧縮機定期点検の記録"],["safetyPatrols","安全衛生パトロールの記録"],["waterTests","水質検査の記録"],["noiseChecks","騒音チェックの記録"]];
window.openEv = async function(id){
  const e = allEvents.find(x=>x.id===id); if(!e) return;
  const m = markOf(e.mark), at = evItems(e); ITEMS.ev = at;
  document.getElementById("evBody").innerHTML = `<h2 style="margin-top:0;">${dot(m&&m.color)}${esc(e.title||"(題名なし)")}</h2>
    <div class="evInfo"><div><span class="lb">日付</span><b>${esc(e.date||"")}</b></div>
    ${e.mark?`<div><span class="lb">マーク</span>${esc(e.mark)}</div>`:""}
    ${e.notes?`<div><span class="lb">内容</span>${esc(e.notes).replace(/\n/g,"<br>")}</div>`:""}
    ${e.recBy?`<div><span class="lb">記録者</span>${esc(e.recBy)}${e.recDate?`（${esc(e.recDate)}）`:""}</div>`:""}</div>
    <div id="evSrc" style="margin-top:8px;"></div>
    <div style="margin-top:12px;font-weight:700;">📎 写真・資料（${at.length}件）</div>
    ${at.length?`<div class="evPh" id="evPhBox">${at.map((x,i)=>itemFig(x,"ev",i)).join("")}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:4px;">押すと大きく開きます（PDFは別の画面で開くので、そこから保存・印刷できます）</div>`
      :`<div style="color:#6b7280;font-size:14px;">まだありません。「編集する・写真を足す」から入れられます</div>`}`;
  document.getElementById("evEditBtn").onclick = ()=>{ location.href = "index.html#evedit="+encodeURIComponent(id)+"&back=summary"; };
  document.getElementById("evBg").classList.add("show");
  const pb = document.getElementById("evPhBox"); if(pb) loadNoThumb(pb);
  // もとの記録(金属拾い上げ・点検・パトロールなど・調査票)があれば、開くボタンを出す
  const box = document.getElementById("evSrc");
  if(e.surveySubId){ box.innerHTML = `<button class="grayBtn" style="margin:0;" onclick="location.href='survey.html#${esc(e.surveyTpl||"astemo")}/${esc(e.surveySubId)}'">↗ 委託先調査票の控えを開く</button>`; return; }
  for(const [c,label] of SRC_COLS){ try{ const q = await db.collection(c).where("eventId","==",id).limit(1).get();
    const hit = q.docs.find(d=>d.data().eventId===id);
    if(hit){ box.innerHTML = `<button class="grayBtn" style="margin:0;" onclick="location.href='index.html#ev=${encodeURIComponent(id)}&back=summary'">↗ ${label}を開く</button><div id="evRel"></div>`;
      showRelated(e, c, label, hit.data()); return; } }catch(err){} }
};
/* もとの記録の写真・資料もいっしょに見せる
   ・もとの記録の添付(水質検査の計量証明書など)
   ・写真の記録「保管・掲示・現場の様子」で、そのページ(水質検査など)を表示先にした項目の写真のうち、撮影日が出来事の前後7日以内のもの */
const SRC_PAGE = { waterTests:"water", safetyPatrols:"safety", compressorInspections:"comp" };
const SRC_FILECOL = { waterTests:"waterTestFiles" };
async function showRelated(e, c, label, rec){
  const el = document.getElementById("evRel"); if(!el) return;
  const items = [];
  (rec.attachments||[]).forEach(a=>items.push({ name:a.name, img:isImg(a), thumb:"", fileId:a.fileId||"", col:SRC_FILECOL[c]||"", url:a.url||"" }));
  const page = SRC_PAGE[c];
  if(page && e.date){ try{
    const st = await db.collection("isoPhotoSettings").doc("recordCats").get();
    const names = ((st.exists && st.data().items) || []).filter(x=>x.page===page).map(x=>x.name);
    const dn = d => Math.round(new Date(String(d).slice(0,10)+"T00:00:00").getTime()/86400000);
    allPh.filter(x=>x.kind==="record" && x.eventId!==e.id && names.includes(x.targetName) && x.shotDate && Math.abs(dn(x.shotDate)-dn(e.date))<=7)
      .forEach(x=>items.push({ name:x.targetName+(x.shotDate?"（"+x.shotDate+" 撮影）":""), img:true, thumb:x.thumb||"", fileId:x.id, col:"isoPhotoFiles", url:"" }));
  }catch(err){} }
  if(!items.length) return;
  window._rel = items;
  el.innerHTML = `<div style="margin-top:12px;font-weight:700;">🔗 ${esc(label)}の写真・資料（${items.length}件）</div><div class="evPh">${items.map((x,i)=>
    `<figure onclick="openRel(${i})">${x.img&&x.thumb?`<img src="${x.thumb}" alt="">`:x.img?`<img id="relIm${i}" src="" alt="">`:`<div class="pdf">📄</div>`}<figcaption>${esc(x.name)}</figcaption></figure>`).join("")}</div>
    <div style="font-size:12px;color:#6b7280;margin-top:4px;">ここに出る写真は「写真の記録」や${esc(label)}に入っているものです（ここでは見るだけ）</div>`;
  items.forEach(async(x,i)=>{ if(x.img && !x.thumb && x.fileId && x.col){ try{ const d = await db.collection(x.col).doc(x.fileId).get(); const im = document.getElementById("relIm"+i); if(d.exists && im) im.src = durl(d.data()); }catch(err){} } });
}
window.openRel = function(i){ const x = (window._rel||[])[i]; if(!x) return; if(x.url){ window.open(x.url, "_blank"); return; } openEvFile(x.fileId, x.img, x.col); };
// summary.html#ev=ID で来たら、その出来事を開く(写真の記録などから)
(function(){ const m = location.hash.match(/^#ev=([^&]+)/); if(!m) return; const id = decodeURIComponent(m[1]); let n = 0;
  const t = () => { const e = allEvents.find(x=>x.id===id); if(e){ const y = Number(String(e.date||"").slice(0,4)); if(y && y!==year && typeof setYear==="function") setYear(y); openEv(id); } else if(n++<30) setTimeout(t, 300); }; setTimeout(t, 500); })();
window.closeEv = function(){ document.getElementById("evBg").classList.remove("show"); };
window.openEvFile = async function(fileId, img, colName){
  const w = img ? null : window.open("", "_blank");
  try{ const d = await db.collection(colName||EV_FILE_COL).doc(fileId).get(); if(!d.exists) throw new Error("ファイルが見つかりません");
    const f = d.data();
    if(img){ document.getElementById("lbImg").src = durl(f); document.getElementById("lbBg").style.display = "flex"; return; }
    const bin = atob(f.data), arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: f.type||"application/pdf" }));
    if(w) w.location.href = url; else window.open(url, "_blank");
  }catch(err){ if(w) w.close(); alert("開けませんでした: "+err.message); }
};

/* ---- マネジメントレビューの記録 ---- */
let mrs = [];
db.collection("isoMgmtReviews").onSnapshot(snap=>{
  mrs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  mrs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  renderMr();
}, err=>console.error(err));

function renderMr(){
  const box = document.getElementById("mrList");
  if(!mrs.length){ box.innerHTML = '<div class="empty">まだレビュー記録がありません。年1回、上の集計を社長に報告して指示を記録しましょう</div>'; return; }
  box.innerHTML = mrs.map(r=>`
    <div class="card">
      <div class="ttl">👔 ${esc(r.date)}</div>
      <div class="sub">出席: ${esc(r.members||"")}\n報告: ${esc(r.report||"")}\n指示・決定: ${esc(r.decision||"")}</div>
      <button class="miniBtn" onclick="openMr('${r.id}')">✏️ 開く</button>
    </div>`).join("");
}
window.openMr = function(id){
  const r = id ? mrs.find(x=>x.id===id) : null;
  document.getElementById("mrId").value = r ? r.id : "";
  document.getElementById("mrDate").value = r ? r.date : todayStr();
  document.getElementById("mrMembers").value = r?.members||"";
  document.getElementById("mrReport").value = r?.report||"";
  document.getElementById("mrDecision").value = r?.decision||"";
  document.getElementById("mrDelBtn").style.display = r ? "block" : "none";
  document.getElementById("mrBg").classList.add("show");
};
window.closeMr = function(){ document.getElementById("mrBg").classList.remove("show"); };
window.saveMr = async function(){
  const date = document.getElementById("mrDate").value;
  if(!date){ toast("開催日を入れてください"); return; }
  const d = {
    date,
    members: document.getElementById("mrMembers").value.trim(),
    report: document.getElementById("mrReport").value.trim(),
    decision: document.getElementById("mrDecision").value.trim()
  };
  const id = document.getElementById("mrId").value;
  try{
    if(id) await db.collection("isoMgmtReviews").doc(id).update(d);
    else await db.collection("isoMgmtReviews").add(d);
    closeMr(); toast("✅ 保存しました");
  }catch(e){ toast("❌ 保存に失敗: "+e.message); }
};
window.delMr = async function(){
  const id = document.getElementById("mrId").value;
  if(!id) return;
  if(!confirm("このレビュー記録を削除しますか？")) return;
  try{ await db.collection("isoMgmtReviews").doc(id).delete(); closeMr(); toast("🗑 削除しました"); }
  catch(e){ toast("❌ 削除に失敗: "+e.message); }
};

renderYears();
buildSummary();
</script>
