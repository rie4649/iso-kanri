<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常点検表</title>
<link rel="stylesheet" href="style.css?v=112">
<style>
body{background:#eef3f8;padding-bottom:120px;font-family:Arial,"Hiragino Sans",sans-serif}
header{background:#2563eb;color:white;padding:24px 10px;text-align:center}
header h1{font-size:34px;margin:0}
.box{background:white;margin:16px auto;padding:18px;border-radius:16px;max-width:780px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.infoRow{display:grid;grid-template-columns:100px 1fr;gap:10px;font-size:22px;padding:10px 0;border-bottom:1px solid #ddd}
select,textarea{width:100%;font-size:22px;padding:14px;border-radius:12px;border:1px solid #aaa;box-sizing:border-box}
.sectionTitle{font-size:24px;font-weight:bold;margin:22px 0 10px;padding:12px;border-radius:12px}
.s1{background:#e8f1ff;color:#1557b0}.s2{background:#eaf8ea;color:#2e7d32}.s3{background:#fff3df;color:#ef7d00}
.s4{background:#f3e8ff;color:#7b1fa2}.s5{background:#ffe9e9;color:#c62828}.s6{background:#e0f5f3;color:#00796b}
.item{display:grid;grid-template-columns:70px 1fr 70px 70px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #ddd;font-size:19px}
.item button{padding:12px 6px;border-radius:10px;border:1px solid #aaa;background:white;font-size:18px;font-weight:bold}
.item button.good.active{background:#2e9d45;color:white}
.item button.bad.active{background:#e53935;color:white}
.badBox{background:#fff0f0;border:2px solid #e53935;color:#b00000;font-size:20px}
.saveBtn{width:92%;max-width:780px;margin:20px auto;display:block;padding:22px;border:none;border-radius:18px;background:#2e9d45;color:white;font-size:28px;font-weight:bold}
.backBtn{width:92%;max-width:780px;margin:16px auto;display:block;padding:16px;border:none;border-radius:16px;background:#555;color:white;font-size:22px;font-weight:bold}
.loadedNote{background:#fff8e1;border:2px solid #ff9800;color:#a05a00;font-size:18px;text-align:center;font-weight:bold;padding:10px;border-radius:12px;margin-bottom:14px;display:none}
.bulkRow{display:flex;gap:10px;margin-bottom:16px}
.bulkRow button{flex:1;padding:16px 8px;border:none;border-radius:14px;font-size:19px;font-weight:bold;color:white}
</style>
</head>
<body>
<header><h1>🚛 日常点検表</h1></header>
<button class="backBtn" onclick="history.back()">← 戻る</button>
<div class="box">
<div id="loadedNote" class="loadedNote">📋 すでに保存されている内容を表示しています。修正したら下の「保存する」を押してください。</div>
<div class="infoRow"><div>車番</div><div id="vehicleText">---</div></div>
<div class="infoRow"><div>日付</div><div id="dateText">---</div></div>
<div class="infoRow"><div>点検者</div><div><select id="staffSelect"></select></div></div>
</div>
<div class="box">
<div class="bulkRow">
<button style="background:#2e9d45;" onclick="setAllGood()">✅ 一括で「良」にする</button>
<button style="background:#888;" onclick="resetAll()">↺ リセット</button>
</div>
<div class="sectionTitle s1">① 運転席まわり</div>
<div id="section1"></div>
<div class="sectionTitle s2">② ボンネットまわり</div>
<div id="section2"></div>
<div class="sectionTitle s3">③ 外まわり</div>
<div id="section3"></div>
<div class="sectionTitle s4">④ 飛散防止</div>
<div id="section4"></div>
<div class="sectionTitle s5">⑤ 落下防止</div>
<div id="section5"></div>
<div class="sectionTitle s6">⑥ 作業者の安全</div>
<div id="section6"></div>
</div>
<div class="box badBox">
<b>否の項目</b>
<div id="badNumbers" style="margin-top:12px;">なし</div>
</div>
<div class="box">
<b style="font-size:22px;">備考</b>
<textarea id="memo" rows="5" placeholder="異常内容・気づいたことを入力"></textarea>
</div>
<button class="saveBtn" onclick="saveDaily()">💾 保存する</button>

<div id="reportConfirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center;padding:18px;">
<div style="background:white;width:100%;max-width:480px;border-radius:18px;padding:24px;text-align:center;">
<h2 style="font-size:24px;margin:0 0 14px;color:#e53935;">⚠️ 不具合報告の確認</h2>
<p style="font-size:18px;line-height:1.7;">備考欄に内容が入力されています。<br>この内容を不具合報告として登録しますか？</p>
<button onclick="submitReport(true)" style="width:100%;padding:18px;border:none;border-radius:14px;background:#e53935;color:white;font-size:22px;font-weight:bold;margin-top:14px;">📮 報告する</button>
<button onclick="submitReport(false)" style="width:100%;padding:16px;border:none;border-radius:14px;background:#555;color:white;font-size:20px;font-weight:bold;margin-top:12px;">スキップして戻る</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="auth-gate.js?v=2"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyA1GSV7KX6qMbIFIFz2ZhPNBVksiGxanKA",
authDomain:"tenken-rakuraku.firebaseapp.com",
databaseURL:"https://tenken-rakuraku-default-rtdb.firebaseio.com",
projectId:"tenken-rakuraku",
storageBucket:"tenken-rakuraku.firebasestorage.app",
messagingSenderId:"546571524606",
appId:"1:546571524606:web:dbe38f12c4b6ab4ad148af"
};

if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db=firebase.database();
// マスタ管理(sekine-store)に接続して従業員を読む
const sekineConfig={
apiKey:"AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
authDomain:"sekine-store.firebaseapp.com",
projectId:"sekine-store",
storageBucket:"sekine-store.firebasestorage.app",
messagingSenderId:"781856496751",
appId:"1:781856496751:web:e2e1e5de4cd803415a819a"
};
let sekineApp=null;
try{sekineApp=firebase.app("sekine");}catch(e){
 try{sekineApp=firebase.initializeApp(sekineConfig,"sekine");}catch(e2){sekineApp=null;}
}
function loadMasterStaff(){
 // 担当者はマスタ管理(sekine-store)の従業員を大元として読む
 if(!sekineApp||!firebase.firestore)return Promise.reject(new Error("firestore未読込"));
 return sekineApp.firestore().collection("employees").get().then(function(snap){
  const arr=[];
  snap.forEach(function(d){
   const v=d.data();
   if(v.name)arr.push({name:v.name,order:(v.order!==undefined&&v.order!==null)?v.order:9999});
  });
  arr.sort(function(a,b){return a.order-b.order;});
  const names=arr.map(function(x){return x.name;});
  if(!names.length)throw new Error("マスタに従業員なし");
  if(names[0]!=="未選択")names.unshift("未選択");
  return names;
 });
}
// マスタが読めないときは今までの担当者リストで動かす
function loadStaffList(){
 return loadMasterStaff().catch(function(){
  return db.ref("settings/staff").once("value").then(function(snap){return snap.val()||defaultStaff;}).catch(function(){return defaultStaff;});
 });
}

const defaultStaff=["未選択","社長","常務","細田典良","春原誠","高橋由幸","西澤文彦","五十嵐雅文","赤池秀幸","金子政司","大日方広義","金井正美","清水広之","桑野恵","上野雅宏","中村雅志","深澤卓也","仙石寛崇","上野雅也","塩川公明","松下伊織","水野浩","伊部豊","山田由一","池田袈裟人","菊池茂義"];

const items=[
["1-1","ブレーキ 踏みしろ",1],["1-2","ブレーキ きき具合",1],["1-3","ブレーキ 液量",1],["1-4","ブレーキ 空気圧",1],
["1-5","駐車ブレーキ レバー引きしろ",1],["1-6","原動機 低速・加速の状態",1],["1-7","原動機 かかり具合・異音",1],
["1-8","ウォッシャー 噴射状態",1],["1-9","ウォッシャー 液量",1],["1-10","ワイパー 払拭状態",1],
["2-1","バッテリー 液量",2],["2-2","エンジンオイルの量",2],["2-3","オイル漏れ・にじみ",2],["2-4","冷却水の量",2],
["3-1","タイヤ 空気圧",3],["3-2","タイヤ 亀裂・破損",3],["3-3","タイヤ 異常な摩耗",3],["3-4","タイヤ 溝の深さ",3],
["3-5","灯火装置 点灯具合",3],["3-6","方向指示器 点滅具合",3],["3-7","灯火装置 汚れ・損傷",3],
["4-1","飛散防止ネットに破れ・ほつれがない",4],["4-2","ネットの固定（ロープ・フック）が確実",4],
["4-3","荷台に飛散物（細片・破片）が残っていない",4],["4-4","風で飛びそうな軽量物がない",4],
["5-1","荷物の固定具（ロープ・ラッシング）が適切",5],["5-2","荷台扉・ゲートが確実に施錠されている",5],
["5-3","荷物の重心が偏っていない",5],["5-4","落下の恐れがある突起物がない",5],
["6-1","ヘルメット・手袋など保護具着用",6],["6-2","荷台への乗り降りが安全にできる状態",6],
["6-3","周囲の歩行者・他車両の安全確認済み",6]
];

let answers={};
let savedMemo="";
const openedKey="tenken_"+new Date().getFullYear()+"_"+(new Date().getMonth()+1)+"_"+new Date().getDate();

function getVehicle(){return new URLSearchParams(location.search).get("vehicle")||"車両未指定";}
function getStaffFromUrl(){return new URLSearchParams(location.search).get("staff")||"";}
function y(){return new Date().getFullYear();}
function m(){return new Date().getMonth()+1;}
function d(){return new Date().getDate();}
function nowTime(){const x=new Date();return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0");}
function key(){return "tenken_"+y()+"_"+m()+"_"+d();}

function renderItems(){
items.forEach(function(it){
answers[it[0]]="";
const row=document.createElement("div");
row.className="item";
row.innerHTML="<div>"+it[0]+"</div><div>"+it[1]+"</div>"+
"<button class='good' data-no='"+it[0]+"' data-val='良' onclick='setAnswer(\""+it[0]+"\",\"良\",this)'>良</button>"+
"<button class='bad' data-no='"+it[0]+"' data-val='否' onclick='setAnswer(\""+it[0]+"\",\"否\",this)'>否</button>";
document.getElementById("section"+it[2]).appendChild(row);
});
}

function setAnswer(no,val,btn){
answers[no]=val;
btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderBadNumbers();
}

function setAllGood(){
items.forEach(function(it){
const btn=document.querySelector("button[data-no='"+it[0]+"'][data-val='良']");
if(btn)setAnswer(it[0],"良",btn);
});
}

function resetAll(){
items.forEach(function(it){answers[it[0]]="";});
document.querySelectorAll(".item button").forEach(function(b){b.classList.remove("active");});
renderBadNumbers();
}

function renderBadNumbers(){
const bad=items.filter(it=>answers[it[0]]==="否");
document.getElementById("badNumbers").innerHTML=bad.length?bad.map(it=>it[0]+" "+it[1]).join("<br>"):"なし";
}

function renderStaff(list){
const sel=document.getElementById("staffSelect");
sel.innerHTML="";
list.forEach(function(name){
const op=document.createElement("option");
op.value=name; op.textContent=name; sel.appendChild(op);
});
const urlStaff=getStaffFromUrl();
if(urlStaff){
if(!Array.from(sel.options).some(function(o){return o.value===urlStaff;})){const op=document.createElement("option");op.value=urlStaff;op.textContent=urlStaff;sel.appendChild(op);}
sel.value=urlStaff;}
}

function loadExisting(){
const vehicle=getVehicle();
const k=key();
db.ref("tenkenData/"+k+"/"+vehicle).once("value").then(function(snap){
const r=snap.val();
if(!r||!r.dailyCheck)return;

const saved=r.dailyCheck.answers||{};
Object.keys(saved).forEach(function(no){
const val=saved[no];
if(!val)return;
const btn=document.querySelector("button[data-no='"+no+"'][data-val='"+val+"']");
if(btn)setAnswer(no,val,btn);
});

if(r.dailyCheck.memo){
savedMemo=String(r.dailyCheck.memo).trim();
document.getElementById("memo").value=r.dailyCheck.memo;
}

if(r.dailyStaff){
(function(){const sel=document.getElementById("staffSelect");
if(r.dailyStaff&&!Array.from(sel.options).some(function(o){return o.value===r.dailyStaff;})){const op=document.createElement("option");op.value=r.dailyStaff;op.textContent=r.dailyStaff;sel.appendChild(op);}
sel.value=r.dailyStaff;})();
}

document.getElementById("loadedNote").style.display="block";
});
}

function checkAllAnswered(){
const notDone=items.filter(it=>!answers[it[0]]);
if(notDone.length){
alert("未確認の項目があります。\nすべて良・否を選んでください。\n\n未確認：\n"+notDone.map(it=>it[0]+" "+it[1]).join("\n"));
return false;
}
return true;
}

function saveDaily(){
const staff=document.getElementById("staffSelect").value;
if(!staff||staff==="未選択"){alert("点検者を選んでください");return;}
if(!checkAllAnswered())return;

const vehicle=getVehicle();
const k=key();
if(k!==openedKey){
alert("日付が変わったので、今日の点検として開き直します。");
location.reload();
return;
}
const badItems=items.filter(it=>answers[it[0]]==="否").map(it=>({no:it[0],name:it[1]}));
const memoText=document.getElementById("memo").value.trim();

// この車両の項目だけを保存（ほかの車両の記録には一切さわらない）
const t=nowTime();
db.ref("tenkenData/"+k+"/"+vehicle).update({
morning:true,
morningTime:t,
morningStaff:staff,
dailyDone:true,
dailyTime:t,
dailyStaff:staff,
dailyCheck:{
answers:answers,
badItems:badItems,
memo:memoText,
savedAt:new Date().toLocaleString()
}
}).then(function(){
// 前回と同じ備考なら報告済みなので、もう一度は聞かない（二重登録を防ぐ）
if(memoText&&memoText!==savedMemo){
document.getElementById("reportConfirmModal").style.display="flex";
}else{
location.href="qr.html?vehicle="+encodeURIComponent(vehicle)+"&v=112";
}
}).catch(function(){
alert("保存に失敗しました。通信を確認してください。");
});
}

function submitReport(doReport){
const vehicle=getVehicle();
const staff=document.getElementById("staffSelect").value;
const memoText=document.getElementById("memo").value.trim();
document.getElementById("reportConfirmModal").style.display="none";

if(!doReport){
location.href="qr.html?vehicle="+encodeURIComponent(vehicle)+"&v=112";
return;
}

const now=new Date();
const dateStr=now.getFullYear()+"/"+(now.getMonth()+1)+"/"+now.getDate();

const newReport={
date:dateStr,
vehicle:vehicle,
content:memoText,
status:"未対応",
staff:staff,
createdAt:now.getTime()
};

db.ref("reports").push(newReport).then(function(){
location.href="report-list.html";
}).catch(function(){
alert("報告の登録に失敗しました。通信を確認してください。");
location.href="qr.html?vehicle="+encodeURIComponent(vehicle)+"&v=112";
});
}

document.addEventListener("DOMContentLoaded",function(){
document.getElementById("vehicleText").textContent=getVehicle();
document.getElementById("dateText").textContent=y()+"年"+m()+"月"+d()+"日";
renderItems();
renderBadNumbers();

loadStaffList().then(function(list){
renderStaff(list);
loadExisting();
});
});
</script>
</body>
</html>
