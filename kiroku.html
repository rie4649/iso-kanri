<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育・監査・是正の記録</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
  body { background:#f4f4f5; padding-bottom:60px; }
  header { background:#7c3aed; color:#fff; padding:14px 16px; }
  header h1 { font-size:19px; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  .wrap { padding:12px; max-width:760px; margin:0 auto; }
  .backBtn { width:100%; padding:12px; border:none; border-radius:12px; background:#555; color:#fff; font-size:15px; font-weight:bold; margin-bottom:10px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab { flex:1; text-align:center; padding:11px 4px; border-radius:12px; background:#e4e4e7; color:#52525b; font-size:13px; font-weight:bold; cursor:pointer; }
  .tab.act { background:#7c3aed; color:#fff; }
  .bigBtn { width:100%; padding:14px; border:none; border-radius:12px; background:#7c3aed; color:#fff; font-size:16px; font-weight:bold; margin-bottom:10px; }
  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card .ttl { font-size:15px; font-weight:bold; }
  .card .sub { font-size:13px; color:#52525b; margin-top:4px; line-height:1.7; white-space:pre-wrap; }
  .chip { display:inline-block; border-radius:8px; padding:2px 10px; font-size:12px; font-weight:bold; margin-left:6px; }
  .chipOpen { background:#fef3c7; color:#b45309; }
  .chipDone { background:#dcfce7; color:#15803d; }
  .rowBtns { display:flex; gap:6px; margin-top:8px; }
  .miniBtn { border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:bold; background:#ede9fe; color:#6d28d9; }
  .empty { text-align:center; color:#a1a1aa; padding:30px 10px; font-size:14px; line-height:1.9; }
  .modalBg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; overflow:auto; padding:16px; }
  .modalBg.show { display:block; }
  .modal { background:#fff; border-radius:14px; padding:16px; max-width:560px; margin:20px auto; }
  .modal h2 { font-size:17px; margin-bottom:6px; }
  label { display:block; font-size:13px; font-weight:bold; color:#52525b; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:10px; font-size:15px; border:1px solid #d4d4d8; border-radius:10px; background:#fff; }
  textarea { min-height:70px; }
  .mBtns { display:flex; gap:8px; margin-top:14px; }
  .mBtns button { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:bold; }
  .mSave { background:#7c3aed; color:#fff; }
  .mCancel { background:#e4e4e7; color:#3f3f46; }
  .mDel { width:100%; margin-top:10px; padding:12px; border:none; border-radius:10px; background:#fee2e2; color:#b91c1c; font-size:14px; font-weight:bold; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1>📚 教育・監査・是正の記録</h1>
  <div class="sub">環境教育の実施記録・内部監査・是正処置(苦情/事故/ヒヤリ)</div>
</header>

<div class="wrap">
<button class="backBtn" onclick="location.href='index.html'">← ISO管理に戻る</button>
<div class="tabs">
  <div class="tab act" id="tab-train" onclick="switchTab('train')">📚 教育訓練</div>
  <div class="tab" id="tab-audit" onclick="switchTab('audit')">🔍 内部監査</div>
  <div class="tab" id="tab-fix" onclick="switchTab('fix')">🛠 是正処置</div>
</div>
<button class="bigBtn" id="addBtn" onclick="openModal()">＋ 記録を追加</button>
<div id="list"><div class="empty">読み込み中...</div></div>
</div>

<!-- 記録モーダル(タブごとに項目を出し分け) -->
<div class="modalBg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">記録を追加</h2>
    <input type="hidden" id="recId">
    <label>日付</label><input type="date" id="fDate">

    <div class="only-train">
      <label>テーマ・内容</label><input type="text" id="fTheme" placeholder="例: 廃棄物分別の教育、油流出時の対応訓練">
      <label>対象者(受けた人)</label><input type="text" id="fTarget" placeholder="例: 全従業員 / 新入社員2名">
      <label>実施者・講師</label><input type="text" id="fTeacher" placeholder="例: 理絵 / 外部講師○○">
      <label>メモ(任意)</label><textarea id="fNote1" placeholder="使った資料や様子など"></textarea>
    </div>

    <div class="only-audit" style="display:none;">
      <label>監査員</label><input type="text" id="fAuditor" placeholder="例: 理絵">
      <label>監査の範囲・対象</label><input type="text" id="fScope" placeholder="例: ヤード全体 / 記録類の確認">
      <label>指摘事項(なければ「指摘なし」)</label><textarea id="fFindings" placeholder="例: 廃油置場の表示が薄くなっていた"></textarea>
      <label>是正・対応した内容</label><textarea id="fAction1" placeholder="例: 表示板を新しく作成し掲示した"></textarea>
      <label>状態</label>
      <select id="fStatus1"><option value="done">✅ 完了</option><option value="open">⏳ 対応中</option></select>
    </div>

    <div class="only-fix" style="display:none;">
      <label>何が起きたか(苦情・事故・ヒヤリ)</label><textarea id="fEvent" placeholder="例: 近隣から重機の騒音について電話があった"></textarea>
      <label>原因</label><textarea id="fCause" placeholder="例: 早朝から圧縮機を稼働していた"></textarea>
      <label>対策(やったこと)</label><textarea id="fAction2" placeholder="例: 稼働開始を8時以降に変更、朝礼で周知"></textarea>
      <label>効果の確認(任意)</label><input type="text" id="fVerify" placeholder="例: 1か月後、再発なしを確認(10/15)">
      <label>状態</label>
      <select id="fStatus2"><option value="open">⏳ 対応中</option><option value="done">✅ 完了</option></select>
    </div>

    <div class="mBtns">
      <button class="mCancel" onclick="closeModal()">キャンセル</button>
      <button class="mSave" onclick="saveRec()">保存</button>
    </div>
    <button class="mDel" id="delBtn" style="display:none;" onclick="delRec()">🗑 この記録を削除</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const COLS = { train:"isoTrainings", audit:"isoAudits", fix:"isoCorrectives" };
const NAMES = { train:"教育訓練", audit:"内部監査", fix:"是正処置" };
let tab = "train";
let data = { train:[], audit:[], fix:[] };
let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2500); }
function esc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

Object.keys(COLS).forEach(k=>{
  db.collection(COLS[k]).onSnapshot(snap=>{
    data[k] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    data[k].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(tab===k) render();
  }, err=>{ console.error(err); });
});

function switchTab(k){
  tab = k;
  ["train","audit","fix"].forEach(x=>document.getElementById("tab-"+x).classList.toggle("act", x===k));
  render();
}

function statusChip(st){
  return st==="done" ? '<span class="chip chipDone">完了</span>' : '<span class="chip chipOpen">対応中</span>';
}

function render(){
  const box = document.getElementById("list");
  const list = data[tab];
  if(!list.length){ box.innerHTML = `<div class="empty">まだ${NAMES[tab]}の記録がありません。<br>「＋記録を追加」から始めてください</div>`; return; }
  box.innerHTML = list.map(r=>{
    let ttl="", sub="";
    if(tab==="train"){
      ttl = `${esc(r.date)}　${esc(r.theme||"")}`;
      sub = `対象: ${esc(r.target||"")}　実施: ${esc(r.teacher||"")}${r.note?`\n${esc(r.note)}`:""}`;
    }else if(tab==="audit"){
      ttl = `${esc(r.date)}　内部監査${statusChip(r.status)}`;
      sub = `監査員: ${esc(r.auditor||"")}　範囲: ${esc(r.scope||"")}\n指摘: ${esc(r.findings||"指摘なし")}${r.action?`\n対応: ${esc(r.action)}`:""}`;
    }else{
      ttl = `${esc(r.date)}　${esc((r.event||"").split("\n")[0].slice(0,25))}${statusChip(r.status)}`;
      sub = `事象: ${esc(r.event||"")}\n原因: ${esc(r.cause||"")}\n対策: ${esc(r.action||"")}${r.verify?`\n効果確認: ${esc(r.verify)}`:""}`;
    }
    return `<div class="card">
      <div class="ttl">${ttl}</div>
      <div class="sub">${sub}</div>
      <div class="rowBtns"><button class="miniBtn" onclick="openModal('${r.id}')">✏️ 開く</button></div>
    </div>`;
  }).join("");
}

function showFields(){
  document.querySelector(".only-train").style.display = tab==="train" ? "block" : "none";
  document.querySelector(".only-audit").style.display = tab==="audit" ? "block" : "none";
  document.querySelector(".only-fix").style.display = tab==="fix" ? "block" : "none";
}

function openModal(id){
  const r = id ? data[tab].find(x=>x.id===id) : null;
  document.getElementById("modalTitle").textContent = (r?"":"＋ ") + NAMES[tab] + (r?"を編集":"を追加");
  document.getElementById("recId").value = r ? r.id : "";
  document.getElementById("fDate").value = r ? r.date : todayStr();
  if(tab==="train"){
    document.getElementById("fTheme").value = r?.theme||"";
    document.getElementById("fTarget").value = r?.target||"";
    document.getElementById("fTeacher").value = r?.teacher||"";
    document.getElementById("fNote1").value = r?.note||"";
  }else if(tab==="audit"){
    document.getElementById("fAuditor").value = r?.auditor||"";
    document.getElementById("fScope").value = r?.scope||"";
    document.getElementById("fFindings").value = r?.findings||"";
    document.getElementById("fAction1").value = r?.action||"";
    document.getElementById("fStatus1").value = r?.status||"done";
  }else{
    document.getElementById("fEvent").value = r?.event||"";
    document.getElementById("fCause").value = r?.cause||"";
    document.getElementById("fAction2").value = r?.action||"";
    document.getElementById("fVerify").value = r?.verify||"";
    document.getElementById("fStatus2").value = r?.status||"open";
  }
  document.getElementById("delBtn").style.display = r ? "block" : "none";
  showFields();
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }

async function saveRec(){
  const date = document.getElementById("fDate").value;
  if(!date){ toast("日付を入れてください"); return; }
  let d = { date };
  if(tab==="train"){
    d.theme = document.getElementById("fTheme").value.trim();
    d.target = document.getElementById("fTarget").value.trim();
    d.teacher = document.getElementById("fTeacher").value.trim();
    d.note = document.getElementById("fNote1").value.trim();
    if(!d.theme){ toast("テーマ・内容を入れてください"); return; }
  }else if(tab==="audit"){
    d.auditor = document.getElementById("fAuditor").value.trim();
    d.scope = document.getElementById("fScope").value.trim();
    d.findings = document.getElementById("fFindings").value.trim();
    d.action = document.getElementById("fAction1").value.trim();
    d.status = document.getElementById("fStatus1").value;
  }else{
    d.event = document.getElementById("fEvent").value.trim();
    d.cause = document.getElementById("fCause").value.trim();
    d.action = document.getElementById("fAction2").value.trim();
    d.verify = document.getElementById("fVerify").value.trim();
    d.status = document.getElementById("fStatus2").value;
    if(!d.event){ toast("何が起きたかを入れてください"); return; }
  }
  const id = document.getElementById("recId").value;
  try{
    if(id) await db.collection(COLS[tab]).doc(id).update(d);
    else await db.collection(COLS[tab]).add(d);
    closeModal(); toast("✅ 保存しました");
  }catch(e){ toast("❌ 保存に失敗: "+e.message); }
}

async function delRec(){
  const id = document.getElementById("recId").value;
  if(!id) return;
  if(!confirm("この記録を削除しますか？")) return;
  try{ await db.collection(COLS[tab]).doc(id).delete(); closeModal(); toast("🗑 削除しました"); }
  catch(e){ toast("❌ 削除に失敗: "+e.message); }
}
</script>
</body>
</html>
