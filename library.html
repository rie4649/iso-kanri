<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真・書類 | ISO管理</title>
<link rel="stylesheet" href="biz.css">
<style>
  .addBig { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:22px 16px; border:2px dashed #93c5fd; background:#eff6ff; border-radius:12px; font-size:19px; font-weight:800; color:#1e3a5f; cursor:pointer; }
  .addBig small { display:block; font-size:13px; font-weight:normal; color:#475569; }
  .toBanner { background:#fef3c7; border:1px solid #fcd34d; border-radius:10px; padding:10px 14px; margin-bottom:10px; font-size:14px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 8px; }
  .chips button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; color:var(--navy); cursor:pointer; }
  .chips button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .chips button b { margin-left:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr)); gap:12px; }
  .card2 { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .card2.sel { outline:3px solid #2563eb; }
  .card2 .th { height:150px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:52px; cursor:pointer; }
  .card2 .th img { width:100%; height:100%; object-fit:cover; }
  .card2 .pk { position:absolute; top:8px; left:8px; width:26px; height:26px; margin:0; accent-color:#2563eb; }
  .card2 .bd { padding:10px 12px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .card2 .nm { font-size:15px; font-weight:800; color:var(--ink); word-break:break-all; }
  .card2 .mt { font-size:12px; color:var(--muted); }
  .lk { display:inline-flex; align-items:center; gap:4px; font-size:12px; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; border-radius:999px; padding:2px 4px 2px 9px; margin:0 4px 4px 0; font-weight:700; }
  .lk button { border:none; background:transparent; color:#047857; cursor:pointer; font-size:13px; padding:0 4px; }
  .nolk { font-size:12px; color:#b45309; font-weight:700; }
  .card2 .ac { display:flex; gap:6px; padding:0 12px 12px; }
  .card2 .ac button { flex:1; }
  .useBtn { background:#1e3a5f; color:#fff; border:none; border-radius:8px; padding:9px; font-weight:800; cursor:pointer; font-size:14px; }
  .bulk { position:sticky; bottom:10px; z-index:20; background:#1e3a5f; color:#fff; border-radius:12px; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:0 6px 20px rgba(0,0,0,.25); margin-top:12px; }
  .bulk button { border:none; border-radius:8px; padding:9px 14px; font-weight:800; cursor:pointer; }
  /* どこに使う？(大きい行の形) */
  .rowL { display:flex; align-items:center; gap:12px; padding:14px 6px; border-bottom:1px solid var(--line2); cursor:pointer; }
  .rowL:hover { background:#f8fafc; }
  .rowL .ic { font-size:24px; width:32px; text-align:center; flex:0 0 32px; }
  .rowL .tx { flex:1; min-width:0; } .rowL .tx b { display:block; font-size:16px; color:var(--ink); } .rowL .tx span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .rowL .ar { font-size:22px; color:var(--navy); font-weight:800; }
  .rowL.off { opacity:.4; cursor:not-allowed; }
  .modal { max-height:88vh; overflow:auto; }
  .q { width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; margin:6px 0; box-sizing:border-box; }
  .prog { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:200; display:none; align-items:center; justify-content:center; }
  .prog div { background:#fff; border-radius:12px; padding:20px 26px; font-size:16px; font-weight:800; color:var(--navy); }
</style>
</head>
<body>
<header class="bz">
  <button class="back" onclick="try{sessionStorage.setItem('isoRestore','1')}catch(e){};location.href='index.html'">← ISO管理に戻る</button>
  <div><h1>📥 写真・書類</h1><div class="sub">写真もPDFも、入れるのはここだけ。あとで「どこに使う？」を選ぶと、その画面に出ます</div></div>
</header>
<div class="wrap" style="max-width:1000px;">
  <div id="toBanner" class="toBanner" style="display:none;"></div>
  <label class="addBig" for="fIn">📷📄 写真・PDFを入れる<small>何枚でもまとめて選べます。入れたものは、まず「まだ分けていない」に入ります</small></label>
  <input type="file" id="fIn" accept="image/*,application/pdf,.docx,.xlsx" multiple style="display:none;" onchange="addFiles(this.files)">
  <div class="chips" id="chips"></div>
  <input type="search" id="q" class="q" placeholder="🔍 名前で探す" oninput="render()">
  <div class="grid" id="list"><div class="empty">読み込み中…</div></div>
  <div class="bulk" id="bulk" style="display:none;"></div>
</div>

<!-- どこに使う？ -->
<div class="bg" id="useBg" onclick="if(event.target===this)closeUse()"><div class="modal" style="max-width:640px;">
  <h2 id="useTtl">どこに使いますか？</h2>
  <div id="useBody"></div>
  <div class="mBtns"><button class="btn" id="useBack" onclick="useStep(null)" style="display:none;">← 戻る</button><button class="btn" onclick="closeUse()">閉じる</button></div>
</div></div>
<div class="prog" id="prog"><div id="progTx">保存中…</div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="history.js"></script>
<script src="library.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const esc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800); }
</script>
<script src="ems-docs.js"></script>
<script>
/* =====================================================================
   📥 写真・書類(2026/10 作り直し)：写真もPDFも、入れるのはここだけ
   ・入れたら、まず isoLibrary に保存(フォルダ "inbox"＝まだ分けていない)。写真は長い辺1600pxに縮めて保存、一覧用の小さい絵(thumb)も持つ
   ・「どこに使う？」で何か所でもつなげる。つないだ先は links に残す(× で外すと、つないだ先の写真・添付も消える。元のファイルは残る)
       photo  … 写真の記録の項目(isoPhotos kind:"record")   veh/equip … 車両・設備(isoPhotos kind:"vehicle"/"equip")
       event  … 出来事(写真は isoPhotos kind:"event"、PDFは isoEventFiles＋出来事の attachments)
       ems    … EMS書類の原本(emsDocFiles・emsDocChunks)   water/train … 水質検査・教育訓練の記録の添付   noise … 騒音チェックの写真
       use    … 環境への取り組みなどに出す(isoLibrary の uses)   folder … 書類のフォルダ(isoLibrary の folder)
   ・?to=… で開くと、入れたものをそのままそこにつなぐ(例 ?to=photo:表彰・認定（賞状・盾・認定証） / ?to=ems:A-01)
   ===================================================================== */
const TO = new URLSearchParams(location.search).get("to") || "";
let docs = [], filt = "todo", sel = new Set(), photoCats = [], vehicles = [], equips = [], events = [], waters = [], trains = [], noises = [];
const isImg = d => String(d.type || "").startsWith("image/");
const isTodo = d => !(d.links || []).length && !(d.uses || []).length && (!d.folder || d.folder === "inbox");
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const ymdOf = ms => { const d = new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fdj = s => { const m = String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Number(m[1])+"/"+Number(m[2])+"/"+Number(m[3]) : ""; };
const prog = t => { const p = document.getElementById("prog"); if (t) { document.getElementById("progTx").textContent = t; p.style.display = "flex"; } else p.style.display = "none"; };

db.collection(Library.COL).onSnapshot(s => { docs = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); backfillThumbs(); }, e => toast("読み込みエラー: " + e.message));
(async () => {
  const g = c => db.collection(c).get().then(s => s.docs.map(d => ({ id: d.id, ...d.data() }))).catch(() => []);
  const [rc, mv, cm, fe, ev, wt, tr, nc] = await Promise.all([db.collection("isoPhotoSettings").doc("recordCats").get().catch(() => null), g("master_vehicles"), g("compressorMachines"), g("freonEquipments"), g("isoEvents"), g("waterTests"), g("trainingRecords"), g("noiseChecks")]);
  const it = rc && rc.exists && rc.data().items;
  photoCats = Array.isArray(it) && it.length ? it.map(x => x.name).filter(Boolean) : ["許可証の掲示・携行", "表彰・認定（賞状・盾・認定証）", "環境方針の掲示", "社内の緊急連絡先の掲示板", "積替え保管場所の様子", "マニフェストの保管状況", "契約書の保管状況", "水質検査の様子", "社内図"];
  vehicles = mv; equips = [...new Set(cm.map(x => x.name).concat(fe.map(x => x.name)).concat(["トラックスケール", "天井クレーン"]).filter(Boolean))];
  const sd = (a, b) => String(b.date || "").localeCompare(String(a.date || ""));
  events = ev.sort(sd); waters = wt.sort(sd); trains = tr.sort(sd); noises = nc.sort(sd);
  if (TO) { const b = document.getElementById("toBanner"); b.style.display = ""; b.innerHTML = "ここで入れた写真・書類は、そのまま <b>" + esc(toLabel(TO)) + "</b> に入ります。"; }
})();
if (window.EMS) { EMS.subscribe(() => {}); }

/* ---------- 一覧 ---------- */
function render(){
  const n = { todo: docs.filter(isTodo).length, all: docs.length, img: docs.filter(isImg).length, doc: docs.filter(d => !isImg(d)).length };
  document.getElementById("chips").innerHTML = [["todo", "📥 まだ分けていない"], ["all", "すべて"], ["img", "📷 写真"], ["doc", "📄 PDF・書類"]].map(([k, l]) => '<button class="'+(filt === k ? "on" : "")+'" onclick="filt=\''+k+'\';render()">'+l+'<b>'+n[k]+'</b></button>').join("") +
    Library.FOLDERS.filter(f => f[0] !== "inbox").map(([k, ic, nm]) => { const c = docs.filter(d => d.folder === k).length; return c ? '<button class="'+(filt === "f:" + k ? "on" : "")+'" onclick="filt=\'f:'+k+'\';render()">'+ic+' '+esc(nm)+'<b>'+c+'</b></button>' : ""; }).join("");
  const q = document.getElementById("q").value.trim();
  const L = docs.filter(d => (filt === "todo" ? isTodo(d) : filt === "img" ? isImg(d) : filt === "doc" ? !isImg(d) : filt.startsWith("f:") ? d.folder === filt.slice(2) : true) && (!q || String(d.name).includes(q)))
    .sort((a, b) => (b.createdMs || 0) - (a.createdMs || 0));
  document.getElementById("list").innerHTML = L.length ? L.map(card).join("") : '<div class="empty" style="grid-column:1/-1;">'+(filt === "todo" ? "まだ分けていないものはありません 👍" : "ありません")+'</div>';
  renderBulk();
}
function linkChips(d){
  const L = (d.links || []).map((l, i) => '<span class="lk">→ '+esc(l.label)+'<button title="外す" onclick="event.stopPropagation();unlink(\''+d.id+'\','+i+')">✕</button></span>');
  (d.uses || []).forEach(u => { const x = Library.USES.find(y => y[0] === u); L.push('<span class="lk">→ '+esc(x ? x[1] : u)+'<button title="外す" onclick="event.stopPropagation();unUse(\''+d.id+'\',\''+u+'\')">✕</button></span>'); });
  if (d.folder && d.folder !== "inbox") { const f = Library.FOLDERS.find(x => x[0] === d.folder); if (f) L.push('<span class="lk" style="background:#eef2ff;color:#3730a3;border-color:#c7d2fe;">'+f[1]+' '+esc(f[2])+'<button style="color:#3730a3" onclick="event.stopPropagation();setFolder(\''+d.id+'\',\'inbox\')">✕</button></span>'); }
  return L.length ? '<div>'+L.join("")+'</div>' : '<div class="nolk">まだどこにも使っていません</div>';
}
function card(d){
  return '<div class="card2'+(sel.has(d.id) ? ' sel' : '')+'"><input type="checkbox" class="pk" title="まとめて選ぶ"'+(sel.has(d.id) ? ' checked' : '')+' onchange="togglePick(\''+d.id+'\',this.checked)">'+
    '<div class="th" onclick="Library.open(db,\''+d.id+'\')">'+(d.thumb ? '<img src="'+d.thumb+'" alt="">' : Library.icon(d))+'</div>'+
    '<div class="bd"><div class="nm">'+esc(d.name)+'</div><div class="mt">'+(d.shotDate ? '📅 '+fdj(d.shotDate)+'　' : '')+(d.recBy ? esc(d.recBy) : '')+'</div>'+linkChips(d)+'</div>'+
    '<div class="ac"><button class="useBtn" onclick="openUse([\''+d.id+'\'])">🔗 どこに使う？</button><button class="btn sm" onclick="rename(\''+d.id+'\')">✏️</button><button class="btn sm del" onclick="delDoc(\''+d.id+'\')">🗑</button></div></div>';
}
window.togglePick = (id, on) => { if (on) sel.add(id); else sel.delete(id); render(); };
function renderBulk(){
  const b = document.getElementById("bulk");
  if (!sel.size) { b.style.display = "none"; return; }
  b.style.display = "flex";
  b.innerHTML = '<b style="flex:1;">'+sel.size+'件 選んでいます</b><button style="background:#fff;color:#1e3a5f;" onclick="openUse([...sel])">🔗 まとめて「どこに使う？」</button><button style="background:#fee2e2;color:#b91c1c;" onclick="delMany()">🗑 消す</button><button style="background:transparent;color:#fff;border:1px solid #fff;" onclick="sel.clear();render()">やめる</button>';
}

/* ---------- 入れる ---------- */
const toImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("写真を読めませんでした")); i.src = src; });
const jpg = (img, px, q) => { const r = Math.min(1, px / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
const fileUrl = f => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => ng(new Error("読み込めませんでした")); r.readAsDataURL(f); });
const urlToFile = (u, name, type) => { const raw = atob(u.split(",")[1] || ""), a = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i); return new File([a], name, { type: type || (u.match(/^data:([^;]+)/) || [])[1] || "application/octet-stream" }); };
function fullOf(img){ let u = ""; for (const [px, q] of [[1600, .82], [1400, .75], [1200, .7], [1000, .65]]) { u = jpg(img, px, q); if (u.length < 900 * 1024) break; } return u; }
window.addFiles = async list => {
  const files = [...(list || [])]; if (!files.length) return;
  let by = ""; try { by = localStorage.getItem("isoRecBy") || ""; } catch(e){}
  const ids = [];
  try {
    for (let k = 0; k < files.length; k++) {
      let f = files[k]; prog("保存中… " + (k + 1) + " / " + files.length);
      if (f.size > 15 * 1048576 && !String(f.type).startsWith("image/")) { toast(f.name + " は15MBより大きいので入れられません"); continue; }
      let thumb = "", name = f.name.replace(/\.[^.]+$/, "");
      if (String(f.type).startsWith("image/")) { const img = await toImg(await fileUrl(f)); thumb = jpg(img, 360, .7); f = urlToFile(fullOf(img), name + ".jpg", "image/jpeg"); }
      const id = await Library.save(db, f, { name, folder: "inbox", uses: [], links: [], thumb, shotDate: ymdOf(files[k].lastModified || Date.now()), recBy: by, recDate: today(), updatedMs: Date.now() });
      ids.push(id);
    }
  } catch (e) { toast("エラー: " + e.message); }
  prog(null); document.getElementById("fIn").value = "";
  if (!ids.length) return;
  if (TO) { await waitDocs(ids); for (const id of ids) await applyTo(id, TO); toast(ids.length + "件 入れて、" + toLabel(TO) + " につなぎました"); }
  else toast(ids.length + "件 入れました。「🔗 どこに使う？」で行き先を選べます");
};
const waitDocs = ids => new Promise(ok => { let n = 0; const t = setInterval(() => { if (ids.every(id => docs.some(d => d.id === id)) || n++ > 40) { clearInterval(t); ok(); } }, 150); });
/* 前に入れた写真で、一覧用の小さい絵がないものを作っておく */
let bfRun = false;
async function backfillThumbs(){
  if (bfRun) return; bfRun = true;
  for (const d of docs.filter(x => isImg(x) && !x.thumb && !x.link).slice(0, 30)) { try { const img = await toImg(await dataOf(d)); await db.collection(Library.COL).doc(d.id).update({ thumb: jpg(img, 360, .7) }); } catch (e) {} }
  bfRun = false;
}
async function dataOf(d){ const parts = await Promise.all(Array.from({ length: d.chunks || 0 }, (_, i) => db.collection(Library.CH).doc(d.id + "_" + i).get().then(s => s.exists ? s.data().data : ""))); return parts.join(""); }
window.rename = async id => { const d = docs.find(x => x.id === id); const n = prompt("名前", d.name); if (n == null || !n.trim()) return; await db.collection(Library.COL).doc(id).update({ name: n.trim() }); };
window.delDoc = async id => { const d = docs.find(x => x.id === id); if (!d || !confirm("「" + d.name + "」を消しますか？\n（つないだ先の写真・添付も一緒に消えます）")) return; await removeAll(d); sel.delete(id); toast("消しました"); };
window.delMany = async () => { if (!confirm(sel.size + "件を消しますか？（つないだ先の写真・添付も一緒に消えます）")) return; for (const id of [...sel]) { const d = docs.find(x => x.id === id); if (d) await removeAll(d); } sel.clear(); toast("消しました"); };
async function removeAll(d){ for (let i = (d.links || []).length - 1; i >= 0; i--) { try { await dropLink(d.links[i]); } catch (e) {} } await Library.remove(db, d); }

/* ---------- どこに使う？ ---------- */
const GROUPS = [
  { k: "photo", ic: "📷", t: "写真の記録（掲示・保管・表彰など）", s: "環境への取り組みの「保管・掲示」「沿革」などのページに出ます", img: true },
  { k: "veh", ic: "🚛", t: "車両・設備の写真", s: "主な設備・車両、圧縮機・フロンの点検のページに出ます", img: true },
  { k: "event", ic: "📅", t: "出来事（カレンダー）", s: "視察・行事・工事など、その日の写真・資料として出ます" },
  { k: "rec", ic: "📎", t: "記録に付ける（水質検査・教育訓練・騒音チェック）", s: "計量証明書・修了証・測定の写真など" },
  { k: "ems", ic: "🔢", t: "EMS書類の原本", s: "EMS-A-◯◯・B-◯◯・C-◯◯ の原本（PDF）として入ります" },
  { k: "use", ic: "🌐", t: "環境への取り組み・研修に出す", s: "表彰・SDGs・地域貢献・見せる資料・新入社員研修・審査の準備" },
  { k: "folder", ic: "📁", t: "書類のフォルダに入れる", s: "会社案内・契約書・法令の案内など、置いておく書類" }
];
let useIds = [];
window.openUse = ids => { useIds = ids; useStep(null); document.getElementById("useBg").classList.add("show"); };
window.closeUse = () => document.getElementById("useBg").classList.remove("show");
const rowL = (ic, t, s, on, off) => '<div class="rowL'+(off ? ' off' : '')+'" '+(off ? '' : 'onclick="'+on+'"')+'><span class="ic">'+ic+'</span><span class="tx"><b>'+esc(t)+'</b>'+(s ? '<span>'+esc(s)+'</span>' : '')+'</span><span class="ar">›</span></div>';
window.useStep = (g, arg) => {
  const body = document.getElementById("useBody"), D = useIds.map(id => docs.find(x => x.id === id)).filter(Boolean), allImg = D.every(isImg);
  document.getElementById("useBack").style.display = g ? "" : "none";
  document.getElementById("useTtl").textContent = D.length > 1 ? D.length + "件をどこに使いますか？" : "「" + (D[0] ? D[0].name : "") + "」をどこに使いますか？";
  const q = '<input class="q" placeholder="🔍 しぼりこむ" oninput="filterRows(this.value)">';
  if (!g) { body.innerHTML = GROUPS.map(x => rowL(x.ic, x.t, x.img && !allImg ? "写真だけ選べます" : x.s, "useStep('"+x.k+"')", x.img && !allImg)).join(""); return; }
  const go = to => "doApply('" + to.replace(/'/g, "\\'") + "')";
  let rows = "";
  if (g === "photo") rows = photoCats.map(c => rowL("📷", c, "", go("photo:" + c))).join("") + rowL("＋", "新しい項目を作る", "名前を入れて作ります", "newCat()");
  if (g === "veh") rows = vehicles.slice().sort((a, b) => String(a.nickname || a.number).localeCompare(String(b.nickname || b.number), "ja", { numeric: true })).map(v => rowL("🚛", v.nickname || v.number || "(名前なし)", [v.number, v.type].filter(Boolean).join("・"), go("veh:" + v.id))).join("") + equips.map(e => rowL("🛠️", e, "設備", go("equip:" + e))).join("");
  if (g === "event") rows = events.slice(0, 80).map(e => rowL("📅", e.title || "(名前なし)", fdj(e.date) + (e.mark ? "・" + e.mark : ""), go("event:" + e.id))).join("");
  if (g === "rec") rows = '<div class="head2" style="font-weight:800;color:#0e7490;margin:8px 0 2px;">🧪 水質検査</div>' + waters.slice(0, 20).map(w => rowL("🧪", fdj(w.date) + " の水質検査", w.location || "", go("water:" + w.id))).join("") +
    '<div style="font-weight:800;color:#0e7490;margin:12px 0 2px;">🎓 教育訓練</div>' + trains.slice(0, 30).map(t => rowL("🎓", t.theme || "(テーマなし)", fdj(t.date) + (t.participants ? "・" + t.participants : ""), go("train:" + t.id))).join("") +
    '<div style="font-weight:800;color:#0e7490;margin:12px 0 2px;">🔊 騒音チェック（写真）</div>' + noises.slice(0, 20).map(n => rowL("🔊", fdj(n.date) + " " + (n.location || ""), n.db != null ? n.db + "dB" : "", go("noise:" + n.id), !allImg)).join("");
  if (g === "ems") rows = (window.EMS ? EMS.docs : []).filter(d => !d.abolished).map(d => rowL("🔢", "EMS-" + d.id + "　" + (d.name || ""), d.inUse === false ? "使っているか確認中" : "", go("ems:" + d.id))).join("") || '<div class="empty">読み込み中…もう一度開いてください</div>';
  if (g === "use") rows = Library.USES.map(([k, l, w]) => rowL("🌐", l, w || "", go("use:" + k))).join("");
  if (g === "folder") rows = Library.FOLDERS.filter(f => f[0] !== "inbox").map(([k, ic, nm, s]) => rowL(ic, nm, s, go("folder:" + k))).join("");
  body.innerHTML = q + '<div id="rowsBox">' + rows + '</div>';
};
window.filterRows = v => document.querySelectorAll("#rowsBox .rowL").forEach(r => r.style.display = !v || r.textContent.includes(v) ? "" : "none");
window.newCat = async () => { const n = prompt("新しい項目の名前（例：産業廃棄物の保管場所の掲示板）"); if (!n || !n.trim()) return;
  const s = await db.collection("isoPhotoSettings").doc("recordCats").get(), it = (s.exists && s.data().items) || photoCats.map(x => ({ name: x }));
  if (!it.some(x => x.name === n.trim())) await db.collection("isoPhotoSettings").doc("recordCats").set({ items: it.concat([{ name: n.trim(), q: "" }]) }, { merge: true });
  photoCats.push(n.trim()); doApply("photo:" + n.trim()); };
window.doApply = async to => {
  closeUse(); let ok = 0, ng = [];
  for (const id of useIds) { prog("つないでいます… " + (ok + ng.length + 1) + " / " + useIds.length); try { await applyTo(id, to); ok++; } catch (e) { const d = docs.find(x => x.id === id); ng.push((d ? d.name : id) + "：" + e.message); } }
  prog(null); sel.clear(); render();
  if (ng.length) alert("つなげなかったもの：\n" + ng.join("\n")); else toast(ok + "件を " + toLabel(to) + " につなぎました");
};
function toLabel(to){
  const [k, ...r] = to.split(":"), v = r.join(":");
  if (k === "photo") return "写真の記録「" + v + "」";
  if (k === "veh") { const x = vehicles.find(y => y.id === v); return "車両「" + (x ? x.nickname || x.number : v) + "」"; }
  if (k === "equip") return "設備「" + v + "」";
  if (k === "event") { const x = events.find(y => y.id === v); return "出来事「" + (x ? fdj(x.date) + " " + x.title : v) + "」"; }
  if (k === "water") { const x = waters.find(y => y.id === v); return "水質検査（" + (x ? fdj(x.date) : "") + "）"; }
  if (k === "train") { const x = trains.find(y => y.id === v); return "教育訓練「" + (x ? x.theme : "") + "」"; }
  if (k === "noise") { const x = noises.find(y => y.id === v); return "騒音チェック（" + (x ? fdj(x.date) : "") + "）"; }
  if (k === "ems") return "EMS-" + v + " の原本";
  if (k === "use") { const x = Library.USES.find(y => y[0] === v); return x ? x[1] : v; }
  if (k === "folder") { const x = Library.FOLDERS.find(y => y[0] === v); return x ? x[2] : v; }
  return to;
}
const b64raw = u => String(u).split(",")[1] || "";
async function applyTo(id, to){
  const d = docs.find(x => x.id === id); if (!d) throw new Error("見つかりません");
  const [k, ...r] = to.split(":"), v = r.join(":"), ref = { db, TS: firebase.firestore.FieldValue.serverTimestamp() };
  if (k === "use") { await db.collection(Library.COL).doc(id).update({ uses: [...new Set((d.uses || []).concat([v]))], folder: d.folder === "inbox" ? "other" : d.folder }); return; }
  if (k === "folder") { await db.collection(Library.COL).doc(id).update({ folder: v }); return; }
  if ((d.links || []).some(l => l.to === to)) return;   // もうつないである
  const url = await dataOf(d); let link = { to, label: toLabel(to) };
  if (k === "photo" || k === "veh" || k === "equip" || (k === "event" && isImg(d)) || k === "noise") {
    if (!isImg(d)) throw new Error("写真だけ入れられます");
    const img = await toImg(url), full = fullOf(img);
    if (k === "noise") {
      const fr = await db.collection("noiseCheckFiles").add({ checkId: v, name: d.name + ".jpg", type: "image/jpeg", size: Math.round(b64raw(full).length * .75), data: b64raw(full), libId: id, createdAt: ref.TS });
      const n = (await db.collection("noiseChecks").doc(v).get()).data() || {};
      await db.collection("noiseChecks").doc(v).update({ photos: (n.photos || []).concat([{ fileId: fr.id, name: d.name + ".jpg", type: "image/jpeg" }]) });
      link.refId = fr.id;
    } else {
      const kind = k === "photo" ? "record" : k === "veh" ? "vehicle" : k === "equip" ? "equip" : "event";
      const targetId = k === "photo" ? "r:" + v : k === "veh" ? v : k === "equip" ? "e:" + v : "ev:" + v;
      const targetName = k === "photo" ? v : k === "equip" ? v : k === "veh" ? ((vehicles.find(x => x.id === v) || {}).nickname || (vehicles.find(x => x.id === v) || {}).number || "") : ((events.find(x => x.id === v) || {}).title || "");
      const ex = await db.collection("isoPhotos").where("targetId", "==", targetId).get();
      const pr = db.collection("isoPhotos").doc();
      await db.collection("isoPhotoFiles").doc(pr.id).set({ data: full, ...(k === "event" ? { type: "image/jpeg", name: d.name + ".jpg", eventId: v } : {}) });
      await pr.set({ kind, targetId, targetName, memo: d.name || "", thumb: jpg(img, 480, .72), shotDate: d.shotDate || today(), isMain: !ex.docs.some(x => x.data().isMain) && kind !== "event",
        ...(k === "event" ? { eventId: v } : {}), libId: id, recBy: d.recBy || "", createdMs: Date.now(), createdAt: ref.TS });
      link.refId = pr.id;
    }
  } else if (k === "event" || k === "water" || k === "train") {
    const raw = b64raw(url), size = Math.round(raw.length * .75);
    if (raw.length > 950 * 1024) throw new Error("ファイルが大きすぎます（約700KBまで）。EMS書類の原本やフォルダなら入れられます");
    const fcol = k === "event" ? "isoEventFiles" : k === "water" ? "waterTestFiles" : "trainingFiles", rcol = k === "event" ? "isoEvents" : k === "water" ? "waterTests" : "trainingRecords";
    const nm = d.fileName || d.name;
    const fr = await db.collection(fcol).add({ [k === "event" ? "eventId" : k === "water" ? "testId" : "trainingId"]: v, name: nm, type: d.type, size, data: raw, libId: id, createdAt: ref.TS });
    const rec = (await db.collection(rcol).doc(v).get()).data() || {};
    await db.collection(rcol).doc(v).update({ attachments: (rec.attachments || []).concat([{ name: nm, fileId: fr.id, type: d.type, size, uploadedAt: Date.now(), libId: id }]) });
    link.refId = fr.id;
  } else if (k === "ems") {
    const date = prompt("EMS-" + v + " の原本の日付（作成日・改訂日）", d.shotDate || today()); if (date == null) throw new Error("やめました");
    link.refId = await EMS.upload(v, urlToFile(url, d.fileName || (d.name + (isImg(d) ? ".jpg" : ".pdf")), d.type), { date, title: "", memo: "写真・書類から" });
  } else throw new Error("行き先がわかりません");
  await db.collection(Library.COL).doc(id).update({ links: (d.links || []).concat([link]), folder: d.folder === "inbox" ? "other" : (d.folder || "other") });
}
async function dropLink(l){
  const [k, ...r] = l.to.split(":"), v = r.join(":");
  if (!l.refId) return;
  if (k === "noise") { await db.collection("noiseCheckFiles").doc(l.refId).delete(); const n = (await db.collection("noiseChecks").doc(v).get()).data(); if (n) await db.collection("noiseChecks").doc(v).update({ photos: (n.photos || []).filter(p => p.fileId !== l.refId) }); return; }
  if (k === "ems") { if (window.EMS) await EMS.remove(l.refId); return; }
  if (["event", "water", "train"].includes(k)) {
    const fcol = k === "event" ? "isoEventFiles" : k === "water" ? "waterTestFiles" : "trainingFiles", rcol = k === "event" ? "isoEvents" : k === "water" ? "waterTests" : "trainingRecords";
    const isPhoto = (await db.collection("isoPhotos").doc(l.refId).get()).exists;
    if (isPhoto) { await db.collection("isoPhotos").doc(l.refId).delete(); await db.collection("isoPhotoFiles").doc(l.refId).delete(); return; }
    await db.collection(fcol).doc(l.refId).delete().catch(() => {});
    const rec = (await db.collection(rcol).doc(v).get()).data(); if (rec) await db.collection(rcol).doc(v).update({ attachments: (rec.attachments || []).filter(a => a.fileId !== l.refId) });
    return;
  }
  await db.collection("isoPhotos").doc(l.refId).delete(); await db.collection("isoPhotoFiles").doc(l.refId).delete();
}
window.unlink = async (id, i) => { const d = docs.find(x => x.id === id), l = d && (d.links || [])[i]; if (!l || !confirm(l.label + " から外しますか？\n（そこに出ていた写真・添付が消えます。このファイルは残ります）")) return;
  try { await dropLink(l); } catch (e) { console.error(e); } const links = d.links.slice(); links.splice(i, 1); await db.collection(Library.COL).doc(id).update({ links }); toast("外しました"); };
window.unUse = async (id, u) => { const d = docs.find(x => x.id === id); await db.collection(Library.COL).doc(id).update({ uses: (d.uses || []).filter(x => x !== u) }); };
window.setFolder = async (id, f) => { await db.collection(Library.COL).doc(id).update({ folder: f }); };
</script>
