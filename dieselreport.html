<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>軽油 分析報告書</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
  body { background:#f4f4f5; padding-bottom:60px; }
  header { background:#0369a1; color:#fff; padding:14px 16px; }
  header h1 { font-size:19px; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  .wrap { padding:12px; max-width:760px; margin:0 auto; }
  .backBtn { width:100%; padding:12px; border:none; border-radius:12px; background:#555; color:#fff; font-size:15px; font-weight:bold; margin-bottom:10px; }
  .yearRow { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .yBtn { border:none; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:bold; background:#e4e4e7; color:#52525b; }
  .yBtn.act { background:#0369a1; color:#fff; }
  .grayBtn { width:100%; padding:12px; border:none; border-radius:12px; background:#e4e4e7; color:#3f3f46; font-size:14px; font-weight:bold; margin-bottom:10px; }
  .cleanCard { background:#fffbeb; border:2px solid #f59e0b; border-radius:14px; padding:14px; margin-bottom:12px; }
  .cleanCard .t { font-size:15px; font-weight:bold; color:#92400e; margin-bottom:6px; }
  .cleanCard .d { font-size:13px; color:#78350f; line-height:1.8; }
  .cleanBtn { width:100%; padding:14px; border:none; border-radius:10px; background:#b45309; color:#fff; font-size:16px; font-weight:bold; margin-top:10px; }
  .paper { background:#fff; border-radius:14px; padding:18px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; }
  .paper h2 { font-size:17px; border-left:6px solid #0369a1; padding-left:10px; margin-bottom:4px; line-height:1.5; }
  .paper .period { font-size:13px; color:#52525b; margin-bottom:12px; }
  .jh { font-size:15px; font-weight:bold; color:#0369a1; margin:14px 0 6px; border-bottom:2px solid #e0f2fe; padding-bottom:3px; }
  .li { font-size:14px; line-height:2.0; padding-left:2px; }
  .li b.num { font-size:16px; }
  .up { color:#b91c1c; } .down { color:#15803d; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:4px; }
  th, td { padding:7px 6px; border-bottom:1px solid #eee; text-align:right; white-space:nowrap; }
  th { color:#52525b; font-size:12px; background:#f8fafc; }
  th:first-child, td:first-child { text-align:left; }
  .note { font-size:12px; color:#71717a; line-height:1.7; margin-top:6px; }
  .empty { text-align:center; color:#a1a1aa; padding:26px 10px; font-size:14px; line-height:1.9; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; }
  @media print {
    .backBtn, .grayBtn, .yearRow, .cleanCard { display:none !important; }
    body { background:#fff; }
    .paper { box-shadow:none; }
  }
</style>
</head>
<body>

<header>
  <h1>📊 軽油使用量・CO2 分析報告書</h1>
  <div class="sub">毎月の⛽入力から、前年度と同じ形の報告書を自動で作ります</div>
</header>

<div class="wrap">
<button class="backBtn" onclick="location.href='index.html'">← ISO管理に戻る</button>
<div id="cleanBox"></div>
<div class="yearRow" id="yearRow"></div>
<button class="grayBtn" onclick="window.print()">🖨️ 印刷(そのまま報告書になります)</button>
<div id="report"><div class="empty">読み込み中...</div></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const CO2 = 2.58;
const EMBED = {"PREV": {"total": 155433.84, "months": {"2024-08": 11550.35, "2024-09": 12151.59, "2024-10": 11879.64, "2024-11": 13355.33, "2024-12": 13791.31, "2025-01": 12246.11, "2025-02": 11953.61, "2025-03": 15168.44, "2025-04": 13333.76, "2025-05": 12449.09, "2025-06": 12915.29, "2025-07": 14639.32}, "vehicles": {"576": 3552.47, "950": 3312.81, "6ヒア": 1920.31, "5t": 5599.71, "新10Ｔ": 9097.13, "230": 2771.89, "タダノ": 1796.01, "3tワイド": 2170.64, "2.9": 1644.9, "8t": 4647.51, "三菱ワイド": 3346.38, "青パッカー": 2220.15, "セルフ": 2561.22, "265": 2938.86, "10t": 7255.11, "いすゞ25t": 24079.01, "5ヒア": 10661.16, "6ヒアロング": 5837.62, "620": 4577.9, "三菱25t": 11020, "ヒノ": 3511.04, "アームロール": 1334.32, "640": 8108.51, "25tセルフ": 4176.2, "340": 1923.04, "3ヒア": 2352.14, "440": 1176.53, "白パッカー": 203.12, "ツートン": 1123.74, "290": 1817.28, "3tパッカー": 1674.83, "3t": 1679.43, "低クレ": 4240.67, "ハイエース": 880.35, "567": 1223.92, "全リフト": 4955.64, "新3ヒア": 242.19}, "stands": {"宇佐美": 78457.5, "ラインネット": 39773.5, "アミコ": 22108.4, "日信サービス": 7416.2, "SHIOZAWA": 5477.8, "さらしな石油": 1470.7, "山田屋給油所": 729.7}}, "AUG": {"yearMonth": "2025-08", "totalLiters": 12781.67, "vehicles": [{"name": "576", "stand": "SHIOZAWA", "liters": 31.0}, {"name": "576", "stand": "宇佐美", "liters": 134.0}, {"name": "576", "stand": "アミコ", "liters": 92.09}, {"name": "950", "stand": "宇佐美", "liters": 160.1}, {"name": "950", "stand": "日信サービス", "liters": 42.6}, {"name": "6ヒア", "stand": "宇佐美", "liters": 267.0}, {"name": "5t", "stand": "宇佐美", "liters": 506.0}, {"name": "5t", "stand": "ラインネット", "liters": 79.0}, {"name": "新10Ｔ", "stand": "宇佐美", "liters": 286.0}, {"name": "新10Ｔ", "stand": "ラインネット", "liters": 574.0}, {"name": "230", "stand": "SHIOZAWA", "liters": 62.0}, {"name": "230", "stand": "アミコ", "liters": 206.94}, {"name": "230", "stand": "日信サービス", "liters": 52.0}, {"name": "タダノ", "stand": "宇佐美", "liters": 199.0}, {"name": "タダノ", "stand": "日信サービス", "liters": 126.91}, {"name": "3tワイド", "stand": "アミコ", "liters": 108.44}, {"name": "2.9", "stand": "アミコ", "liters": 118.91}, {"name": "2.9", "stand": "日信サービス", "liters": 98.0}, {"name": "6ヒア", "stand": "宇佐美", "liters": 192.0}, {"name": "8t", "stand": "宇佐美", "liters": 368.0}, {"name": "8t", "stand": "アミコ", "liters": 45.0}, {"name": "三菱ワイド", "stand": "アミコ", "liters": 127.66}, {"name": "三菱ワイド", "stand": "日信サービス", "liters": 103.01}, {"name": "青パッカー", "stand": "宇佐美", "liters": 107.0}, {"name": "青パッカー", "stand": "アミコ", "liters": 142.14}, {"name": "セルフ", "stand": "宇佐美", "liters": 160.0}, {"name": "セルフ", "stand": "ラインネット", "liters": 143.0}, {"name": "265", "stand": "宇佐美", "liters": 179.0}, {"name": "10t", "stand": "宇佐美", "liters": 497.0}, {"name": "いすゞ25t", "stand": "宇佐美", "liters": 400.0}, {"name": "いすゞ25t", "stand": "ラインネット", "liters": 1358.0}, {"name": "5ヒア", "stand": "宇佐美", "liters": 623.0}, {"name": "5ヒア", "stand": "ラインネット", "liters": 171.06}, {"name": "6ヒアロング", "stand": "宇佐美", "liters": 371.0}, {"name": "620", "stand": "宇佐美", "liters": 369.0}, {"name": "三菱25t", "stand": "宇佐美", "liters": 433.0}, {"name": "三菱25t", "stand": "ラインネット", "liters": 585.0}, {"name": "ヒノ", "stand": "宇佐美", "liters": 56.0}, {"name": "ヒノ", "stand": "アミコ", "liters": 65.5}, {"name": "640", "stand": "宇佐美", "liters": 452.0}, {"name": "640", "stand": "ラインネット", "liters": 228.4}, {"name": "25tセルフ", "stand": "宇佐美", "liters": 266.0}, {"name": "440", "stand": "宇佐美", "liters": 19.0}, {"name": "440", "stand": "日信サービス", "liters": 57.9}, {"name": "白パッカー", "stand": "日信サービス", "liters": 30.8}, {"name": "白パッカー", "stand": "ラインネット", "liters": 25.0}, {"name": "ツートン", "stand": "アミコ", "liters": 100.9}, {"name": "3tパッカー", "stand": "アミコ", "liters": 166.47}, {"name": "3t", "stand": "アミコ", "liters": 130.13}, {"name": "3t", "stand": "日信サービス", "liters": 61.4}, {"name": "低クレ", "stand": "アミコ", "liters": 683.96}, {"name": "ハイエース", "stand": "宇佐美", "liters": 114.48}, {"name": "567", "stand": "SHIOZAWA", "liters": 63.7}, {"name": "567", "stand": "宇佐美", "liters": 98.0}, {"name": "567", "stand": "アミコ", "liters": 101.5}, {"name": "567", "stand": "日信サービス", "liters": 35.0}, {"name": "全リフト", "stand": "SHIOZAWA", "liters": 54.0}, {"name": "全リフト", "stand": "アミコ", "liters": 164.2}, {"name": "全リフト", "stand": "さらしな石油", "liters": 90.0}, {"name": "新3ヒア", "stand": "アミコ", "liters": 199.47}], "notes": "2025年8月(前年度Excelより・スタンド別)"}};
const OLD_IMPORT_NOTE = "前年度Excelより取込";

let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3500); }
function esc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(n){ return Math.round(n).toLocaleString(); }
function fmt1(n){ return n.toLocaleString(undefined,{maximumFractionDigits:1}); }
function fyOf(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m>=8 ? y : y-1; }
const FY_MONTHS = fy => { const a=[]; for(let i=0;i<12;i++){ const d=new Date(fy,7+i,1); a.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);} return a; };

let allRecords = [];
let curFy = null;

db.collection("dieselRecords").onSnapshot(snap=>{
  allRecords = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(r=>r.yearMonth);
  if(curFy===null){ const f=liveFys(); curFy = f.length ? f[0] : 2025; }
  renderYears(); render(); renderClean();
}, err=>{ document.getElementById("report").innerHTML = '<div class="empty">読み込めませんでした</div>'; console.error(err); });

function liveRecs(){ return allRecords.filter(r=>r.notes!==OLD_IMPORT_NOTE); }
function liveFys(){
  const s = new Set(liveRecs().map(r=>fyOf(r.yearMonth)));
  s.add(2025);
  return [...s].filter(fy=>fy>=2025).sort((a,b)=>b-a);
}

function dataOf(fy){
  if(fy===2024){
    return { fy, total:EMBED.PREV.total, months:EMBED.PREV.months, vehicles:EMBED.PREV.vehicles,
             stands:EMBED.PREV.stands, monthCount:12, ref:true };
  }
  const ms = FY_MONTHS(fy);
  const recs = liveRecs().filter(r=>ms.includes(r.yearMonth));
  const months={}, vehicles={}, stands={};
  recs.forEach(r=>{
    months[r.yearMonth]=(months[r.yearMonth]||0)+(Number(r.totalLiters)||0);
    (r.vehicles||[]).forEach(v=>{
      if(!v.name) return;
      vehicles[v.name]=(vehicles[v.name]||0)+(Number(v.liters)||0);
      const st=(v.stand||"").trim()||"(給油会社の記入なし)";
      stands[st]=(stands[st]||0)+(Number(v.liters)||0);
    });
  });
  return { fy, total:Object.values(months).reduce((a,b)=>a+b,0), months, vehicles, stands,
           monthCount:Object.keys(months).length, ref:false };
}

function renderYears(){
  let html = liveFys().map(fy=>`<button class="yBtn ${fy===curFy?"act":""}" onclick="setFy(${fy})">${fy}年度${fy===2025?"(今年)":""}</button>`).join("");
  html += `<button class="yBtn ${curFy===2024?"act":""}" onclick="setFy(2024)">2024年度(前年)</button>`;
  document.getElementById("yearRow").innerHTML = html;
}
window.setFy = function(fy){ curFy=fy; renderYears(); render(); };

function monthName(ym){ return `${+ym.slice(5,7)}月`; }

function render(){
  const box = document.getElementById("report");
  const cur = dataOf(curFy);
  const prev = dataOf(curFy-1);
  const hasPrev = prev.total>0;
  const ms = FY_MONTHS(curFy);
  const pms = FY_MONTHS(curFy-1);
  const vCount = Object.keys(cur.vehicles).length;
  const co2 = cur.total*CO2/1000;
  const full = cur.monthCount>=12;

  if(!cur.ref && cur.monthCount===0){
    box.innerHTML = `<div class="empty">まだ${curFy}年度(8月〜)の記録がありません。<br>⛽軽油使用量で月ごとに入力すると、ここに報告書ができていきます</div>`;
    return;
  }

  // ピーク月・閑散月
  const withData = ms.filter(m=>cur.months[m]);
  const sortedM = [...withData].sort((a,b)=>cur.months[b]-cur.months[a]);
  const peaks = sortedM.slice(0,Math.min(3,sortedM.length)).map(monthName).join("・");
  const lows = sortedM.length>=5 ? sortedM.slice(-2).map(monthName).join("・") : "";

  // 上位10台
  const rank = Object.entries(cur.vehicles).sort((a,b)=>b[1]-a[1]);
  const top10 = rank.slice(0,10);
  const topSum = top10.reduce((a,b)=>a+b[1],0);
  const lowVeh = rank.filter(([n,v])=>v<2000);

  let h = `<div class="paper">
    <h2>軽油使用量・CO2排出量 分析報告書(${curFy}年8月〜${curFy+1}年7月)</h2>
    <div class="period">対象期間: ${curFy}年8月1日〜${curFy+1}年7月31日${full?"(12か月)":`のうち、入力済みの<b>${cur.monthCount}か月分</b>(進行中)`}${cur.ref?"　※前年度Excelまとめから自動集計":""}</div>

    <div class="jh">年間実績${full?"":"(いまの時点)"}</div>
    <div class="li">・軽油使用量合計: <b class="num">${fmt(cur.total)} L</b>${full?"／年":""}(車両${vCount}台分)</div>
    <div class="li">・CO2排出量合計: <b class="num">約${fmt1(co2)}トン</b>(排出係数${CO2}kg-CO2/L)</div>
    <div class="li">・1台あたり平均: 軽油 ${vCount?fmt(cur.total/vCount):"−"} L／台、CO2 約${vCount?fmt1(co2/vCount):"−"}トン／台</div>
    ${top10.length?`<div class="li">・上位10台で全体の約${cur.total?Math.round(topSum/cur.total*100):0}%(約${fmt(topSum)} L)を消費</div>`:""}
    ${full&&lowVeh.length?`<div class="li">・低稼働車両(年間2,000L未満): ${lowVeh.length}台</div>`:""}
    ${peaks?`<div class="li">・ピーク月: ${peaks}${lows?`(閑散月: ${lows})`:""}</div>`:""}`;

  // 前年度比較
  if(hasPrev){
    if(full){
      const d = cur.total-prev.total, pct = d/prev.total*100;
      h += `<div class="jh">前年度との比較</div>
        <div class="li">・前年度実績: ${fmt(prev.total)} L → 今年度 ${fmt(cur.total)} L
        (<b class="${d>0?"up":"down"}">${d>0?"+":""}${fmt(d)} L、${pct>0?"+":""}${pct.toFixed(1)}%</b>)</div>`;
    } else {
      const doneIdx = ms.map((m,i)=>cur.months[m]?i:-1).filter(i=>i>=0);
      const sameSum = doneIdx.reduce((a,i)=>a+(prev.months[pms[i]]||0),0);
      const d = cur.total-sameSum, pct = sameSum>0?d/sameSum*100:0;
      h += `<div class="jh">前年度の同じ期間との比較</div>
        <div class="li">・前年度の同じ${doneIdx.length}か月: ${fmt(sameSum)} L → 今年度 ${fmt(cur.total)} L
        (<b class="${d>0?"up":"down"}">${d>0?"+":""}${fmt(d)} L、${pct>0?"+":""}${pct.toFixed(1)}%</b>)
        ${d<=0?"👏 削減ペースです":"⚠️ 前年より増えています"}</div>`;
    }
    const goal = prev.total*0.97;
    h += `<div class="jh">${cur.ref?"次年度":"今年度"}目標(前年度比3%削減)</div>
      <div class="li">・軽油使用量: <b class="num">${fmt(goal)} L以下</b>　・CO2排出量: 約${fmt1(goal*CO2/1000)}トン以下</div>
      ${!cur.ref&&full?`<div class="li">→ ${cur.total<=goal?'<b class="down">✅ 達成しました!</b>':`<b class="up">未達(あと${fmt(cur.total-goal)} L)</b>`}</div>`:""}`;
  } else if(cur.ref){
    const goal = cur.total*0.97;
    h += `<div class="jh">次年度目標(2025年度・前年比3%削減)</div>
      <div class="li">・軽油使用量: <b class="num">${fmt(goal)} L以下</b>　・CO2排出量: 約${fmt1(goal*CO2/1000)}トン以下</div>`;
  }
  h += `</div>`;

  // 月別表
  h += `<div class="paper"><div class="jh" style="margin-top:0;">📅 月別の使用量</div><table>
    <tr><th>月</th><th>${curFy}年度</th><th>前年度</th><th>差</th></tr>`;
  ms.forEach((m,i)=>{
    const v=cur.months[m]||0, pv=prev.months[pms[i]]||0, d=v-pv;
    h += `<tr><td>${monthName(m)}</td><td>${v?`<b>${fmt(v)}</b>`:"−"}</td>
      <td style="color:#94a3b8;">${pv?fmt(pv):"−"}</td>
      <td>${v&&pv?`<span class="${d>0?"up":"down"}">${d>0?"+":""}${fmt(d)}</span>`:"−"}</td></tr>`;
  });
  h += `<tr><td><b>合計</b></td><td><b>${fmt(cur.total)}</b></td><td style="color:#94a3b8;">${hasPrev?fmt(prev.total):"−"}</td><td></td></tr></table></div>`;

  // 給油会社別
  const standNames = [...new Set([...Object.keys(cur.stands), ...(hasPrev?Object.keys(prev.stands):[])])]
    .sort((a,b)=>(cur.stands[b]||0)-(cur.stands[a]||0) || (prev.stands[b]||0)-(prev.stands[a]||0));
  if(standNames.length){
    h += `<div class="paper"><div class="jh" style="margin-top:0;">⛽ 給油会社別</div><table>
      <tr><th>給油会社</th><th>${curFy}年度</th><th>割合</th><th>前年度</th></tr>`;
    standNames.forEach(st=>{
      const v=cur.stands[st]||0, pv=hasPrev?(prev.stands[st]||0):0;
      h += `<tr><td>${esc(st)}</td><td>${v?`<b>${fmt(v)}</b>`:"−"}</td>
        <td>${v&&cur.total?Math.round(v/cur.total*100)+"%":"−"}</td>
        <td style="color:#94a3b8;">${pv?fmt(pv):"−"}</td></tr>`;
    });
    h += `</table><div class="note">前年度の給油会社別は参考値(元Excelの12月に重複入力があったため、12月のみ他の月の比率で補正)</div></div>`;
  }

  // 車両ランキング
  if(top10.length){
    h += `<div class="paper"><div class="jh" style="margin-top:0;">🚛 年間使用量ランキング(上位10台)</div><table>
      <tr><th>順位</th><th>車両</th><th>${curFy}年度</th><th>前年度</th></tr>`;
    top10.forEach(([name,v],i)=>{
      const pv = hasPrev?(prev.vehicles[name]||0):0;
      h += `<tr><td>${i+1}</td><td>${esc(name)}</td><td><b>${fmt(v)} L</b></td><td style="color:#94a3b8;">${pv?fmt(pv):"−"}</td></tr>`;
    });
    h += `</table>`;
    if(full&&lowVeh.length){
      h += `<div class="jh">📦 低稼働車両(年間2,000L未満・${lowVeh.length}台)</div><table>`;
      lowVeh.sort((a,b)=>a[1]-b[1]).forEach(([name,v])=>{ h += `<tr><td>${esc(name)}</td><td>${fmt(v)} L</td></tr>`; });
      h += `</table><div class="note">予備・短距離利用中心。環境負荷は小さいが維持コストの見直し候補</div>`;
    }
    h += `</div>`;
  }

  box.innerHTML = h;
}

/* ---- 🧹 片づけ(旧取込データ→年間実績に一本化) ---- */
function renderClean(){
  const box = document.getElementById("cleanBox");
  const olds = allRecords.filter(r=>r.notes===OLD_IMPORT_NOTE);
  const hasAug = liveRecs().some(r=>r.yearMonth==="2025-08");
  if(olds.length){
    box.innerHTML = `<div class="cleanCard">
      <div class="t">🧹 最初にワンタップでお片づけ</div>
      <div class="d">前に取り込んだ前年度の細かい記録が<b>${olds.length}件</b>あります。前年度は年間実績としてこの報告書に残るので、細かい記録は不要です。<br>
      ボタン1つで: ①${olds.length}件を削除 → ②2025年8月分だけ<b>給油会社別の内訳つき</b>で登録し直します。⛽の一覧もスッキリします。</div>
      <button class="cleanBtn" id="cleanBtn" onclick="cleanAndReimport()">🧹 お片づけを実行(1回だけ)</button>
    </div>`;
  } else if(!hasAug){
    box.innerHTML = `<div class="cleanCard">
      <div class="t">📥 2025年8月分の登録</div>
      <div class="d">Excelにあった8月分(${fmt(EMBED.AUG.totalLiters)} L)を給油会社別の内訳つきで登録できます。9月以降は⛽軽油使用量から毎月入力してください。</div>
      <button class="cleanBtn" style="background:#0369a1;" onclick="importAug()">📥 8月分を登録する</button>
    </div>`;
  } else {
    box.innerHTML = "";
  }
}
window.cleanAndReimport = async function(){
  const olds = allRecords.filter(r=>r.notes===OLD_IMPORT_NOTE);
  const btn = document.getElementById("cleanBtn");
  btn.disabled = true; btn.textContent = "お片づけ中…";
  try{
    for(const r of olds) await db.collection("dieselRecords").doc(r.id).delete();
    if(!liveRecs().some(r=>r.yearMonth==="2025-08")){
      await db.collection("dieselRecords").add(EMBED.AUG);
    }
    toast("✅ お片づけ完了!8月分は給油会社別で入っています");
  }catch(e){ toast("❌ 失敗: "+e.message); btn.disabled=false; btn.textContent="🧹 お片づけを実行(1回だけ)"; }
};
window.importAug = async function(){
  if(liveRecs().some(r=>r.yearMonth==="2025-08")){ toast("2025年8月分はすでにあります"); return; }
  try{ await db.collection("dieselRecords").add(EMBED.AUG); toast("✅ 8月分を登録しました"); }
  catch(e){ toast("❌ 登録に失敗: "+e.message); }
};
</script>
