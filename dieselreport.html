let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3000); }
function esc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(n){ return Math.round(n).toLocaleString(); }
function fmt1(n){ return n.toLocaleString(undefined,{maximumFractionDigits:1}); }

// 年度: 8月〜翌7月。2024-08〜2025-07 → 2024年度
function fyOf(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m>=8 ? y : y-1; }
function fyLabel(fy){ return `${fy}年度(${fy}.8〜${fy+1}.7)`; }
const FY_MONTHS = fy => { const a=[]; for(let i=0;i<12;i++){ const d=new Date(fy, 7+i, 1); a.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);} return a; };

let allRecords = [];
let curFy = null;

db.collection("dieselRecords").onSnapshot(snap=>{
  allRecords = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(r=>r.yearMonth);
  const fys = [...new Set(allRecords.map(r=>fyOf(r.yearMonth)))].sort((a,b)=>b-a);
  if(curFy===null && fys.length) curFy = fys[0];
  renderYears(fys);
  render();
}, err=>{ document.getElementById("report").innerHTML = '<div class="empty">読み込めませんでした</div>'; console.error(err); });

function renderYears(fys){
  document.getElementById("yearRow").innerHTML = fys.map(fy=>
    `<button class="yBtn ${fy===curFy?"act":""}" onclick="setFy(${fy})">${fy}年度</button>`).join("");
}
window.setFy = function(fy){ curFy = fy; renderYears([...new Set(allRecords.map(r=>fyOf(r.yearMonth)))].sort((a,b)=>b-a)); render(); };

function fyData(fy){
  const months = FY_MONTHS(fy);
  const recs = allRecords.filter(r=>months.includes(r.yearMonth));
  const byMonth = {}; months.forEach(m=>byMonth[m]=0);
  const byVehicle = {};
  recs.forEach(r=>{
    byMonth[r.yearMonth] = (byMonth[r.yearMonth]||0) + (Number(r.totalLiters)||0);
    (r.vehicles||[]).forEach(v=>{ if(v.name) byVehicle[v.name]=(byVehicle[v.name]||0)+(Number(v.liters)||0); });
  });
  const total = Object.values(byMonth).reduce((a,b)=>a+b,0);
  return { months, byMonth, byVehicle, total, monthCount: recs.length };
}

function render(){
  const box = document.getElementById("report");
  if(curFy===null){ box.innerHTML = '<div class="empty">まだ軽油の記録がありません。<br>⛽軽油使用量で月々の記録を入れるか、上の📥で前年度データを取り込んでください</div>'; return; }
  const cur = fyData(curFy);
  const prev = fyData(curFy-1);
  const hasPrev = prev.monthCount > 0;
  const co2Cur = cur.total*CO2/1000;
  const vCount = Object.keys(cur.byVehicle).length;
  const diff = hasPrev ? cur.total-prev.total : 0;
  const diffPct = hasPrev && prev.total>0 ? (diff/prev.total*100) : 0;
  const partial = cur.monthCount<12 ? `<div class="note">⚠️ ${curFy}年度はまだ${cur.monthCount}か月分です(12か月そろうと年間の姿になります)</div>` : "";

  // サマリー
  let html = partial + `<div class="grid">
    <div class="stat"><div class="k">年間軽油使用量</div><div class="v">${fmt(cur.total)} L</div><div class="d">${cur.monthCount}か月分・${vCount}台</div></div>
    <div class="stat"><div class="k">CO2排出量</div><div class="v">${fmt1(co2Cur)} t</div><div class="d">係数 ${CO2} kg-CO2/L</div></div>
    <div class="stat"><div class="k">前年度比</div><div class="v">${hasPrev?`<span class="${diff>0?"up":"down"}">${diff>0?"+":""}${fmt(diff)} L</span>`:"—"}</div><div class="d">${hasPrev?`${diffPct>0?"+":""}${diffPct.toFixed(1)}%(前年 ${fmt(prev.total)} L)`:"前年度の記録がありません"}</div></div>
    <div class="stat"><div class="k">1台あたり平均</div><div class="v">${vCount?fmt(cur.total/vCount):"—"} L</div><div class="d">CO2 約${vCount?fmt1(co2Cur/vCount):"—"} t/台</div></div>
  </div>`;
  // 目安目標(前年比3%減)
  if(hasPrev){
    const goal = prev.total*0.97;
    const ok = cur.total<=goal;
    html += `<div class="card" style="border-left:5px solid ${ok?"#15803d":"#b45309"};">
      🎯 <b>目安目標(前年度比3%削減): ${fmt(goal)} L</b>　→ ${cur.monthCount<12?"進行中":(ok?'<b class="down">達成!</b>':`<b class="up">未達(+${fmt(cur.total-goal)} L)</b>`)}
    </div>`;
  }

  // 月別推移(前年同月と並べる)
  const maxV = Math.max(...cur.months.map(m=>cur.byMonth[m]||0), ...(hasPrev?prev.months.map(m=>prev.byMonth[m]||0):[0]), 1);
  html += `<div class="secHead">📅 月別推移${hasPrev?"(グレー=前年度)":""}</div><div class="card"><table>
    <tr><th>月</th><th>使用量</th>${hasPrev?"<th>前年同月</th><th>増減</th>":""}<th style="text-align:left;">グラフ</th></tr>`;
  cur.months.forEach((m,i)=>{
    const v = cur.byMonth[m]||0;
    const pv = hasPrev ? (prev.byMonth[prev.months[i]]||0) : 0;
    const d = v-pv;
    html += `<tr><td>${+m.slice(5,7)}月</td><td>${v?fmt(v):"−"}</td>
      ${hasPrev?`<td style="color:#94a3b8;">${pv?fmt(pv):"−"}</td><td>${v&&pv?`<span class="${d>0?"up":"down"}">${d>0?"+":""}${fmt(d)}</span>`:"−"}</td>`:""}
      <td style="text-align:left;min-width:110px;">${hasPrev?`<span class="bar barPrev" style="width:${Math.round(pv/maxV*100)}px;"></span><br>`:""}<span class="bar" style="width:${Math.round(v/maxV*100)}px;"></span></td></tr>`;
  });
  html += `</table></div>`;

  // 車両ランキング
  const rank = Object.entries(cur.byVehicle).sort((a,b)=>b[1]-a[1]);
  if(rank.length){
    const top10 = rank.slice(0,10);
    const topSum = top10.reduce((a,b)=>a+b[1],0);
    html += `<div class="secHead">🚛 使用量ランキング(上位10台)</div><div class="card"><table>
      <tr><th>順位</th><th style="text-align:left;">車両</th><th>使用量</th>${hasPrev?"<th>前年</th><th>増減</th>":""}</tr>`;
    top10.forEach(([name,v],i)=>{
      const pv = prev.byVehicle[name]||0;
      const d = v-pv;
      html += `<tr><td>${i+1}</td><td style="text-align:left;">${esc(name)}</td><td><b>${fmt(v)} L</b></td>
        ${hasPrev?`<td style="color:#94a3b8;">${pv?fmt(pv):"−"}</td><td>${pv?`<span class="${d>0?"up":"down"}">${d>0?"+":""}${fmt(d)}</span>`:"新"}</td>`:""}</tr>`;
    });
    html += `</table><div class="note">上位10台で全体の約${cur.total?Math.round(topSum/cur.total*100):0}%(${fmt(topSum)} L)</div></div>`;

    const low = rank.filter(([n,v])=>v<2000).sort((a,b)=>a[1]-b[1]);
    if(low.length){
      html += `<div class="secHead">📦 低稼働車両(年間2,000L未満・${low.length}台)</div><div class="card"><table>`;
      low.forEach(([name,v])=>{ html += `<tr><td style="text-align:left;">${esc(name)}</td><td>${fmt(v)} L</td></tr>`; });
      html += `</table><div class="note">予備・短距離中心の車両。環境負荷は小さいが維持コストの見直し候補</div></div>`;
    }
  }
  box.innerHTML = html;
}

/* ---- 前年度Excelデータの取込 ---- */
async function runImport(){
  const btn = document.getElementById("impBtn");
  btn.disabled = true;
  const existing = new Set(allRecords.map(r=>r.yearMonth));
  let added=0, skipped=0;
  try{
    for(const rec of IMPORT_DATA){
      if(existing.has(rec.yearMonth)){ skipped++; continue; }
      await db.collection("dieselRecords").add(rec);
      added++;
      btn.textContent = `取り込み中… ${added}件`;
    }
    toast(`✅ ${added}件を取り込みました${skipped?`(${skipped}件は登録済みのためスキップ)`:""}`);
    btn.textContent = "📥 取り込みを実行";
  }catch(e){ toast("❌ 取り込みに失敗: "+e.message); btn.textContent = "📥 取り込みを実行"; }
  btn.disabled = false;
}
</script>
