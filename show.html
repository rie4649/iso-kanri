<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>環境への取り組み | 株式会社関根商店</title>
<link rel="icon" href="icon-192.png">
<style id="pageStyle">@page { size: A4 landscape; margin: 10mm; }</style>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; background:#e8ecf4; color:#1e293b; }
button { font-family:inherit; cursor:pointer; }

/* ===== 上のバー ===== */
#bar { position:fixed; top:0; left:0; right:0; height:58px; z-index:50; background:#1e3a5f; color:#fff; display:flex; align-items:center; gap:8px; padding:0 12px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
#bar .bt { border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; border-radius:6px; padding:9px 14px; font-size:15px; font-weight:bold; white-space:nowrap; flex-shrink:0; cursor:pointer; touch-action:manipulation; }
#bar .bt:disabled { opacity:.35; cursor:default; }
#stage.busy .slide { opacity:.45; pointer-events:none; transition:opacity .1s; }
button, .openBtn, .tile { touch-action:manipulation; }
#bar .bt:hover { background:rgba(255,255,255,.22); }
#bar .nav { font-size:20px; padding:6px 16px; }
#bar .ttl { flex:1; min-width:0; text-align:center; font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#bar .pg { font-size:13px; opacity:.75; white-space:nowrap; }

/* ===== スライド ===== */
#stage { padding:76px 18px 30px; min-height:100%; }
.slide { background:#fff; border-radius:6px; max-width:1400px; margin:0 auto; padding:30px 38px 36px; box-shadow:0 6px 24px rgba(15,23,42,.08); min-height:calc(100vh - 110px); }
.sHead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; border-bottom:3px solid #1e3a5f; padding-bottom:12px; margin-bottom:16px; }
.sHead h2 { font-size:30px; font-weight:700; color:#1e3a5f; }
.sHead .sub { font-size:16px; color:#64748b; font-weight:bold; }
.per { margin-left:auto; display:flex; align-items:center; gap:8px; }
.per button { border:2px solid #cbd5e1; background:#eef2f7; color:#1e3a5f; border-radius:10px; width:46px; height:42px; font-size:18px; font-weight:900; }
.per button:disabled { opacity:.3; cursor:default; }
.per span { font-size:20px; font-weight:900; color:#1e3a5f; min-width:120px; text-align:center; }
.purpose { background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:10px 16px; margin-bottom:18px; font-size:16px; line-height:1.8; color:#78350f; white-space:pre-wrap; }
.purpose b { color:#92400e; }
h3.sec { font-size:22px; color:#1e3a5f; margin:22px 0 10px; padding-left:10px; border-left:6px solid #2c4f7c; }
.note { font-size:14px; color:#64748b; margin:6px 0; }
.empty { text-align:center; color:#94a3b8; font-size:20px; padding:50px 0; }

/* 表 */
table.t { width:100%; border-collapse:collapse; font-size:18px; }
table.t th { background:#eef2f7; color:#1e3a5f; font-weight:900; padding:10px 8px; border:1px solid #cbd5e1; text-align:center; white-space:nowrap; }
table.t td { padding:9px 10px; border:1px solid #e2e8f0; vertical-align:middle; }
table.t tr:nth-child(even) td { background:#f8fafc; }
table.t td.c { text-align:center; } table.t td.r { text-align:right; font-variant-numeric:tabular-nums; }
table.t td.nw { white-space:nowrap; }
.tw { overflow-x:auto; }
.ok { color:#15803d; font-weight:900; } .ng { color:#dc2626; font-weight:900; } .wn { color:#d97706; font-weight:900; }
.badge { display:inline-block; border-radius:999px; padding:2px 12px; font-size:15px; font-weight:900; white-space:nowrap; }
.b-ok { background:#dcfce7; color:#166534; } .b-wn { background:#fef3c7; color:#92400e; } .b-ng { background:#fee2e2; color:#991b1b; } .b-gr { background:#f1f5f9; color:#475569; }
.openBtn { border:1px solid #1e3a5f; background:#fff; color:#1e3a5f; border-radius:6px; padding:6px 14px; font-size:15px; font-weight:bold; white-space:nowrap; margin:2px; }
table.t tr.sigRow td { background:#fff1f2 !important; }
.recQ { font-size:13px; font-weight:bold; color:#0f766e; background:#ccfbf1; border-radius:99px; padding:2px 10px; margin-left:10px; vertical-align:middle; }
.recg { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; margin-bottom:10px; }
.recc { background:#fff; border:1px solid #cbd5e1; border-radius:12px; overflow:hidden; cursor:zoom-in; break-inside:avoid; }
.recc img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
.recm { font-size:14px; color:#334155; padding:6px 10px 8px; }
.eqSum { font-size:20px; font-weight:bold; color:#1e3a5f; background:#eef2f7; border:1px solid #cbd5e1; border-radius:12px; padding:12px 18px; margin:4px 0 6px; }
.eqSum b { font-size:30px; margin:0 2px; }
.eqSum span { display:block; font-size:15px; color:#1e3a5f; margin-top:2px; }
.eqCnt { font-size:14px; color:#2c4f7c; margin-left:10px; font-weight:bold; }
.eqg { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:8px; }
.eqc { background:#fff; border:1px solid #cbd5e1; border-radius:12px; overflow:hidden; break-inside:avoid; }
.eqb { padding:8px 12px 10px; }
.eqn { font-size:20px; font-weight:900; color:#1e3a5f; line-height:1.3; }
.eqs { font-size:13px; color:#64748b; margin-top:2px; }
.kpis { display:flex; gap:14px; flex-wrap:wrap; margin:6px 0 14px; }
.kpi { flex:1; min-width:200px; background:#f8fafc; border:1px solid #cbd5e1; border-left:4px solid #1e3a5f; border-radius:6px; padding:14px 18px; }
.kpi .k { font-size:15px; color:#475569; font-weight:bold; }
.kpi .v { font-size:34px; font-weight:900; color:#1e3a5f; line-height:1.2; }
.kpi .v small { font-size:16px; color:#64748b; margin-left:4px; }
.bar { height:22px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,#22c55e,#16a34a); }
.dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }

/* 表紙・目次 */
.cover { text-align:center; padding:30px 0 10px; }
.cover .co { font-size:26px; font-weight:bold; color:#475569; }
.cover h1 { font-size:46px; font-weight:900; color:#1e3a5f; margin:10px 0 6px; }
.cover .iso { display:inline-block; background:#1e3a5f; color:#fff; border-radius:4px; padding:6px 22px; font-size:20px; font-weight:bold; }
.cover .dt { margin-top:10px; color:#64748b; font-size:16px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-top:28px; }
.tile { border:1px solid #cbd5e1; background:#fff; border-radius:6px; padding:12px 14px; text-align:left; cursor:pointer; transition:.15s; display:flex; align-items:baseline; gap:10px; }
.tile:hover { border-color:#1e3a5f; background:#eef2f7; }
.tile .ic { font-size:14px; color:#64748b; font-variant-numeric:tabular-nums; min-width:22px; text-align:right; } .tile .nm { font-size:17px; font-weight:700; color:#1e3a5f; line-height:1.4; }

/* 沿革(年表) */
.hsSum { font-size:18px; font-weight:bold; color:#1e3a5f; margin:2px 0 12px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.hsSum b { font-size:26px; color:#1e3a5f; }
.hsSum span { display:flex; flex-wrap:wrap; gap:6px; }
.hsSum i, .hsX i { font-style:normal; font-size:13px; font-weight:bold; border-radius:99px; padding:2px 10px; white-space:nowrap; }
.hs { max-width:1100px; }
.hsEra { font-size:22px; font-weight:700; color:#fff; background:#1e3a5f; border-radius:4px; padding:6px 16px; margin:14px 0 4px; break-after:avoid; }
.hsEra small { font-size:14px; font-weight:bold; opacity:.85; margin-left:12px; }
.hsRow { display:flex; gap:18px; align-items:baseline; padding:9px 4px; border-bottom:1px solid #e2e8f0; break-inside:avoid; }
.hsD { width:190px; flex-shrink:0; }
.hsD b { display:block; font-size:19px; color:#1e3a5f; }
.hsD small { font-size:13px; color:#2c4f7c; font-weight:bold; }
.hsX { font-size:19px; font-weight:bold; color:#1e293b; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
@media (max-width:700px){ .hsRow { flex-direction:column; gap:2px; } .hsD { width:auto; } }
.tl { position:relative; margin:10px 0 0 10px; }
.tl::before { content:""; position:absolute; left:142px; top:6px; bottom:6px; width:4px; background:#cbd5e1; border-radius:2px; }
.tl .row { display:flex; align-items:baseline; gap:30px; padding:8px 0; position:relative; }
.tl .d { width:120px; flex-shrink:0; text-align:right; font-size:18px; font-weight:900; color:#1e3a5f; white-space:nowrap; }
.tl .row::before { content:""; position:absolute; left:136px; top:15px; width:16px; height:16px; border-radius:50%; background:#fff; border:4px solid #2c4f7c; }
.tl .x { font-size:20px; font-weight:bold; padding-left:14px; }
.tl.two { column-count:2; column-gap:40px; }
.tl.two .row { break-inside:avoid; }

/* 組織図(線でつながった木の形) */
.org { text-align:center; padding:10px 0 4px; overflow-x:auto; }
.org .box { display:inline-block; border-radius:10px; padding:12px 22px; font-size:20px; font-weight:900; color:#1e3a5f; box-shadow:0 2px 6px rgba(0,0,0,.08); white-space:nowrap; }
.org .vl { width:3px; height:26px; background:#64748b; margin:0 auto; }
.org .tr { display:flex; justify-content:center; }
.org .tc { position:relative; padding:24px 14px 0; display:flex; flex-direction:column; align-items:center; }
.org .tc::before { content:""; position:absolute; top:0; left:50%; width:3px; height:24px; margin-left:-1.5px; background:#64748b; }
.org .tc::after { content:""; position:absolute; top:0; left:0; right:0; border-top:3px solid #64748b; }
.org .tc:first-child::after { left:50%; }
.org .tc:last-child::after { right:50%; }
.org .tc:only-child::after { display:none; }
.org .tr.top > .tc { padding-top:0; } .org .tr.top > .tc::before, .org .tr.top > .tc::after { display:none; }
.org .dept { min-width:230px; }
.org .dept .box { background:#14b8a6; color:#fff; width:100%; }
.org .items { text-align:left; margin-top:6px; padding-left:22px; position:relative; width:100%; }
.org .items::before { content:""; position:absolute; left:10px; top:0; bottom:22px; width:3px; background:#94a3b8; }
.org .items div { position:relative; padding:8px 4px 8px 16px; font-size:18px; font-weight:bold; }
.org .items div::before { content:""; position:absolute; left:-12px; top:50%; width:22px; border-top:3px solid #94a3b8; }

/* 章・コース・まとめ・方針 */
.chHead { grid-column:1/-1; font-size:18px; font-weight:900; color:#fff; background:#1e3a5f; border-radius:10px; padding:8px 14px; margin-top:8px; }
.chHead small { font-weight:bold; opacity:.8; margin-left:8px; font-size:14px; }
.course { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.course button { border:3px solid #cbd5e1; background:#fff; color:#1e3a5f; border-radius:14px; padding:12px 22px; font-size:18px; font-weight:900; }
.course button.on { background:#1e3a5f; border-color:#1e3a5f; color:#fff; }
.course button small { display:block; font-size:12px; font-weight:bold; opacity:.8; }
.dash { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.dc { border-radius:16px; padding:16px 18px; border:2px solid #e2e8f0; background:#f8fafc; cursor:pointer; }
.dc:hover { border-color:#2c4f7c; }
.dc .k { font-size:16px; font-weight:900; color:#334155; } .dc .v { font-size:36px; font-weight:900; line-height:1.2; margin-top:4px; }
.dc .s { font-size:14px; color:#475569; margin-top:4px; line-height:1.6; }
.dc.g { background:#f0fdf4; border-color:#86efac; } .dc.g .v { color:#15803d; }
.dc.y { background:#fffbeb; border-color:#fcd34d; } .dc.y .v { color:#b45309; }
.dc.r { background:#fef2f2; border-color:#fca5a5; } .dc.r .v { color:#b91c1c; }
.dc.n .v { color:#1e3a5f; }
.facts { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
.fc { background:#1e3a5f; color:#fff; border-radius:14px; padding:12px 14px; cursor:pointer; }
.fc:hover { background:#2c4f7c; }
.fc .k { font-size:14px; font-weight:700; opacity:.9; } .fc .v { font-size:32px; font-weight:900; line-height:1.15; margin-top:2px; } .fc .v small { font-size:15px; margin-left:2px; }
.fc .s { font-size:12px; opacity:.85; margin-top:2px; line-height:1.5; }
.factHead { font-size:16px; font-weight:900; color:#1e3a5f; margin:0 0 8px; }
.policy { max-width:1000px; margin:10px auto; font-size:24px; line-height:2; font-weight:bold; color:#1e3a5f; white-space:pre-wrap; }
/* 環境方針: 見出し・項目名だけ太字、説明はふつうの太さ */
.pol { max-width:1000px; margin:6px auto 0; color:#1e3a5f; }
.pol .ph { font-size:28px; font-weight:900; color:#14532d; border-bottom:3px solid #bbf7d0; padding-bottom:4px; margin:22px 0 10px; }
.pol .ph:first-child { margin-top:4px; }
.pol .pt { font-size:20px; line-height:1.9; margin:4px 0; }
.pol .pi { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px 16px; margin:12px 0; }
.pol .pc { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px; padding:12px 16px; break-inside:avoid; }
.pol .pc b { display:block; font-size:20px; color:#14532d; margin-bottom:4px; }
.pol .pc span { font-size:17px; line-height:1.7; }
.pol .pe { font-size:20px; font-weight:bold; margin-top:16px; }
@media (max-width:800px){ .pol .pi { grid-template-columns:1fr; } }
.policySign { text-align:right; max-width:1000px; margin:20px auto 0; font-size:20px; font-weight:bold; color:#334155; line-height:1.8; }
.kv { width:100%; border-collapse:collapse; font-size:20px; }
.kv th { width:240px; text-align:left; background:#eef2f7; color:#1e3a5f; padding:12px 16px; border:1px solid #cbd5e1; white-space:nowrap; }
.kv td { padding:12px 16px; border:1px solid #e2e8f0; font-weight:bold; white-space:pre-wrap; }
.updated { margin-left:auto; font-size:13px; color:#94a3b8; font-weight:bold; white-space:nowrap; }
.chTag { font-size:14px; font-weight:900; color:#fff; background:#2c4f7c; border-radius:999px; padding:3px 12px; white-space:nowrap; }
/* 設定 */
#setBg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:90; align-items:center; justify-content:center; padding:14px; }
#setBg.show { display:flex; }
#setBg .box { background:#fff; border-radius:16px; width:100%; max-width:720px; max-height:92vh; overflow-y:auto; padding:20px 22px; }
#setBg h3 { font-size:20px; color:#1e3a5f; margin-bottom:6px; }
#setBg label { display:block; font-size:14px; font-weight:bold; color:#475569; margin:12px 0 4px; }
#setBg input, #setBg textarea { width:100%; padding:10px; font-size:16px; border:1px solid #cbd5e1; border-radius:10px; font-family:inherit; }
#setBg .row2 { display:flex; gap:10px; } #setBg .row2 > div { flex:1; min-width:0; }
#setBg .grp { margin-top:16px; padding-top:10px; border-top:2px solid #eef2f7; font-weight:900; color:#1e3a5f; }
#setBg .btns { display:flex; gap:10px; margin-top:18px; }
#setBg .btns button { flex:1; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:bold; }
#printArea { display:none; }
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e3a5f; color:#fff; padding:12px 24px; border-radius:999px; font-size:15px; opacity:0; pointer-events:none; transition:.25s; z-index:99; }
#toast.show { opacity:1; }
#loading { text-align:center; padding:60px; color:#64748b; font-size:20px; }

@media (max-width:760px){
  #bar { height:auto; flex-wrap:wrap; padding:6px 8px; gap:5px; }
  #bar .ttl { order:-1; flex-basis:100%; font-size:16px; }
  #bar .bt { padding:7px 10px; font-size:13px; }
  #bar .pg { display:none; }
  #stage { padding:110px 8px 20px; }
  .slide { padding:18px 14px; border-radius:12px; }
  .sHead h2 { font-size:24px; }
  table.t { font-size:15px; }
  .tl::before { left:96px; } .tl .row::before { left:90px; } .tl .d { width:80px; font-size:15px; } .tl .x { font-size:16px; }
  .tl.two { column-count:1; }
  .org .box { font-size:15px; padding:8px 12px; }
  .org .tr { justify-content:flex-start; }
}
@media print {
  #bar, #stage, #toast { display:none !important; }
  #printArea { display:block !important; }
  body { background:#fff; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .pslide { page-break-after:always; break-after:page; }
  .pslide:last-child { page-break-after:auto; }
  .slide { box-shadow:none; border-radius:0; padding:0; min-height:0; max-width:none; }
  .per button, .openBtn, .tile, .course { display:none !important; }
  .dash { grid-template-columns:repeat(3,1fr); } .dc .v { font-size:22pt; } .facts { grid-template-columns:repeat(5,1fr); } .fc { background:#fff !important; color:#1e3a5f; border:2px solid #1e3a5f; } .fc .v { font-size:18pt; }
  .eqg { grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px; } .eqn { font-size:12pt; } .eqs { font-size:9pt; } .eqSum { font-size:13pt; }
  .policy { font-size:15pt; } .policySign { font-size:13pt; } .kv { font-size:12pt; }
  .pol .ph { font-size:16pt; margin:10px 0 6px; } .pol .pt, .pol .pe { font-size:11pt; } .pol .pc b { font-size:11.5pt; } .pol .pc span { font-size:10pt; } .pol .pc { padding:6px 10px; }
  .per span { min-width:0; }
  table.t { font-size:11pt; } table.t th, table.t td { padding:4px 6px; }
  .sHead h2 { font-size:20pt; }
  .hsD b, .hsX { font-size:11pt; } .hsRow { padding:3px 2px; } .hsEra { font-size:13pt; padding:3px 10px; margin:6px 0 2px; } .hsD { width:130px; }
  .tl .d, .tl .x { font-size:12pt; } .tl .row { padding:3px 0; }
  .org .box { font-size:12pt; padding:6px 12px; } .org .items div { font-size:11pt; padding:4px 4px 4px 14px; }
  table.t tr { break-inside:avoid; }
}
</style>
</head>
<body>

<div id="bar">
  <button class="bt" onclick="try{sessionStorage.setItem('isoRestore','1')}catch(e){};location.href='index.html'">← ISO管理</button>
  <button class="bt" onclick="go(0)">目次</button>
  <button class="bt" id="backBt" onclick="goBackPage()" disabled title="1つ前に見たページへ">← 戻る</button>
  <button class="bt nav" onclick="step(-1)">◀</button>
  <div class="ttl" id="barTtl">環境への取り組み</div>
  <span class="pg" id="barPg"></span>
  <button class="bt nav" onclick="step(1)">▶</button>
  <button class="bt" onclick="toggleFull()">全画面</button>
  <button class="bt" onclick="printCurrent()">このページを印刷</button>
  <button class="bt" onclick="printAll()">全ページPDF</button>
</div>

<!-- 表紙・環境方針・認証の情報の入力 -->
<div id="setBg" onclick="if(event.target===this)closeSet()">
  <div class="box">
    <h3>⚙️ 会社概要・環境方針・認証の情報</h3>
    <div class="note">ここに入れた内容が「環境への取り組み」の表紙・環境方針・認証の情報のページに出ます。</div>
    <div class="grp">🏢 会社概要</div>
    <div class="row2"><div><label>会社名</label><input id="s_company" placeholder="株式会社関根商店"></div><div><label>代表者</label><input id="s_rep" placeholder="代表取締役社長 ◯◯ ◯◯"></div></div>
    <label>所在地</label><input id="s_address" placeholder="長野県上田市住吉316-2">
    <div class="row2"><div><label>設立</label><input id="s_founded" placeholder="昭和49年9月"></div><div><label>従業員数</label><input id="s_employees" placeholder="◯◯名"></div></div>

const pad = n => String(n).padStart(2,"0");
const todayYmd = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const WD = ["日","月","火","水","木","金","土"];
function fd(s){ if (!s) return ""; const p = String(s).split("-"); if (p.length < 3) return s; return Number(p[0])+"/"+Number(p[1])+"/"+Number(p[2]); }
function fdw(s){ if (!s) return ""; const d = new Date(s+"T00:00:00"); return isNaN(d) ? s : fd(s)+"("+WD[d.getDay()]+")"; }
function num(v, dg){ if (v == null || v === "" || isNaN(v)) return "-"; return Number(v).toLocaleString("ja-JP", { maximumFractionDigits: dg == null ? 1 : dg }); }
function fyOf(ym){ if (!ym) return ""; const [y, m] = String(ym).slice(0,7).split("-").map(Number); return m >= 8 ? y+"-"+(y+1) : (y-1)+"-"+y; }
function fyLabel(fy){ const a = String(fy).split("-"); return a.length === 2 ? a[0]+"年度" : fy; }

function daysLeft(ds){ if (!ds) return null; return Math.round((new Date(ds+"T00:00:00") - new Date(todayYmd()+"T00:00:00")) / 86400000); }

/* ---------- 読み込み(1回だけ) ---------- */

let touched = new Set();   // いま描いているページで使ったデータ
function col(name){ touched.add(name); return cache[name] || (cache[name] = db.collection(name).get().then(s => (loaded[name] = s.docs.map(d => ({ id:d.id, ...d.data() })))).catch(e => { console.error(name, e); return (loaded[name] = []); })); }
function docGet(c, id){ const k = c+"/"+id; touched.add(k); return cache[k] || (cache[k] = db.collection(c).doc(id).get().then(d => { loaded[k] = d.exists ? [d.data()] : []; return d.exists ? d.data() : null; }).catch(() => { loaded[k] = []; return null; })); }
function tsOf(v){ if (!v) return ""; if (typeof v.toDate === "function"){ const d = v.toDate(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); } if (typeof v === "number"){ const d = new Date(v); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); } return /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0,10) : ""; }
const IGNORE_LAST = new Set(["sectionPurposes","eventMarks","activityTypes","isoKyokaSettings/groupOrder"]);
function lastUpdated(){
  let m = "";

  return m;
}

/* ---------- ファイルを開く ---------- */

let viewerUrl = null;
function showViewer(blob, title){
  closeViewer();
  viewerUrl = URL.createObjectURL(blob);
  const isImg = String(blob.type).startsWith("image/");
  const bg = document.createElement("div"); bg.id = "fileViewer";
  bg.style.cssText = "position:fixed;inset:0;z-index:95;background:rgba(15,23,42,.92);display:flex;flex-direction:column;";
  bg.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1e3a5f;color:#fff;">'+
      '<button style="border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:9px 16px;font-size:15px;font-weight:bold;cursor:pointer;background:#fff;color:#1e3a5f;" onclick="closeViewer()">← 戻る</button>'+
      '<div style="flex:1;font-weight:bold;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(title || "資料")+'</div>'+
      '<a style="border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:9px 16px;font-size:15px;font-weight:bold;cursor:pointer;background:transparent;color:#fff;text-decoration:none;" href="'+viewerUrl+'" target="_blank" rel="noopener">別のタブで開く</a>'+
      '<button style="border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:9px 16px;font-size:15px;font-weight:bold;cursor:pointer;background:transparent;color:#fff;" onclick="closeViewer()" aria-label="閉じる">✕ 閉じる</button></div>'+
    (isImg ? '<div style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px;"><img src="'+viewerUrl+'" alt="" style="max-width:100%;max-height:100%;background:#fff;"></div>'
           : '<iframe src="'+viewerUrl+'" title="'+esc(title || "資料")+'" style="flex:1;border:none;background:#fff;width:100%;"></iframe>');
  document.body.appendChild(bg);
}
function closeViewer(){ const v = document.getElementById("fileViewer"); if (v) v.remove(); if (viewerUrl){ const u = viewerUrl; viewerUrl = null; setTimeout(() => URL.revokeObjectURL(u), 60000); } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("fileViewer")){ e.stopPropagation(); closeViewer(); } }, true);
function b64Blob(b64, type){ const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type }); }
async function openInline(colName, fileId, title){
  toast("開いています…");
  try {
    const d = await db.collection(colName).doc(fileId).get();
    if (!d.exists) throw new Error("ファイルが見つかりません");
    const f = d.data();
    showViewer(b64Blob(f.data, f.type || "application/octet-stream"), title || f.name || "添付");
  } catch(e){ alert("開けませんでした: "+e.message); }
}
async function openChunked(chunkCol, fileId, type, title){
  toast("開いています…");
  try {
    const snap = await db.collection(chunkCol).where("fileId", "==", fileId).get();
    const parts = snap.docs.map(x => x.data()).sort((a,b) => a.idx - b.idx);
    if (!parts.length) throw new Error("中身が見つかりません");
    showViewer(b64Blob(parts.map(p => p.data).join(""), type || "application/pdf"), title);
  } catch(e){ alert("開けませんでした: "+e.message); }
}
function attBtns(atts, fileCol){

function elapsedFyMonths(fy){ const t = todayYmd().slice(0,7); return FY_MONTHS.filter(m => fyMonthYm(fy, m) <= t).length; }
async function renderDash(p){
  const fy = curFy(), y = todayYmd().slice(0,4), el = elapsedFyMonths(fy);
  const [kd, co, au, sp, fr, fe, wt, nc, tr, dr, dt, hv, ev, pf] = await Promise.all([col("isoKyokaDocs"), col("isoCorrectives"), col("isoAudits"), col("safetyPatrols"), col("freonRecords"),

  const cards = [];

    '<div class="note">● 保有　黄色＝有効期限が90日以内　赤＝期限切れ(有効期限が登録されている資格のみ判定)</div>';

function phOpen(tid, id){ eqLb.list = sortPh(eqPhotos.filter(y => y.targetId === tid)); eqLb.i = Math.max(0, eqLb.list.findIndex(y => y.id === id)); eqShow(); }

/* 写真の記録の「保管・掲示・現場の様子」の項目のうち、出すページにこのページを選んだもの */
async function pagePhotos(key){

/* ---------- 許可の内容(事業の範囲・積替え保管場所・処理施設) ----------
   ISO管理の「許可の内容」(permit.html)で入力。Firestore: isoPermitScopes(1件=1つの版。場所が変わったら新しい版を足す) */
function permitSort(a, b){ return String(b.startDate||"").localeCompare(String(a.startDate||"")) || (b.createdMs||0) - (a.createdMs||0); }
const dash = v => (v == null || String(v).trim() === "") ? "—" : esc(v);
async function renderPermit(p){
  const [vers0, ph, cm] = await Promise.all([col("isoPermitScopes"), col("isoPhotos"), col("compressorMachines")]);
  eqPhotos = ph;
  if (!vers0.length) return await head(p, "許可証の記載内容") + empty("ISO管理の「許可の内容」から入力すると、ここに出ます");
  const t = todayYmd();
  // 収集運搬業と処分業は別々の許可。それぞれに適用開始日と変更の履歴(前の作りの版は両方として扱う)
  const track = b => {
    const all = vers0.filter(v => v.biz === b || !v.biz).sort(permitSort);
    if (!all.length) return null;
    const curV = all.find(v => !v.startDate || v.startDate <= t) || all[all.length-1];
    return { all, curV, future: all.filter(v => v.startDate && v.startDate > t), past: all.filter(v => v !== curV && !(v.startDate && v.startDate > t)) };
  };
  const histHtml = T => '<div class="note" style="margin:8px 0 2px;font-weight:bold;">変更の履歴</div><div class="tw"><table class="t"><tr><th>適用開始</th><th>内容</th></tr>'+
    T.future.concat([T.curV]).concat(T.past).map(v => '<tr'+(v === T.curV ? ' style="background:#eff6ff;"' : '')+'><td class="c nw">'+(v.startDate ? fd(v.startDate) : "—")+(v === T.curV ? '<div class="note">現在</div>' : T.future.includes(v) ? '<div class="note">予定</div>' : '')+'</td><td>'+esc(v.memo || "")+'</td></tr>').join("")+'</table></div>';
  const sinceTxt = T => (T.curV.startDate ? fd(T.curV.startDate)+"から" : "")+(T.future.length ? '<span class="badge b-wn" style="margin-left:8px;">変更の予定 '+T.future.map(v => fd(v.startDate)+"から").join("、")+'</span>' : '');
  let h = await head(p, "許可証の記載内容");
  const C = track("collect");
  if (C){
    const cs = C.curV.collectScope || [], st = C.curV.sites || [];
    const sum = k => st.reduce((a, x) => a + (Number(String(x[k]||"").replace(/[^\d.]/g, "")) || 0), 0);
    h += '<h3 class="sec">産業廃棄物 収集運搬業<span class="recQ">'+sinceTxt(C)+'</span></h3>';
    if (cs.length) h += '<div class="note" style="margin-bottom:6px;">事業の範囲　○：取り扱うもの　◎：積替え又は保管行為を含むもの</div><div class="tw"><table class="t"><tr><th>取り扱う産業廃棄物の種類</th><th>積替保管</th><th>石綿含有<br>産業廃棄物</th><th>水銀使用製品<br>産業廃棄物</th><th>水銀含有<br>ばいじん等</th><th>自動車等<br>破砕物</th></tr>'+
      cs.map(x => '<tr><td><b>'+esc(x.kind)+'</b></td>'+["store","asb","hg","hgd","car"].map(k => '<td class="c">'+dash(x[k])+'</td>').join("")+'</tr>').join("")+'</table></div>';
    if (st.length) h += '<h3 class="sec">積替え・保管の場所</h3><div class="kpis"><div class="kpi"><div class="k">保管場所</div><div class="v">'+st.length+'<small>か所</small></div></div>'+
      '<div class="kpi"><div class="k">面積の合計</div><div class="v">'+num(sum("area"), 2)+'<small>㎡</small></div></div><div class="kpi"><div class="k">保管上限の合計</div><div class="v">'+num(sum("cap"), 2)+'<small>㎥</small></div></div></div>'+
      '<div class="tw"><table class="t"><tr><th>種類</th><th>所在地</th><th>面積(㎡)</th><th>保管上限(㎥)</th><th>高さ上限(m)</th></tr>'+
      st.map(x => '<tr><td><b>'+esc(x.kind)+'</b></td><td>'+esc(x.place)+'</td><td class="r">'+dash(x.area)+'</td><td class="r">'+dash(x.cap)+'</td><td class="r">'+dash(x.height)+'</td></tr>').join("")+'</table></div>';
    h += histHtml(C);
  }
  const M = track("mid");
  if (M){
    const ms = M.curV.midScope || [], fc = M.curV.facilities || [];
    h += '<h3 class="sec">産業廃棄物 処分業(中間処理)<span class="recQ">'+sinceTxt(M)+'</span></h3>';
    if (ms.length) h += '<div class="tw"><table class="t"><tr><th>事業の区分</th><th>処理方式</th><th>取り扱う産業廃棄物の種類</th></tr>'+ms.map(x => '<tr><td class="c">'+esc(x.kubun)+'</td><td class="c">'+esc(x.method)+'</td><td>'+esc(x.kinds)+'</td></tr>').join("")+'</table></div>';
    if (fc.length) h += '<div class="tw" style="margin-top:10px;"><table class="t"><tr><th>写真</th><th>施設の種類</th><th>設置場所</th><th>設置年月日・許可番号</th><th>処理能力</th></tr>'+fc.map(x => {
      const eq = x.equip || ((cm.find(m => /圧縮|梱包/.test(m.name||"")) || cm[0] || {}).name) || "";
      return '<tr><td class="c">'+(eq ? phThumb(ph, "e:"+eq, 110) : '')+'</td><td><b>'+esc(x.type)+'</b>'+(eq && cm.some(m => m.name === eq) ? '<div><button class="openBtn" style="margin-top:6px;" onclick="goKey(\'comp\')">点検記録 ›</button></div>' : '')+'</td>'+
        '<td>'+esc(x.place)+'</td><td class="c">'+[x.setDate, x.permitNo].filter(Boolean).map(esc).join("<br>")+'</td><td>'+esc(x.capacity)+'</td></tr>'; }).join("")+'</table></div>';
    h += histHtml(M);
  }
  return h;
}

/* ---------- 主な設備・車両 ---------- */
/* 車両・設備の写真(ISO管理の「📷 車両・設備の写真」で登録。isoPhotos=一覧用の小さい写真、isoPhotoFiles=拡大用) */
let eqPhotos = [], eqLb = { list:[], i:0 };
function eqOpen(t){
  eqLb.list = eqPhotos.filter(x => x.targetId === t).sort((a,b) => (b.isMain?1:0) - (a.isMain?1:0) || (a.createdMs||0) - (b.createdMs||0));
  eqLb.i = 0; eqShow();
}
async function eqShow(){
  let bg = document.getElementById("eqLb");
  if (!bg){ bg = document.createElement("div"); bg.id = "eqLb";
    bg.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:flex;align-items:center;justify-content:center;gap:14px;padding:16px;";
    bg.onclick = e => { if (e.target === bg) bg.remove(); }; document.body.appendChild(bg); }
  const x = eqLb.list[eqLb.i], n = eqLb.list.length, nav = "width:56px;height:56px;border-radius:50%;border:none;font-size:22px;cursor:pointer;flex:0 0 auto;";
  bg.innerHTML = (n > 1 ? '<button style="'+nav+'" onclick="eqLb.i=(eqLb.i+'+(n-1)+')%'+n+';eqShow()" aria-label="前の写真">◀</button>' : '')+
    '<div style="text-align:center;min-width:0;"><img id="eqLbImg" src="'+x.thumb+'" alt="" style="max-width:100%;max-height:82vh;border-radius:10px;"><div style="color:#fff;font-size:18px;margin-top:8px;">'+esc(x.targetName)+(x.memo ? '　'+esc(x.memo) : '')+(x.shotDate ? '　'+esc(fd(x.shotDate))+' 撮影' : '')+(n > 1 ? '　('+(eqLb.i+1)+' / '+n+')' : '')+'</div></div>'+
    (n > 1 ? '<button style="'+nav+'" onclick="eqLb.i=(eqLb.i+1)%'+n+';eqShow()" aria-label="次の写真">▶</button>' : '')+
    '<button style="position:absolute;top:14px;right:18px;'+nav+'width:48px;height:48px;" onclick="document.getElementById(\'eqLb\').remove()" aria-label="閉じる">✕</button>';
  try { const d = await db.collection("isoPhotoFiles").doc(x.id).get(); const im = document.getElementById("eqLbImg"); if (d.exists && im && eqLb.list[eqLb.i] === x) im.src = d.data().data; } catch(e){}
}
// 写真を拡大している間は、← → で写真をめくる(ページは進めない)・Escで閉じる
document.addEventListener("keydown", e => {
  const b = document.getElementById("eqLb"); if (!b) return;
  const n = eqLb.list.length;
  if (e.key === "Escape"){ b.remove(); e.stopImmediatePropagation(); e.preventDefault(); }
  else if (["ArrowRight","ArrowLeft"," ","PageDown","PageUp"].includes(e.key)){
    e.stopImmediatePropagation(); e.preventDefault();
    if (n > 1){ eqLb.i = (eqLb.i + (["ArrowLeft","PageUp"].includes(e.key) ? n-1 : 1)) % n; eqShow(); }
  }
}, true);

/* ---------- ISOの計画・リスクの台帳(registers.js の定義で表示。下書きは出さない) ---------- */
/* 計画書の原本(EMS文書管理の文書のうち「入力する場所」がこの台帳のもの)。各文書の最新の版だけボタンにする */
async function planDocBtns(regKey){
  const [docs, files] = await Promise.all([col("emsDocs"), col("emsDocFiles")]);
  const ds = docs.filter(d => d.link === "plan:"+regKey && !d.abolished).sort((a,b) => (a.order||999) - (b.order||999));
  const btns = ds.map(d => { const f = files.filter(x => x.code === d.id).sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")) || String(b.ver||"").localeCompare(String(a.ver||"")))[0];
    if (!f) return ""; const t = "EMS-"+d.id+" "+d.name;
    return '<button class="openBtn" style="margin:0 8px 6px 0;" onclick="openChunked(\''+esc(f.chunkCol||"emsDocChunks")+'\',\''+esc(f.chunkId||f.id)+'\',\''+esc(f.fileType||"application/pdf")+'\',\''+esc(t.replace(/'/g,""))+'\')">計画書を見る：'+esc(t)+'('+esc(fd(f.date))+')</button>'; }).filter(Boolean);
  return btns.length ? '<div style="margin:-4px 0 12px;">'+btns.join("")+'</div>' : "";
}
async function renderReg(p){
  const R = ISO_REGS.find(r => r.key === p.reg);
  let pdb = await planDocBtns(R.key);
  if (R.key === "vendors"){   // 共通マスタ管理の契約件数(会社名は出さない)
    try { pdb += '<h3 class="sec">契約件数</h3>' + ContractStats.html(await ContractStats.load()) + '<h3 class="sec">委託先の評価</h3>'; } catch(e){ console.error(e); }
  }
  let list = (await col(ISO_REG_COL)).filter(r => r.reg === R.key && !r.draft);
  // 年度の点検(ISO管理のチェックシートで「保存」したもの): 確認日・確認者
  try { const yc = (await col("isoYearChecks")).filter(v => v.reg === R.key).sort((a, b) => (b.year - a.year) || String(b.date).localeCompare(String(a.date)));
    if (yc.length){ const y = yc[0].year; pdb += '<div class="note" style="margin:0 0 10px;padding:6px 10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;color:#166534;">'+y+'年度の点検：'+
      yc.filter(v => v.year === y).map(v => (v.code ? 'EMS-'+esc(v.code)+' ' : '')+'確認日 '+esc(fd(v.date))+'・確認者 '+esc(v.by || "-")+'（'+v.done+'/'+v.total+(v.ng ? '・見直し '+v.ng : '')+'）').join("　")+'</div>'; } } catch(e){ console.error(e); }
  const sub = "ISO14001 "+R.clause;
  if (!list.length && R.key === "calib") return await head(p, sub) + pdb + empty("まだ登録がありません(ISO管理の「ISOの計画・リスク」→「測定機器の点検・校正」から入力します)") +
    '<div class="purpose" style="margin-top:12px;"><b>このページに載せるもの</b>　測定に使う機器そのものが正しく測れるかの確認です(点検の記録は「監視・測定の計画」と各ページにあります)。\n'+
    '例：トラックスケール(計量法の定期検査)／騒音計(騒音チェックに使用)／pH計・温度計(水質検査に使用)</div>';
  if (!list.length && R.key === "vendors") return await head(p, sub) + pdb + empty("委託先の評価はまだ登録がありません(ISO管理の「ISOの計画・リスク」→「外部委託先の管理」から入力します)");
  if (!list.length) return await head(p, sub) + pdb + (pdb ? '<div class="note">台帳の項目はまだ入力されていません。内容は上の計画書をご覧ください。</div>' : empty("まだ登録がありません(ISO管理の「ISOの計画・リスク」→「"+R.name+"」から入力します)"));
  if (R.dated) list.sort((a,b) => String(b[R.dated]||"").localeCompare(String(a[R.dated]||"")));
  else if (R.key === "aspects") list.sort((a,b) => aspectScore(b).total - aspectScore(a).total || (a.createdMs||0) - (b.createdMs||0));
  else list.sort((a,b) => (a.createdMs||0) - (b.createdMs||0));
  const cols = R.fields.filter(f => f.list && !f.score && !(R.key === "aspects" && f.k === "sigMark"));   // 著しいかどうかは「評価」の列に出す
  const t = todayYmd();
  let top = "";
  if (R.key === "aspects"){
    const sig = list.filter(r => aspectScore(r).sig);

async function renderEquip(p){
  const [vs, cm, fe, ph] = await Promise.all([col("master_vehicles"), col("compressorMachines"), col("freonEquipments"), col("isoPhotos")]);

  const byT = {}; ph.slice().sort((a,b) => (a.createdMs||0) - (b.createdMs||0)).forEach(x => (byT[x.targetId] = byT[x.targetId] || []).push(x));

  const vn = v => String(v.nickname || v.number || "").trim();
  const vsort = (a, b) => { const na = vn(a), nb = vn(b), ia = /^\d/.test(na), ib = /^\d/.test(nb); return ia !== ib ? (ia ? -1 : 1) : na.localeCompare(nb, "ja", { numeric:true }); };

  // カード1枚(写真があれば写真、なければ写真の場所に薄いアイコン。写真が1枚もないうちは文字だけのカード)
  const card = (key, name, sub, icon, link) => {

  const models = Object.keys(byModel).sort((a,b) => byModel[b].length - byModel[a].length);

  // フロン類使用機器(事務所のエアコン等)は「主な設備」に出さない(フロン簡易点検のページで扱う) 2026-10
  const feNames = new Set(fe.map(f => "e:"+f.name));

  return await head(p, "車両は共通マスタ管理の車両から自動で表示") + sum + vehHtml + eqHtml +

  // ISO
  const iso = ((h && h.items) || []).find(x => /ISO/.test(x.text||""));
  if (iso){ const m = String(iso.date).match(/(昭和|平成|令和)(\d+|元)年/); if (m){ const base = { 昭和:1925, 平成:1988, 令和:2018 }[m[1]] + (m[2] === "元" ? 1 : Number(m[2])); big("🏅", "ISO14001 取得から", new Date().getFullYear() - base, "年", esc(iso.date)+" 取得"); } }

  const bq = sg.filter(g => g.calc === "avg3" && /ブリケット/.test(g.name||"")).sort((a,b) => String(b.fy).localeCompare(String(a.fy)))[0];
  if (bq){ const by = {}; sp2.filter(x => x.goalId === bq.id && x.year != null).forEach(x => by[x.year] = Number(x.value));
    const ys = Object.keys(by).map(Number).sort().filter(y => by[y-1] != null && by[y-2] != null);
    if (ys.length){ const yy = ys[ys.length-1]; big("♻️", "金属ブリケット化率", num((by[yy]+by[yy-1]+by[yy-2])/3), "%", "3年平均("+(yy-2)+"〜"+yy+")"+(bq.targetValue ? "・目標 "+num(bq.targetValue)+"%" : "")); } }
  // 地域貢献(前年度)
  const tn = types.map(t => String(t.name||"").trim()), am = marks.filter(m => m.countsAsActivity).map(m => m.name);
  const acts = ev.filter(e => tn.includes(String(e.title||"").trim()) || am.includes(e.mark));
  const aCur = acts.filter(e => fyOf(e.date) === fy).length, aPrev = acts.filter(e => fyOf(e.date) === prevFy).length;
  if (aCur || aPrev) big("🤝", "地域貢献活動", aPrev || aCur, "回", fyLabel(aPrev ? prevFy : fy)+(aPrev ? "" : "(途中)"));
  // 軽油の削減(前年度との比較・同じ月で)
  const lit = x => Number(x.totalLiters) || (x.vehicles||[]).reduce((a,v) => a + (Number(v.liters)||0), 0);
  const curRecs = dr.filter(x => x.yearMonth && fyOf(x.yearMonth) === fy), ms = curRecs.map(x => x.yearMonth.slice(5,7));
  const c1 = curRecs.reduce((a,x) => a + lit(x), 0), c0 = dr.filter(x => x.yearMonth && fyOf(x.yearMonth) === prevFy && ms.includes(x.yearMonth.slice(5,7))).reduce((a,x) => a + lit(x), 0);
  if (c1 && c0){ const r = (1 - c1 / c0) * 100; if (r > 0) big("⛽", "軽油の使用量を削減", num(r), "%減", "前年度の同じ時期と比べて"); }
  return await head(p, esc(pf.company || COMPANY)) + (cards.length ? '<div class="kpis" style="gap:18px;">'+cards.join("")+'</div>' : empty("表示できる数字がまだありません"));
}

/* ---------- 環境方針 ---------- */
/* ISO管理(会社情報→環境方針・認証)に入れた方針の文章を、見出し・項目カード・本文に分けて読みやすく表示する
   ・短い行(句点なし・14文字以内) → 見出し(例: 環境理念 / 環境方針)
   ・「・」「•」「●」で始まる行 → 項目名(次の行が説明)
   ・「代表取締役」で始まる行 → 締めの一文(太字) */
function policyHtml(txt){
  const lines = String(txt).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let h = "", items = [];
  const flush = () => { if (items.length){ h += '<div class="pi">'+items.map(x => '<div class="pc"><b>'+esc(x.t)+'</b>'+(x.d.length ? '<span>'+esc(x.d.join(""))+'</span>' : '')+'</div>').join("")+'</div>'; items = []; } };
  for (let i = 0; i < lines.length; i++){
    const s = lines[i];
    const m = s.match(/^[・•●■◆]\s*(.*)$/);
    if (m){ items.push({ t:m[1], d:[] }); continue; }
    if (items.length && !/^[・•●■◆]/.test(s) && !/^代表取締役/.test(s) && !(s.length <= 14 && !/[。、]/.test(s))){ items[items.length-1].d.push(s); continue; }
    flush();
    if (s.length <= 14 && !/[。、]/.test(s)) h += '<div class="ph">'+esc(s)+'</div>';
    else if (/^代表取締役/.test(s)) h += '<div class="pe">'+esc(s)+'</div>';
    else h += '<div class="pt">'+esc(s)+'</div>';
  }
  flush();
  return '<div class="pol">'+h+'</div>';
}

/* 環境方針の初期値(EMS-A-02-01 環境方針より)。ISO管理で入力・保存した内容があればそちらを優先 */
const DEFAULT_POLICY = {
  policy: "環境理念\n株式会社関根商店は、リサイクルを推進する事業者として営業活動全体において環境に与える影響を社員全員が理解し、環境保全と汚染予防が経営及び企業存続の最大重要課題と認識し、お客様にも理解と協力をお願いし継続的な改善に努めます。\n\n環境方針\n当社は、以下の方針に基づき、環境マネジメントを推進します。\n\n・法令遵守と順守義務の徹底\n環境関連の法令、条例、その他の順守義務を確実に守り、適合性の維持に努めます。\n・環境保護と汚染の予防\n省エネルギー、省資源、廃棄物の適正処理・リサイクル化を推進し、環境負荷の低減に取り組みます。\n・気候変動への配慮\n気候変動に関連する外部・内部課題を特定し、必要に応じて緩和策や適応策を環境目標に組み込みます。\n・事業活動との整合性\n当社の事業内容、規模、地域特性に応じた環境目標を設定し、達成状況を定期的にレビューします。\n・継続的改善の推進\n環境マネジメントシステムの有効性を継続的に改善し、環境パフォーマンスの向上を図ります。\n・利害関係者との協働\nお客様、地域社会、協力会社と連携し、環境保全活動への理解と協力を促進します。特に、気候変動に関する利害関係者の期待を把握し、必要に応じて対応します。\n・社内外への周知と公開\n環境方針は全社員に周知し、社外にも公開することで透明性を確保します。\n\n代表取締役社長はこの環境方針を支持し、必要な資源を提供します。",
  policyDate: "2004年10月1日制定　2025年10月1日 一部改訂",
  policySigner: "代表取締役　関根健巳"
};
async function renderPolicy(p){
  const [pf, pv] = await Promise.all([profile(), col("envPolicies")]);
  // ISO管理の「環境方針の版」で登録した版のうち、日付がいちばん新しいもの(今日以前)を今の方針として出す
  const t = todayYmd(), vers = pv.slice().sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")) || (b.createdMs||0) - (a.createdMs||0));

/* ---------- 沿革 ---------- */
/* 沿革: 昭和・平成・令和で区切った1本の年表。日付は「昭和49年9月」「昭和49年9月1日」「1974年9月1日」どれでも読める。
   日まで入っていれば日まで表示(ISO管理の「会社情報(沿革・組織図)」の✏️で入力) */
const ERA_BASE = { 昭和:1925, 平成:1988, 令和:2018 };
function histDate(s){
  const z = String(s||"").normalize("NFKC").replace(/\s+/g, "");
  let m = z.match(/(昭和|平成|令和)(\d+|元)年(?:(\d{1,2})月)?(?:(\d{1,2})日)?/);
  if (m){ const n = m[2] === "元" ? 1 : Number(m[2]); return { era:m[1], ey:n, y:ERA_BASE[m[1]] + n, mo:m[3] ? Number(m[3]) : 0, d:m[4] ? Number(m[4]) : 0 }; }
  m = z.match(/(\d{4})[年\/.-](?:(\d{1,2})[月\/.-]?)?(?:(\d{1,2})日?)?/);
  if (m){ const y = Number(m[1]), era = y >= 2019 ? "令和" : y >= 1989 ? "平成" : "昭和"; return { era, ey:y - ERA_BASE[era], y, mo:m[2] ? Number(m[2]) : 0, d:m[3] ? Number(m[3]) : 0 }; }
  return null;
}
const HIST_KIND = [
  { k:"許可", c:"#b91c1c", bg:"#fee2e2", re:/許可/ },
  { k:"認証・登録", c:"#1d4ed8", bg:"#dbeafe", re:/ISO|認証|登録|加入|健康経営|認定/ },
  { k:"表彰", c:"#a16207", bg:"#fef3c7", re:/表彰|賞/ },
  { k:"設備", c:"#047857", bg:"#d1fae5", re:/設置|導入|倉庫|設備|機/ },
  { k:"会社", c:"#6d28d9", bg:"#ede9fe", re:/./ }
];
async function renderHistory(p){
  const h = await docGet("companyInfo", "history"); const items = (h && h.items) || [];
  if (!items.length) return await head(p, COMPANY) + empty("沿革が登録されていません");
  const rows = items.map((x, i) => ({ x, i, dt:histDate(x.date), kind:HIST_KIND.find(k => k.re.test(x.text||"")) }));
  rows.sort((a, b) => a.dt && b.dt ? (a.dt.y - b.dt.y) || (a.dt.mo - b.dt.mo) || (a.dt.d - b.dt.d) || (a.i - b.i) : a.i - b.i);
  const first = rows.find(r => r.dt), years = first ? new Date().getFullYear() - first.dt.y : 0;
  const counts = HIST_KIND.map(k => ({ k, n:rows.filter(r => r.kind === k).length })).filter(o => o.n);
  let html = '<div class="hsSum">'+(first ? '創業 <b>'+first.dt.y+'</b>年から <b>'+years+'</b>年　' : '')+'出来事 <b>'+rows.length+'</b>件'+
    '<span>'+counts.map(o => '<i style="background:'+o.k.bg+';color:'+o.k.c+';">'+o.k.k+' '+o.n+'</i>').join("")+'</span></div><div class="hs">';
  let lastEra = "";
  rows.forEach(r => {
    const d = r.dt;
    if (d && d.era !== lastEra){ const ys = rows.filter(q => q.dt && q.dt.era === d.era).map(q => q.dt.y);
      html += '<div class="hsEra">'+d.era+'<small>'+Math.min(...ys)+'〜'+Math.max(...ys)+'年</small></div>'; lastEra = d.era; }
    const main = d ? d.y+'年'+(d.mo ? d.mo+'月' : '')+(d.d ? d.d+'日' : '') : esc(r.x.date);
    const sub = d ? d.era+(d.ey === 1 ? '元' : d.ey)+'年'+(d.mo ? d.mo+'月' : '')+(d.d ? d.d+'日' : '') : '';
    html += '<div class="hsRow"><div class="hsD"><b>'+main+'</b>'+(sub ? '<small>'+sub+'</small>' : '')+'</div>'+
      '<div class="hsX"><i style="background:'+r.kind.bg+';color:'+r.kind.c+';">'+r.kind.k+'</i>'+esc(r.x.text)+'</div></div>';
  });
  return await head(p, COMPANY) + html + '</div><div class="note" style="margin-top:10px;">日付は ISO管理の「会社情報(沿革・組織図)」の ✏️ で「昭和49年9月1日」のように日まで入れると、日まで表示されます。</div>';
}

async function renderCustlog(p){

  const sumM = ms => l.filter(x => ms.includes(Number(String(ymOf(x)).slice(5,7)))).reduce((a,x) => a + (Number(x.total)||0), 0);
  const h1 = sumM([8,9,10,11,12,1]), h2 = sumM([2,3,4,5,6,7]), tot = h1 + h2;

    '<div class="kpis"><div class="kpi"><div class="k">上半期計(8〜1月)</div><div class="v">'+num(h1,0)+'<small>円</small></div></div>'+
    '<div class="kpi"><div class="k">下半期計(2〜7月)</div><div class="v">'+num(h2,0)+'<small>円</small></div></div>'+
    '<div class="kpi"><div class="k">年間合計</div><div class="v">'+num(tot,0)+'<small>円</small></div></div>'+
    '<div class="kpi"><div class="k">前期繰越額 → 繰越金額</div><div class="v" style="font-size:24px;">'+num(carryIn[P.cur],0)+' → '+num(carryIn[P.cur]+tot,0)+'<small>円</small></div></div></div>'+
    '<div class="tw"><table class="t"><tr><th>月</th><th>回数</th><th>重さ(kg)</th><th>金額(円)</th></tr>'+byM.map(x =>
      '<tr><td class="c">'+x.m+'月</td><td class="r">'+(x.n||"-")+'</td><td class="r">'+(x.kg ? num(x.kg) : "-")+'</td><td class="r">'+(x.n ? num(x.yen,0) : "-")+'</td></tr>').join("")+'</table></div>' : empty());
}

/* ---------- 軽油使用量 ---------- */
async function renderDiesel(p){
  const [r, tg, vs, ph] = await Promise.all([col("dieselRecords"), col("dieselTargets"), col("master_vehicles"), col("isoPhotos")]);
  eqPhotos = ph;
  const recs = r.filter(x => x.yearMonth);
  const P = regPer(p.key, pickPeriods(recs.map(x => fyOf(x.yearMonth)), p.key));
  const l = recs.filter(x => fyOf(x.yearMonth) === P.cur);
  const lit = x => Number(x.totalLiters) || (x.vehicles||[]).reduce((a,v) => a + (Number(v.liters)||0), 0);
  const tot = l.reduce((a,x) => a + lit(x), 0);
  const start = P.cur ? P.cur.split("-")[0] : "";
  const prevFy = P.cur ? (Number(start)-1)+"-"+start : "";
  // 前年度と比べるときは、今年度に記録がある月だけで比べる(途中の年度でも正しく比べられるように)
  const curMs = l.map(x => x.yearMonth.slice(5,7));
  const prevTot = recs.filter(x => fyOf(x.yearMonth) === prevFy && curMs.includes(x.yearMonth.slice(5,7))).reduce((a,x) => a + lit(x), 0);
  const t = tg.find(x => String(x.year) === start);
  const co2 = start === "2024" ? null : tot * 2.58 / 1000;
  const byM = FY_MONTHS.map(m => { const ym = fyMonthYm(P.cur, m); const xs = l.filter(x => x.yearMonth === ym); return { m, has:xs.length > 0, v:xs.reduce((a,x) => a + lit(x), 0) }; });
  const mx = Math.max(1, ...byM.map(x => x.v));
  return await head(p, P.cur ? fySub(P.cur) : "", perHtml(p.key, P, fyLabel)) + (P.cur ?
    '<div class="kpis"><div class="kpi"><div class="k">年間使用量</div><div class="v">'+num(tot)+'<small>L</small></div></div>'+
    '<div class="kpi"><div class="k">CO₂換算量</div><div class="v">'+(co2 == null ? '約416<small>トンCO₂(報告値)</small>' : num(co2)+'<small>トンCO₂</small>')+'</div></div>'+
    (prevTot ? '<div class="kpi"><div class="k">前年度の同じ時期と比べて</div><div class="v">'+num(tot / prevTot * 100)+'<small>%</small></div></div>' : '')+
    (t ? '<div class="kpi"><div class="k">目標</div><div class="v">'+num(t.targetLiters)+'<small>L</small></div></div>' : '')+'</div>'+
    '<div class="tw"><table class="t"><tr><th style="width:80px">月</th><th style="width:160px">使用量(L)</th><th>グラフ</th></tr>'+byM.map(x =>
      '<tr><td class="c">'+x.m+'月</td><td class="r">'+(x.has ? num(x.v) : "-")+'</td><td><div class="bar" style="height:18px;"><i style="width:'+(x.v / mx * 100)+'%;background:linear-gradient(90deg,#818cf8,#1e3a5f)"></i></div></td></tr>').join("")+'</table></div>'+
    '<div class="note">CO₂換算係数 2.58kg-CO₂/L</div>' + dieselByVehicle(l, vs, ph) : empty());
}
/* 車両別の使用量(写真の記録の車両写真と連動。車両の呼び名・車番の数字で照合) */
function dieselByVehicle(l, vs, ph){
  const by = {}; l.forEach(x => (x.vehicles||[]).forEach(v => { const n = String(v.name||"").trim(); if (!n) return; by[n] = (by[n]||0) + (Number(v.liters)||0); }));
  const names = Object.keys(by).sort((a,b) => by[b] - by[a]);
  if (!names.length) return "";
  const dig = s => String(s||"").replace(/[^\d]/g, "");
  const find = n => vs.find(v => String(v.nickname||"").trim() === n || String(v.number||"").trim() === n) ||
    (/^\d+$/.test(n) ? vs.find(v => dig(v.number).endsWith(n) && dig(v.number).length - n.length <= 3 && /\d/.test(String(v.number||"").slice(-1))) : null);
  const mx = by[names[0]] || 1;
  return '<h3 class="sec">車両別の使用量</h3><div class="tw"><table class="t"><tr><th style="width:110px">写真</th><th>車両</th><th style="width:160px">使用量(L)</th><th>グラフ</th></tr>'+names.map(n => { const v = find(n);
    return '<tr><td class="c">'+(v ? phThumb(ph, v.id, 88) : '')+'</td><td><b>'+esc(n)+'</b>'+(v && v.model ? '<div class="note">'+esc(v.model)+'</div>' : '')+'</td><td class="r">'+num(by[n])+'</td>'+
      '<td><div class="bar" style="height:14px;"><i style="width:'+(by[n] / mx * 100)+'%;background:linear-gradient(90deg,#818cf8,#1e3a5f)"></i></div></td></tr>'; }).join("")+'</table></div>';
}

    return '<tr><td><b>'+esc(t.name)+'</b></td><td class="r">'+num(u)+' '+esc(t.unit||"")+'</td><td class="r">'+(f ? num(u*f/1000, 2)+' t' : '-')+'</td><td class="r">'+(up ? num(u/up*100)+' %' : '-')+'</td></tr>'; }).join("");

    return '<tr><td class="c">'+m+'月</td>'+types.map(t => { const v = x ? (x.types||[]).filter(y => y.name === t.name).reduce((a,y) => a + (Number(y.usage)||0), 0) : null; return '<td class="r">'+(x ? num(v) : "-")+'</td>'; }).join("")+'</tr>'; }).join("");

    '<div class="kpis"><div class="kpi"><div class="k">合計CO₂換算量</div><div class="v">'+num(co2All, 2)+'<small>トンCO₂</small></div></div>'+
    (co2Prev ? '<div class="kpi"><div class="k">前年度の同じ時期と比べて</div><div class="v">'+num(co2All/co2Prev*100)+'<small>%</small></div></div>' : '')+'</div>'+
    '<div class="tw"><table class="t"><tr><th>種類</th><th>年間使用量</th><th>CO₂換算</th><th>前年度の同じ時期と比べて</th></tr>'+rows+'</table></div>'+

/* ---------- SDGs ---------- */
async function renderSdgs(p){
  const [g, pr, docs, lvs] = await Promise.all([col("sdgsGoals"), col("sdgsProgress"), col("sdgsGoalDocs"), col("sdgsLevels")]);
  const P = regPer(p.key, pickPeriods(g.map(x => x.fy), p.key));
  const l = g.filter(x => x.fy === P.cur).sort((a,b) => String(a.name).localeCompare(String(b.name), "ja"));
  const card = x => {
    const ps = pr.filter(y => y.goalId === x.id);
    let val = null, pct = null, detail = "";
    if (x.calc === "sum"){ val = ps.filter(y => y.year == null).reduce((a,y) => a + (Number(y.value)||0), 0); if (x.targetValue) pct = val / x.targetValue * 100; }
    else {
      const by = {}; ps.filter(y => y.year != null).forEach(y => by[y.year] = Number(y.value));
      const ys = Object.keys(by).map(Number).sort();
      if (x.calc === "avg3"){ const ok = ys.filter(y => by[y-1] != null && by[y-2] != null); if (ok.length){ const y = ok[ok.length-1]; val = (by[y]+by[y-1]+by[y-2]) / 3; detail = (y-2)+"〜"+y+"年の3年平均"; if (x.targetValue) pct = val / x.targetValue * 100; } }
      else if (ys.length){ const y = ys[ys.length-1]; val = by[y]; detail = y+"年の値"; }
      if (ys.length) detail += (detail ? "　" : "") + ys.map(y => y+"年 "+num(by[y])).join(" / ");
    }
    return '<div class="kpi" style="min-width:320px;"><div class="k" style="font-size:18px;color:#1e3a5f;">🌱 '+esc(x.name)+'</div>'+
      (x.indicator ? '<div class="note">指標：'+esc(x.indicator)+'</div>' : '')+
      '<div class="v">'+(val == null ? '-' : num(val))+'<small>'+esc(x.unit||"")+(x.targetValue ? ' / 目標 '+num(x.targetValue)+' '+esc(x.unit||"") : '')+'</small></div>'+
      (pct != null ? '<div class="bar" style="margin-top:6px;"><i style="width:'+Math.min(100, pct)+'%"></i></div><div class="note">達成率 '+num(pct)+'%</div>' : '')+
      (detail ? '<div class="note">'+esc(detail)+'</div>' : '')+(x.notes ? '<div class="note">'+esc(x.notes)+'</div>' : '')+
      // 資料(ISO管理のSDGsで目標ごとにアップ)と、水質の目標は分析証のある水質検査へ
      docs.filter(d => d.goalId === x.id).sort((a,b) => (a.createdMs||0) - (b.createdMs||0)).map(d =>
        '<button class="openBtn" style="margin:8px 6px 0 0;" onclick="openChunked(\'sdgsGoalChunks\',\''+d.id+'\',\''+esc(d.fileType||"application/pdf")+'\',\''+esc(String(d.title||"資料").replace(/'/g,""))+'\')">資料を見る：'+esc(d.title || d.fileName || "資料")+'</button>').join("")+
      (/水質/.test(x.name||"") ? '<button class="openBtn" style="margin:8px 6px 0 0;" onclick="goKey(\'water\')">分析証を見る(水質検査の記録へ) ›</button>' : '')+'</div>';
  };
  return await head(p, P.cur ? fySub(P.cur) : "", perHtml(p.key, P, fyLabel)) + (l.length ? '<div class="kpis">'+l.map(card).join("")+'</div>' : empty()) + sdgsLevelHtml(lvs, docs) +
    '<a href="'+SDGS_PORTAL+'" target="_blank" rel="noopener" style="display:block;border:1px solid #cbd5e1;border-left:5px solid #15803d;border-radius:10px;padding:12px 16px;margin-top:16px;text-decoration:none;background:#f8fafc;">'+
    '<div style="font-size:17px;font-weight:bold;color:#166534;">NAGANO SDGs BUSINESS PORTAL(長野県公式) ›</div><div class="note">長野県SDGs推進企業の登録企業検索(上田市)。当社の登録情報はこちらで公開されています</div></a>';
}
/* SDGs取組レベル結果(長野県SDGs推進企業登録制度)。社外に出せるのは結果レポート2ページ目の内容だけなので、数字と「公開用」の添付だけを出す(全ページ・社内用は出さない) */
function sdgsLevelHtml(lvs, docs){
  if (!lvs.length) return "";
  const L = lvs.slice().sort((a,b) => String(b.issued||"").localeCompare(String(a.issued||"")))[0];
  const prev = lvs.slice().sort((a,b) => String(b.issued||"").localeCompare(String(a.issued||"")))[1];
  const IT = [["env","環境"],["eco","経済"],["soc","社会"],["inner","社内浸透"],["impl","経営実装"]];
  const ST = ["SDGsを理解する","優先課題を決定する","目標を設定する","経営に統合する","報告とコミュニケーション"];
  const pc = it => it && Number(it.m) ? Math.round(Number(it.s) / Number(it.m) * 100) : null;
  const pub = docs.filter(d => d.goalId === "level-pub:"+L.id);
  return '<h3 class="sec">SDGs取組レベル(長野県SDGs推進企業登録制度)<span class="recQ">'+esc(fd(L.issued))+' 発行</span></h3>'+
    '<div class="kpis"><div class="kpi"><div class="k">SDGs経営実装度</div><div class="v">'+esc(L.rank || "—")+'<small>(A〜E)</small></div></div></div>'+
    '<div class="tw"><table class="t"><tr><th>項目</th><th>スコア</th><th>得点率</th><th>レベル(1〜5)</th>'+(prev ? '<th>前回('+esc(fd(prev.issued))+')</th>' : '')+'</tr>'+IT.map(([k, n]) => { const it = (L.items||{})[k] || {}, p1 = pc(it), p0 = prev ? pc((prev.items||{})[k]) : null;
      return '<tr><td><b>'+n+'</b></td><td class="c">'+(it.s ?? "-")+' / '+(it.m ?? "-")+'</td><td><div class="bar" style="height:14px;"><i style="width:'+(p1||0)+'%"></i></div><div class="note" style="margin:0;">'+(p1 ?? "-")+'%</div></td><td class="c">'+(it.lv ?? "-")+'</td>'+
        (prev ? '<td class="c">'+(p0 ?? "-")+'%'+(p0 != null && p1 != null ? (p1 >= p0 ? ' <span class="ok">↑</span>' : ' <span class="ng">↓</span>') : '')+'</td>' : '')+'</tr>'; }).join("")+'</table></div>'+
    '<div class="tw" style="margin-top:8px;"><table class="t"><tr>'+ST.map((n, j) => '<th>Step'+(j+1)+'<br><span style="font-weight:normal;">'+n+'</span></th>').join("")+'</tr><tr>'+ST.map((_, j) => '<td class="c"><b>'+((L.steps||[])[j] ?? "-")+'</b>%</td>').join("")+'</tr></table></div>'+
    pub.map(d => '<button class="openBtn" style="margin:8px 6px 0 0;" onclick="openChunked(\'sdgsGoalChunks\',\''+d.id+'\',\''+esc(d.fileType||"application/pdf")+'\',\'SDGs取組レベル 結果レポート(公開用)\')">結果レポートを見る(公開用)</button>').join("");
}
const SDGS_PORTAL = "https://nagano-sdgs.com/company/?f29%5B0%5D=%E4%B8%8A%E7%94%B0&f1&f4%5B0%5D=%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9%E6%A5%AD%EF%BC%88%E3%81%BB%E3%81%8B%E3%81%AB%E5%88%86%E9%A1%9E%E3%81%95%E3%82%8C%E3%81%AA%E3%81%84%E3%82%82%E3%81%AE%EF%BC%89&fx2&pg=dt&bpage=2";

/* ---------- 監視・測定の計画(9.1.1) ----------
   各記録ページを自動で一覧にする(最後に実施した日・今年度の回数は記録から自動)。
   頻度・判断基準は、ISO管理の「監視・測定の計画」に手で入れた行があればそちらを優先して使う */
const MON_ITEMS = [
  { key:"water", name:"水質検査", what:"排水の水質", method:"外部の検査機関による水質検査", criteria:"排水基準(pHなど)", c:"waterTests", words:["水質"] },
  { key:"noise", name:"騒音チェック", what:"敷地境界の騒音", method:"騒音計による測定", criteria:"70dB以下", c:"noiseChecks", words:["騒音"] },
  { key:"comp", name:"圧縮機定期点検", what:"圧縮梱包機の状態", method:"点検表(EMS-C-21)による点検", criteria:"全項目 異常なし", c:"compressorInspections", words:["圧縮"] },
  { key:"safety", name:"安全衛生パトロール", what:"職場の安全・防火", method:"チェック表(EMS-C-25・18項目)", freq:"月1回", criteria:"不備ゼロ", c:"safetyPatrols", words:["パトロール","安全衛生"] },
  { key:"freon", name:"フロン排出抑制法簡易点検", what:"フロン類使用機器", method:"簡易点検", freq:"3か月に1回", criteria:"フロン排出抑制法の簡易点検", c:"freonRecords", words:["フロン"] },
  { key:"clean", name:"クリーン度チェック", what:"構内の清潔さ", method:"区域ごとの点数評価", criteria:"", c:"cleanlinessChecks", words:["クリーン","清潔"] },
  { key:"metal", name:"金属拾い上げ", what:"金属の拾い出し(資源化)", method:"品目ごとの数量×単価の集計", criteria:"", c:"metalRecords", words:["金属","拾い"] },
  { key:"diesel", name:"軽油使用量", what:"軽油の使用量(CO₂)", method:"給油記録の集計", freq:"毎月", criteria:"年度目標", c:"dieselRecords", ym:true, words:["軽油"] },
  { key:"lifeline", name:"ライフライン(電気・ガス・水道)", what:"電気・ガス・水道の使用量", method:"検針票の集計", freq:"毎月", criteria:"前年度との比較", c:"lifelineRecords", ym:true, words:["ライフライン","電気","ガス","水道"] }
];
async function renderMonitoring(p){
  const [regs, pm, ...data] = await Promise.all([col(ISO_REG_COL), loadPurposes()].concat(MON_ITEMS.map(m => col(m.c))));
  const manual = regs.filter(r => r.reg === "monitoring" && !r.draft);
  const fy = curFy(), used = new Set();
  const dOf = (m, x) => m.ym ? (x.yearMonth || "") : String(x.date || x.yearMonth || "").slice(0, 10);
  const rows = MON_ITEMS.map((m, i) => {
    const l = data[i].map(x => dOf(m, x)).filter(Boolean).sort();
    const last = l[l.length-1] || "", n = l.filter(d => fyOf(d.slice(0,7)) === fy).length;
    const mr = manual.find(r => m.words.some(w => String(r.item||"").includes(w) || String(r.record||"").includes(w)));
    if (mr) used.add(mr.id);
    const freq = (mr && mr.freq) || m.freq || "", crit = (mr && mr.criteria) || m.criteria || "";
    const code = (pm[PAGES.find(x => x.key === m.key)?.purpose] || {}).emsCode || "";
    return '<tr><td><button class="openBtn" style="font-weight:bold;" onclick="goKey(\''+m.key+'\')">'+esc(m.name)+' ›</button>'+(code ? '<div class="note">'+esc(code)+'</div>' : '')+'</td>'+
      '<td>'+esc((mr && mr.item) || m.what)+'</td><td>'+esc((mr && mr.method) || m.method)+'</td><td class="c">'+(freq ? esc(freq) : '<span class="note">—</span>')+'</td><td>'+(crit ? esc(crit) : '<span class="note">—</span>')+'</td>'+
      '<td class="c nw">'+(last ? esc(m.ym ? last.replace(/^(\d{4})-0?(\d+)$/, "$1/$2") : fd(last)) : '<span class="note">記録なし</span>')+'</td><td class="c">'+n+'<small>'+(m.ym ? 'か月' : '回')+'</small></td></tr>';
  }).join("");
  const rest = manual.filter(r => !used.has(r.id));
  return await head(p, "ISO14001 9.1.1・名前を押すと記録のページへ") + await planDocBtns("monitoring") +
    '<div class="tw"><table class="t"><tr><th>記録のページ</th><th>監視・測定する対象</th><th>方法</th><th>頻度</th><th>判断基準</th><th>最後に実施</th><th>'+fyLabel(fy)+'</th></tr>'+rows+'</table></div>'+
    (rest.length ? '<h3 class="sec">その他の監視・測定</h3><div class="tw"><table class="t"><tr><th>監視・測定する項目</th><th>方法</th><th>頻度</th><th>判断基準</th><th>担当</th><th>記録の場所</th></tr>'+
      rest.map(r => '<tr><td><b>'+esc(r.item)+'</b></td><td>'+esc(r.method)+'</td><td class="c">'+esc(r.freq)+'</td><td>'+esc(r.criteria)+'</td><td class="c">'+esc(r.owner)+'</td><td>'+esc(r.record)+'</td></tr>').join("")+'</table></div>' : '')+
    '<div class="note" style="margin-top:8px;">頻度・判断基準は、ISO管理の「監視・測定の計画」に同じ項目を入れるとそちらが優先されます。測定に使う機器(騒音計・トラックスケールなど)の確認は「測定機器の点検・校正」のページです。</div>';
}

/* =====================================================================
   画面の切り替え・印刷
   ===================================================================== */
let cur = 0;
/* 業務用の落ち着いた表示にするため、絵文字は画面に出さない(◀ ▶ ✓ などの記号は残す) */
const EMOJI_RE = /(?![\u25C0\u25B6\u2713\u2714\u2715\u2716\u2192\u2190\u2191\u2193\u25CB\u00D7\u25B3])\p{Extended_Pictographic}\uFE0F?\s?/gu;
function noEmoji(h){ return String(h).replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag ? tag : txt.replace(EMOJI_RE, "")); }
/* 「開く」で別のページへ飛んだとき、元のページに戻れるようにする */
let backStack = [], lastKey = "", goingBack = false;
function goBackPage(){ const k = backStack.pop(); if (!k){ go(0); return; } goingBack = true; const i = coursePages().findIndex(x => x.key === k); go(i >= 0 ? i : 0); }
async function show(i){
  const cp = coursePages();
  cur = Math.max(0, Math.min(cp.length-1, i));
  const p = cp[cur];
  // 見たページを順に覚えておき、「← 戻る」で1つ前に見たページへ戻る
  if (lastKey && lastKey !== p.key && !goingBack && backStack[backStack.length-1] !== lastKey){ backStack.push(lastKey); if (backStack.length > 30) backStack.shift(); }
  goingBack = false; lastKey = p.key;
  document.getElementById("barTtl").textContent = p.name;
  document.getElementById("backBt").disabled = !backStack.length;   // いつも同じ場所に出しておく(ボタンの位置がずれないように)
  document.getElementById("stage").classList.add("busy"); setTimeout(() => document.getElementById("stage").classList.remove("busy"), 8000);
  document.getElementById("barPg").textContent = COURSES[course].name+"　"+(cur+1)+" / "+cp.length;
  try { history.replaceState(null, "", "#"+p.key); } catch(e){}
  touched = new Set();
  const html = await renderFull(p);
  if (coursePages()[cur] !== p) return;   // 読み込み中に別のページへ移ったとき
  document.getElementById("stage").classList.remove("busy");
  document.getElementById("stage").innerHTML = '<div class="slide">'+noEmoji(html)+'</div>'+
    (p.key !== "cover" ? '<div class="noPrintBar" style="text-align:center;margin:14px 0 30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'+
      (backStack.length ? '<button class="openBtn" style="font-size:16px;padding:10px 22px;" onclick="goBackPage()">← 戻る</button>' : '')+
      '<button class="openBtn" style="font-size:16px;padding:10px 22px;" onclick="go(0)">目次へ</button><button class="openBtn" style="font-size:16px;padding:10px 22px;" onclick="printCurrent()">このページを印刷</button></div>' : '');
}
function go(i){ show(i); window.scrollTo({ top:0 }); }
// 上のバーが2段・3段になっても、ページの中身がバーの下に隠れないようにする
function fitBar(){ const b = document.getElementById("bar"), st = document.getElementById("stage"); if (b && st) st.style.paddingTop = (b.offsetHeight + 16)+"px"; }
window.addEventListener("resize", fitBar); window.addEventListener("load", fitBar); setTimeout(fitBar, 300);
/* 読み込んだデータは開いている間とっておくので、ISO管理で入力してからこの画面に戻ったら、読み直して今のページを描き直す */
let hiddenAt = 0;
function refreshData(){ Object.keys(cache).forEach(k => delete cache[k]); purposes = null; if (typeof ContractStats !== "undefined") ContractStats.reset();
  if (!document.getElementById("fileViewer")){ const y = window.scrollY; show(cur).then(() => window.scrollTo({ top:y })); } }
// 別のタブ(ISO管理など)に行って30秒以上たってから戻ったときだけ読み直す(押した瞬間に描き直されてボタンがずれないように)
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 30000){ hiddenAt = 0; refreshData(); } });
function step(d){ go(cur + d); }
document.addEventListener("keydown", e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (document.getElementById("fileViewer")) return;   // 資料を開いている間はページを送らない
  if (["ArrowRight","PageDown"].includes(e.key) || (e.key === " " && !e.shiftKey)){ e.preventDefault(); step(1); }
  if (["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); step(-1); }
  if (e.key === "Home") go(0);
});
(function(){ // スワイプ
  let sx = 0, sy = 0, on = false;
  document.addEventListener("touchstart", e => { on = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
  document.addEventListener("touchend", e => { if (!on) return; on = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1); }, { passive:true });
})();
function toggleFull(){
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
  else document.exitFullscreen && document.exitFullscreen();
}
function doPrint(html){
  document.getElementById("printArea").innerHTML = html;
  setTimeout(() => window.print(), 300);
}
/* 印刷の上に会社名・ページ名・印刷日 */
function printHead(p){ const t = new Date(); return '<div style="display:flex;justify-content:space-between;font-size:10pt;color:#475569;border-bottom:1px solid #cbd5e1;padding-bottom:4px;margin-bottom:8px;"><span>'+esc(COMPANY)+'　環境への取り組み　'+esc(p.name)+'</span><span>印刷日 '+t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate()+'</span></div>'; }
async function printCurrent(){
  const p = coursePages()[cur]; touched = new Set();
  tkPrinting = true;
  try { doPrint('<div class="pslide"><div class="slide">'+printHead(p)+noEmoji(await renderFull(p))+'</div></div>'); } finally { tkPrinting = false; }
}
async function printAll(){
  toast("全ページを準備しています…");
  const cp = coursePages(), parts = [], pf = await profile();
  tkPrinting = true;
  try {
    for (const p of cp){ if (p.key === "cover") continue; touched = new Set(); parts.push('<div class="pslide"><div class="slide">'+printHead(p)+noEmoji(await renderFull(p))+'</div></div>'); }
  } finally { tkPrinting = false; }
  const t = new Date();
  let toc = "", lastCh = -1, n = 0;
  cp.forEach(x => { if (x.key === "cover") return; n++;
    if (x.ch !== lastCh){ const c = CHAPTERS.find(c => c.id === x.ch); toc += '<div style="font-weight:900;color:#1e3a5f;margin-top:6px;break-inside:avoid;">'+esc(c.name)+(c.clause ? '(ISO14001 '+esc(c.clause)+')' : '')+'</div>'; lastCh = x.ch; }
    toc += '<div>'+n+'.　'+esc(x.name)+'</div>'; });
  const cover = '<div class="pslide"><div class="slide"><div class="cover" style="padding-top:40px;"><div class="co">'+esc(pf.company || COMPANY)+'</div><h1>環境への取り組み</h1><span class="iso">環境マネジメントシステム '+esc(pf.standard || "ISO 14001")+'</span>'+
    (pf.certNo ? '<div class="dt">登録番号 '+esc(pf.certNo)+'</div>' : '')+'<div class="dt">'+t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日 現在</div></div>'+
    '<h3 class="sec" style="margin-top:24px;">目次</h3><div style="column-count:3;column-gap:24px;font-size:12pt;line-height:1.9;">'+toc+'</div></div></div>';
  doPrint(cover + parts.join(""));
}

/* ---------- 会社概要・方針・認証の入力 ---------- */
const SET_FIELDS = ["company","rep","address","founded","employees","business","policy","policyDate","policySigner","standard","certNo","certBody","certFirst","certExpiry","nextAudit","scope"];
async function openSet(){
  const pf = await profile();
  SET_FIELDS.forEach(f => document.getElementById("s_"+f).value = pf[f] || "");
  // 環境方針がまだ保存されていなければ、今表示している初期値(Wordの方針)を入れておく。直してから保存できる
  if (!pf.policy){ ["policy","policyDate","policySigner"].forEach(f => { if (!pf[f]) document.getElementById("s_"+f).value = DEFAULT_POLICY[f]; }); }
  document.getElementById("setBg").classList.add("show");
}
function closeSet(){ document.getElementById("setBg").classList.remove("show"); }
async function saveSet(){
  const data = {}; SET_FIELDS.forEach(f => data[f] = document.getElementById("s_"+f).value.trim());
  data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  const b = document.getElementById("s_save"); b.disabled = true;
  try {
    await db.collection("companyInfo").doc("profile").set(data, { merge:true });
    delete cache["companyInfo/profile"]; closeSet(); toast("✅ 保存しました"); show(cur);
  } catch(e){ console.error(e); alert("保存できませんでした: "+e.message); }
  finally { b.disabled = false; }
}

/* 最初に開くページ(アドレスの #名前 があればそのページ) */
(function(){ const h = location.hash.replace("#",""); const c = h ? courseFor(h) : null; if (c) course = c; const i = coursePages().findIndex(p => p.key === h); show(i >= 0 ? i : 0); })();
