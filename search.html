<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点検データ検索</title>
<style>
body{font-family:Arial,"Hiragino Sans",sans-serif;margin:0;background:#eef3f8;color:#222}
.wrap{max-width:900px;margin:auto;padding:20px}
h1{text-align:center;font-size:28px;color:#1976d2}
.backBtn{
display:inline-block;background:#607d8b;color:#fff;font-size:15px;font-weight:bold;
padding:10px 20px;border-radius:10px;border:none;margin-bottom:16px;cursor:pointer;
}
.searchBox{background:white;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
label{display:block;font-size:18px;font-weight:bold;margin:12px 0 6px}
select,input{width:100%;padding:12px;font-size:18px;border-radius:10px;border:1px solid #aaa;box-sizing:border-box}
.btnRow{display:flex;gap:10px;margin-top:16px}
button{flex:1;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:bold;color:white}
.searchBtn{background:#1976d2}
.printBtn{background:#555}
.result{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.result h3{margin:0 0 10px;color:#1976d2}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#e3ecf9}
.bad{color:#d60000;font-weight:bold}
.memoLine{font-size:13px;color:#555;text-align:left;padding-top:4px}
.detailBox{background:#fff8e1;border:2px solid #ff9800;border-radius:14px;padding:16px;margin:10px 0 20px;page-break-inside:avoid}
.detailBox h4{margin:0 0 10px;color:#a05a00}
.detailTable{font-size:13px}
.detailTable td:first-child,.detailTable th:first-child{width:50px}
.detailTable td:nth-child(2),.detailTable th:nth-child(2){text-align:left}
.okMark{color:#2e7d32;font-weight:bold}
.badMark{color:#d60000;font-weight:bold}
.optRow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:16px;font-weight:bold}
.optRow input{width:22px;height:22px}
.sumTable td:first-child{font-weight:bold;text-align:left}
.sumTable .zero{color:#bbb}
.result{page-break-inside:avoid}
@media print{
.optRow{display:none}
.searchBox,.printBtn,.backBtn{display:none}
body{background:white}
}
</style>
</head>
<body>
<div class="wrap">
<button class="backBtn" onclick="location.href='index.html'">← ホームに戻る</button>
<h1>🔍 点検データ検索</h1>
<div class="searchBox">
<label>車両</label>
<select id="vehicleSelect"><option value="">読み込み中...</option></select>
<label>開始日</label>
<input type="date" id="fromDate">
<label>終了日</label>
<input type="date" id="toDate">
<label class="optRow"><input type="checkbox" id="showDetail"> 日常点検の詳細(32項目)も出す <span style="font-weight:normal;font-size:13px;color:#777;">(全車両のときは、外すと車両ごとのまとめだけになります)</span></label>
<div class="btnRow">
<button class="searchBtn" onclick="doSearch()">検索する</button>
<button class="printBtn" onclick="window.print()">印刷 / PDF保存</button>
</div>
</div>
<div id="results"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="auth-gate.js?v=2"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyA1GSV7KX6qMbIFIFz2ZhPNBVksiGxanKA",
authDomain:"tenken-rakuraku.firebaseapp.com",
databaseURL:"https://tenken-rakuraku-default-rtdb.firebaseio.com",
projectId:"tenken-rakuraku",
storageBucket:"tenken-rakuraku.firebasestorage.app",
messagingSenderId:"546571524606",
appId:"1:546571524606:web:dbe38f12c4b6ab4ad148af"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db=firebase.database();

// 車両はマスタ管理(sekine-store)を大元として読む（読めないときは今までのリスト）
const sekineConfig={
apiKey:"AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
authDomain:"sekine-store.firebaseapp.com",
projectId:"sekine-store",
storageBucket:"sekine-store.firebasestorage.app",
messagingSenderId:"781856496751",
appId:"1:781856496751:web:e2e1e5de4cd803415a819a"
};
let sekineApp=null;
try{sekineApp=firebase.app("sekine");}catch(e){
 try{sekineApp=firebase.initializeApp(sekineConfig,"sekine");}catch(e2){sekineApp=null;}
}
function loadMasterVehicleNames(){
 if(!sekineApp||!firebase.firestore)return Promise.reject(new Error("firestore未読込"));
 return sekineApp.firestore().collection("master_vehicles").get().then(function(snap){
  const names=[];
  snap.forEach(function(d){
   const v=d.data();
   const disp=(v.nickname||"").trim()||(v.number||"").trim();
   if(disp)names.push(disp);
  });
  names.sort(function(a,b){return a.localeCompare(b,"ja");});
  if(!names.length)throw new Error("マスタに車両なし");
  return names;
 });
}
function loadVehicleNames(){
 return loadMasterVehicleNames().catch(function(){
  return db.ref("settings/vehicles").once("value").then(function(s){return s.val()||defaultVehicles;}).catch(function(){return defaultVehicles;});
 });
}
// 記録はあるのに一覧にない車両（名前を変えた・手放した車など）も後ろに足す
function mergeVehicles(list,dayObjs){
 const res=list.slice();
 const extra=[];
 dayObjs.forEach(function(day){
  Object.keys(day||{}).forEach(function(v){
   if(res.indexOf(v)<0&&extra.indexOf(v)<0)extra.push(v);
  });
 });
 extra.sort(function(a,b){return a.localeCompare(b,"ja");});
 return res.concat(extra);
}

const defaultVehicles=[
"340","567","アームロール","いすゞ25t","265","25tセルフ",
"6ヒアロング","5t","3tワイド","576","440","青パッカー",
"5ヒア","620","ヒノ8t","ツートン","3tパッカー","白パッカー",
"3ヒア","640","950","2.9","ヒノ","10t①",
"230","8t","セルフ","3t","新10t","三菱ワイド","軽トラ"
];

const items=[
["1-1","ブレーキ 踏みしろ"],["1-2","ブレーキ きき具合"],["1-3","ブレーキ 液量"],["1-4","ブレーキ 空気圧"],
["1-5","駐車ブレーキ レバー引きしろ"],["1-6","原動機 低速・加速の状態"],["1-7","原動機 かかり具合・異音"],
["1-8","ウォッシャー 噴射状態"],["1-9","ウォッシャー 液量"],["1-10","ワイパー 払拭状態"],
["2-1","バッテリー 液量"],["2-2","エンジンオイルの量"],["2-3","オイル漏れ・にじみ"],["2-4","冷却水の量"],
["3-1","タイヤ 空気圧"],["3-2","タイヤ 亀裂・破損"],["3-3","タイヤ 異常な摩耗"],["3-4","タイヤ 溝の深さ"],
["3-5","灯火装置 点灯具合"],["3-6","方向指示器 点滅具合"],["3-7","灯火装置 汚れ・損傷"],
["4-1","飛散防止ネットに破れ・ほつれがない"],["4-2","ネットの固定（ロープ・フック）が確実"],
["4-3","荷台に飛散物（細片・破片）が残っていない"],["4-4","風で飛びそうな軽量物がない"],
["5-1","荷物の固定具（ロープ・ラッシング）が適切"],["5-2","荷台扉・ゲートが確実に施錠されている"],
["5-3","荷物の重心が偏っていない"],["5-4","落下の恐れがある突起物がない"],
["6-1","ヘルメット・手袋など保護具着用"],["6-2","荷台への乗り降りが安全にできる状態"],
["6-3","周囲の歩行者・他車両の安全確認済み"]
];

let allData={};
let vehicleList=defaultVehicles;

function pad(n){return String(n).padStart(2,"0");}
function todayStr(){
const d=new Date();
return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function init(){
const today=todayStr();
document.getElementById("fromDate").value=today;
document.getElementById("toDate").value=today;

Promise.all([
loadVehicleNames(),
db.ref("tenkenData").once("value")
]).then(function(results){
allData=results[1].val()||{};
vehicleList=mergeVehicles(results[0],Object.keys(allData).map(function(k){return allData[k];}));
const sel=document.getElementById("vehicleSelect");
sel.innerHTML="<option value=''>-- 車両を選択 --</option>";
const allOp=document.createElement("option");
allOp.value="__ALL__";
allOp.textContent="🚛 全車両（一括）";
sel.appendChild(allOp);
vehicleList.forEach(function(v){
const op=document.createElement("option");
op.value=v;op.textContent=v;sel.appendChild(op);
});
}).catch(function(){
alert("データの読み込みに失敗しました。通信を確認して開き直してください。");
});
}

// 「2026-10-13」をその日の0時（日本時間）として扱う
function parseDateInput(str){
const p=String(str||"").split("-");
if(p.length!==3)return null;
return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
}

function parseKey(k){
const m=k.match(/^tenken_(\d+)_(\d+)_(\d+)$/);
if(!m)return null;
return {year:Number(m[1]),month:Number(m[2]),day:Number(m[3])};
}

function collectRows(vehicle,from,to){
let rows=[];
Object.keys(allData).forEach(function(k){
const p=parseKey(k);
if(!p)return;
const dateObj=new Date(p.year,p.month-1,p.day);
if(dateObj<from||dateObj>to)return;
const r=(allData[k]||{})[vehicle];
if(!r)return;
rows.push({date:p,r:r});
});

rows.sort(function(a,b){
return new Date(a.date.year,a.date.month-1,a.date.day)-new Date(b.date.year,b.date.month-1,b.date.day);
});

return rows;
}

function doSearch(){
const vehicle=document.getElementById("vehicleSelect").value;
if(!vehicle){alert("車両を選んでください");return;}

const from=parseDateInput(document.getElementById("fromDate").value);
const to=parseDateInput(document.getElementById("toDate").value);
if(!from||!to){alert("期間を入れてください");return;}
if(from>to){alert("開始日が終了日より後になっています");return;}

if(vehicle==="__ALL__"){
renderAllResults(from,to);
return;
}

renderResults(vehicle,collectRows(vehicle,from,to));
}

function statusText(done,time,staff){
if(!done)return "<span class='bad'>未確認</span>";
return "確認済<br>"+(time||"-")+" "+(staff||"-");
}

function renderDetailBox(vehicle,dateLabel,r){
const answers=(r.dailyCheck&&r.dailyCheck.answers)?r.dailyCheck.answers:{};
const memo=(r.dailyCheck&&r.dailyCheck.memo)?r.dailyCheck.memo:"";

let itemRows="";
items.forEach(function(it){
const val=answers[it[0]]||"未確認";
const cls=val==="否"?"badMark":(val==="良"?"okMark":"");
itemRows+="<tr><td>"+it[0]+"</td><td>"+it[1]+"</td><td class='"+cls+"'>"+val+"</td></tr>";
});

return "<div class='detailBox'>"+
"<h4>📋 "+vehicle+"　"+dateLabel+"　日常点検 詳細（点検者："+(r.dailyStaff||"-")+"）</h4>"+
"<table class='detailTable'><thead><tr><th>No</th><th>項目</th><th>結果</th></tr></thead>"+
"<tbody>"+itemRows+"</tbody></table>"+
(memo?"<div class='memoLine'>📝 備考："+memo+"</div>":"")+
"</div>";
}

function buildVehicleHtml(vehicle,rows,noDetail){
let html="<div class='result'><h3>🚛 "+vehicle+"</h3><table><thead><tr>"+
"<th>日付</th><th>午前</th><th>午後</th><th>日常点検</th></tr></thead><tbody>";

let detailHtml="";

rows.forEach(function(item){
const d=item.date;
const r=item.r;
const dateLabel=d.year+"/"+d.month+"/"+d.day;

let dailyCell="";
if(r.dailyDone||r.dailyCheck){
dailyCell="実施済";
if(r.dailyCheck&&r.dailyCheck.badItems&&r.dailyCheck.badItems.length){
dailyCell+="<br><span class='bad'>否："+r.dailyCheck.badItems.map(function(b){return b.no;}).join(",")+"</span>";
}
if(!noDetail)detailHtml+=renderDetailBox(vehicle,dateLabel,r);
}else{
dailyCell="<span class='bad'>未実施</span>";
}

html+="<tr><td>"+dateLabel+"</td>"+
"<td>"+statusText(r.morning,r.morningTime,r.morningStaff)+"</td>"+
"<td>"+statusText(r.afternoon,r.afternoonTime,r.afternoonStaff)+"</td>"+
"<td>"+dailyCell+"</td></tr>";
});

html+="</tbody></table></div>";
return html+detailHtml;
}

function renderResults(vehicle,rows){
const box=document.getElementById("results");
if(!rows.length){
box.innerHTML="<div class='result'>この期間・車両のデータは見つかりませんでした。</div>";
return;
}
box.innerHTML=buildVehicleHtml(vehicle,rows,false);
}

function renderAllResults(from,to){
const box=document.getElementById("results");
let html="";
let hitCount=0;
const noDetail=!document.getElementById("showDetail").checked;
let sumRows="";
const n=(v,bad)=>v?"<span"+(bad?" class='bad'":"")+">"+v+"</span>":"<span class='zero'>0</span>";

vehicleList.forEach(function(vehicle){
const rows=collectRows(vehicle,from,to);
if(!rows.length)return;
hitCount++;
html+=buildVehicleHtml(vehicle,rows,noDetail);
// 車両ごとのまとめ(回数)
let am=0,pm=0,amNg=0,pmNg=0,daily=0,dailyNg=0,badDays=0;
rows.forEach(function(it){
const r=it.r;
if(r.morning)am++;else amNg++;
if(r.afternoon)pm++;else pmNg++;
if(r.dailyDone||r.dailyCheck){daily++;if(r.dailyCheck&&r.dailyCheck.badItems&&r.dailyCheck.badItems.length)badDays++;}else dailyNg++;
});
sumRows+="<tr><td>🚛 "+vehicle+"</td><td>"+rows.length+"日</td><td>"+n(am)+"</td><td>"+n(amNg,true)+"</td><td>"+n(pm)+"</td><td>"+n(pmNg,true)+"</td><td>"+n(daily)+"</td><td>"+n(dailyNg,true)+"</td><td>"+n(badDays,true)+"</td></tr>";
});

if(!hitCount){
box.innerHTML="<div class='result'>この期間のデータは見つかりませんでした。</div>";
return;
}

const fmt=d=>(d.getMonth()+1)+"/"+d.getDate();
box.innerHTML="<div class='result'><h3>📊 全車両 車両ごとのまとめ（"+from.getFullYear()+"/"+fmt(from)+"〜"+fmt(to)+"・"+hitCount+"台にデータあり）</h3>"+
"<table class='sumTable'><thead><tr><th rowspan='2'>車両</th><th rowspan='2'>記録のある日</th><th colspan='2'>午前</th><th colspan='2'>午後</th><th colspan='2'>日常点検</th><th rowspan='2'>「否」が<br>あった日</th></tr>"+
"<tr><th>確認済</th><th>未確認</th><th>確認済</th><th>未確認</th><th>実施</th><th>未実施</th></tr></thead><tbody>"+sumRows+"</tbody></table></div>"+html;
}

init();
</script>
</body>
</html>
